# ─────────────────────────────────────────────────────────────────────────────
# 웹앱 목록 — 홈 화면 카드와 단축 주소가 모두 이 파일 하나에서 만들어집니다.
#
# 새 앱 추가 = ① webapps/<slug>/index.html 넣기  ② 아래에 항목 하나 추가.  끝.
#
#   slug      webapps/ 아래 폴더 이름. 앱 주소는 /webapps/<slug>/
#   url       (선택) 다른 곳에 있는 앱이면 그 주소. 있으면 slug 대신 이 주소로 연결
#   title     카드 제목
#   category  learn | make | play | lab  (배우기 · 만들기 · 놀기 · 실험실 — _config.yml 의 app_categories)
#   icon      (선택) 썸네일이 없을 때 쓰는 아이콘 이모지
#   desc      한두 문장 설명 (줄글, HTML 없이)
#   tags      (선택) 기술 스택 · 키워드 — 카드에서 누르면 같은 태그끼리 모아 보기, 검색에도 쓰임
#   series    (선택) 시리즈 이름 — 같은 시리즈끼리 묶어 보기 (예: 워해머)
#   featured  (선택) true 면 홈 맨 위 '대표작' 줄에도 나옴
#   usage     (선택) 사용법 2~4줄 — 카드의 '사용법'을 펼치면 보임
#   date      (선택) 추가한 날짜 YYYY-MM-DD. 최근 30일 이내면 NEW 표시
#   updated   (선택) 기능을 크게 바꾼 날짜. 최근 30일 이내면 '업데이트' 표시
#   alias     (선택) 단축 주소 목록. wbpark.app/<alias> → 앱으로 이동 (대소문자 무시)
#   repo      (선택) 소스 링크. 생략하면 이 저장소의 webapps/<slug>/ 로 자동 연결
#   thumbnail (선택) 카드 이미지. 생략하면 assets/thumbs/<slug>.webp (node tools/thumbs.js 로 생성). false 면 아이콘 (thumbs.js 도 건너뜀)
#   thumb_pos (선택) 휴대폰 카드에서 썸네일의 어느 쪽을 보일지 (CSS object-position, 예: left top). 기본 top center
#   hidden    (선택) true 면 목록에서만 숨김 (앱 주소 · 단축 주소는 그대로 동작)
#
# 같은 카테고리 안에서는 이 파일에 적힌 순서대로 보입니다.
# 글(_posts)의 front matter 에 apps: [slug] 를 적으면 그 앱 카드에 '만든 이야기' 링크가 붙습니다.
# ─────────────────────────────────────────────────────────────────────────────


