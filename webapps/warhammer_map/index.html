<script type="importmap">{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js", "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/" } }</script>
<style>
:root {
  --bg: #f7f3ef; --surface: #fdf9f6; --sunk: #ede9e6; --line: #d7d3d0; --muted: #666260; --sub: #524f4d; --ink: #302d2b; --strong: #211f1c;
  --gold: #7b5e22; --gold-fill: #d6ba86; --gold-soft: #f7e9d1; --red: #a34945; --red-soft: #ffe8e6; --matte: #403c3a; --on-matte: #f7f3ef;
  --me: #3f6a8f; --enemy: #a34945; --ok: #3d7a4f; --hl: #f2efb8;
  --field: #ebe5dc; --area: #cfc8be; --dense: #7d9468; --light: #c9b56f;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); font-family: Pretendard, 'Pretendard Variable', system-ui, -apple-system, 'Malgun Gothic', sans-serif; font-size: 14px; }
body { display: grid; grid-template-rows: auto 1fr auto; height: 100dvh; overflow: hidden; }
button { font: inherit; color: var(--ink); background: transparent; border: 1px solid var(--line); border-radius: 8px; padding: 6px 10px; cursor: pointer; min-height: 34px; }
button:hover { background: var(--sunk); }
button.pri { background: var(--gold-fill); border-color: var(--gold-fill); color: var(--strong); font-weight: 600; }
button.danger { border-color: var(--red); color: var(--red); }
button[aria-pressed="true"] { background: var(--gold-soft); border-color: var(--gold); color: var(--strong); font-weight: 600; }
button:focus-visible, input:focus-visible, select:focus-visible { outline: 3px solid #c3bc5a; outline-offset: 1px; }
input, select { font: inherit; color: var(--ink); background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 4px 6px; min-height: 30px; }
input[type=number] { width: 64px; }
input[type=checkbox] { min-height: 0; width: 16px; height: 16px; accent-color: var(--gold); }
.muted { color: var(--muted); }
.en { color: var(--muted); font-size: .85em; }

header { display: flex; gap: 8px; align-items: center; padding: 6px 10px; background: var(--matte); color: var(--on-matte); }
header .ttl { font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: 1; min-width: 0; }
header .ttl small { font-weight: 400; opacity: .8; margin-left: 6px; }
header button { color: var(--on-matte); border-color: #6b6562; }
header button:hover { background: #4d4845; }

main { position: relative; min-height: 0; display: grid; grid-template-columns: 1fr; }
#stage { position: relative; min-height: 0; overflow: hidden; background: var(--sunk); touch-action: none; }
#board { width: 100%; height: 100%; display: block; user-select: none; -webkit-user-select: none; }
#toolbar { position: absolute; left: 8px; top: 8px; display: flex; flex-direction: column; gap: 6px; z-index: 2; }
#toolbar button { background: rgba(253,249,246,.92); width: 36px; height: 36px; min-height: 0; padding: 0; font-size: 16px; box-shadow: 0 1px 2px rgba(0,0,0,.07), 0 4px 12px rgba(0,0,0,.07); }
#toolbar button[aria-pressed="true"] { background: var(--gold-soft); }
#toolbar button.txt { font-size: 11px; font-weight: 600; line-height: 1.1; }
#toolbar .only3d, body.is3d #toolbar .only2d { display: none; }
body.is3d #toolbar .only3d { display: inline-block; }
#view3d { position: absolute; inset: 0; display: none; touch-action: none; }
#view3d canvas { display: block; width: 100%; height: 100%; }
body.is3d #view3d { display: block; }
#view3d .lbl3d { position: absolute; left: 0; top: 0; transform: translate(-50%, -120%); pointer-events: none; background: var(--surface); border: 1px solid var(--strong); border-radius: 6px; padding: 1px 6px; font: 600 13px/1.4 Pretendard, sans-serif; color: var(--strong); white-space: nowrap; }
body.is3d #board { visibility: hidden; }
.kinds { display: grid; gap: 4px; }
.kind { display: grid; grid-template-columns: auto auto 1fr auto auto; gap: 8px; align-items: center; padding: 4px 6px; border: 1px solid var(--line); border-radius: 8px; }
.kind.on { border-color: var(--gold); background: var(--gold-soft); }
.kind.off { opacity: .5; }
.kind .nm { cursor: pointer; }
.kind button { min-height: 28px; padding: 2px 8px; font-size: 12px; }
#hint { position: absolute; left: 56px; right: 8px; top: 8px; pointer-events: none; display: flex; justify-content: center; z-index: 1; }
#hint span { background: rgba(253,249,246,.92); border: 1px solid var(--line); border-radius: 999px; padding: 4px 12px; font-size: 12px; color: var(--sub); }
#hint span:empty { display: none; }

#panel { background: var(--surface); border-top: 1px solid var(--line); max-height: 44dvh; overflow-y: auto; overscroll-behavior: contain; }
.tabs { display: flex; gap: 4px; padding: 6px 8px 0; position: sticky; top: 0; background: var(--surface); z-index: 1; border-bottom: 1px solid var(--line); }
.tabs button { border: none; border-bottom: 3px solid transparent; border-radius: 0; padding: 6px 10px; }
.tabs button[aria-pressed="true"] { background: transparent; border-bottom-color: var(--gold); }
.pane { padding: 10px 12px 16px; display: grid; gap: 10px; }
.row { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.row label { display: inline-flex; gap: 4px; align-items: center; }
.field { display: grid; grid-template-columns: 112px 1fr; gap: 6px; align-items: center; }
.field > span:first-child { color: var(--sub); }
h3 { margin: 4px 0 0; font-size: 13px; color: var(--sub); font-weight: 600; }
.layers { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 4px 10px; }
.layers label { display: flex; gap: 6px; align-items: center; padding: 4px 0; }
.sw { width: 14px; height: 14px; border-radius: 3px; display: inline-block; border: 1px solid rgba(0,0,0,.15); flex: none; }
.ulist { display: grid; gap: 4px; }
.uitem { display: flex; align-items: center; gap: 8px; padding: 6px 8px; border: 1px solid var(--line); border-radius: 8px; cursor: pointer; }
.uitem.on { border-color: var(--gold); background: var(--gold-soft); }
.uitem .dot { width: 10px; height: 10px; border-radius: 50%; flex: none; }
.uitem .nm { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.badge { font-size: 12px; padding: 1px 6px; border-radius: 999px; border: 1px solid var(--line); white-space: nowrap; }
.badge.ok { color: var(--ok); border-color: var(--ok); }
.badge.ng { color: var(--red); border-color: var(--red); background: var(--red-soft); }
.dist { display: grid; gap: 2px; font-variant-numeric: tabular-nums; }
.dist div { display: flex; justify-content: space-between; gap: 8px; border-bottom: 1px dashed var(--line); padding: 3px 0; }
.note { font-size: 12px; color: var(--muted); line-height: 1.5; }

#setup { position: fixed; inset: 0; background: rgba(33,31,28,.45); z-index: 10; display: flex; align-items: flex-start; justify-content: center; overflow-y: auto; padding: 16px; }
#setup[hidden] { display: none; }
.sheet { background: var(--surface); border-radius: 12px; max-width: 860px; width: 100%; padding: 16px; display: grid; gap: 14px; box-shadow: 0 4px 24px rgba(0,0,0,.2); }
.sheet h2 { margin: 0; font-size: 18px; }
.fdbtns { display: flex; flex-wrap: wrap; gap: 6px; }
.fdbtns button { display: inline-flex; flex-direction: column; align-items: flex-start; line-height: 1.25; }
.maps { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 10px; }
.mapcard { border: 2px solid var(--line); border-radius: 10px; padding: 8px; cursor: pointer; display: grid; gap: 4px; background: var(--bg); text-align: left; }
.mapcard:hover { border-color: var(--gold-fill); }
.mapcard.on { border-color: var(--gold); background: var(--gold-soft); }
.mapcard svg { width: 100%; height: auto; display: block; border-radius: 4px; }

@media (min-width: 900px) {
  body { grid-template-rows: auto 1fr; }
  main { grid-template-columns: 1fr 380px; }
  #panel { max-height: none; border-top: none; border-left: 1px solid var(--line); grid-row: 1; grid-column: 2; }
}
</style>
</head>

</main>
