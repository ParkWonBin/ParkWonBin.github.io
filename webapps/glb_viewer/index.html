---
layout: dev_apps
---
<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>3D Viewer Lab</title>
<style>
  :root {
    --bg: #1b1d22;
    --panel: rgba(28, 30, 36, .92);
    --panel-solid: #22242b;
    --line: #363943;
    --text: #e8e9ee;
    --muted: #9a9ca8;
    --accent: #7aa2ff;
    --danger: #ff6b7d;
    --map: min(42vmin, 280px);
    --gap: 10px;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: var(--bg); }
  body {
    color: var(--text);
    font: 13px/1.4 system-ui, -apple-system, "Segoe UI", "Malgun Gothic", sans-serif;
    -webkit-tap-highlight-color: transparent;
  }
  #view { position: fixed; inset: 0; }
  #view canvas { display: block; width: 100%; height: 100%; touch-action: none; }

  .hud { position: fixed; z-index: 10; }
  .panel {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 10px;
    backdrop-filter: blur(6px);
  }
  button, input, select { font: inherit; color: inherit; }
  .btn {
    background: var(--panel-solid); border: 1px solid var(--line); border-radius: 8px;
    padding: 6px 10px; cursor: pointer; min-height: 34px;
  }
  .btn:hover { border-color: #50535f; }
  .btn.danger { color: var(--danger); }
  .btn.on { border-color: var(--accent); color: var(--accent); }

  #tl {
    top: calc(env(safe-area-inset-top, 0px) + var(--gap));
    left: calc(env(safe-area-inset-left, 0px) + var(--gap));
    display: flex; flex-direction: column; gap: 8px;
    max-height: calc(100dvh - 2 * var(--gap) - env(safe-area-inset-top, 0px) - env(safe-area-inset-bottom, 0px));
    width: min(210px, calc(100vw - 80px));
  }
  #addBar { display: flex; flex-wrap: wrap; gap: 6px; padding: 6px; }
  #addBar .btn { flex: 1 0 auto; padding: 6px 8px; }

  #props { padding: 10px; overflow: auto; min-height: 0; }
  #props h3 { margin: 0 0 8px; font-size: 12px; color: var(--muted); font-weight: 600; }
  .field { display: grid; grid-template-columns: 52px 1fr; align-items: center; gap: 6px; margin-bottom: 6px; }
  .field label { color: var(--muted); }
  .field input {
    width: 100%; min-width: 0; background: var(--panel-solid); border: 1px solid var(--line);
    border-radius: 6px; padding: 5px 7px;
  }
  .field input[type="color"] { padding: 0; height: 30px; cursor: pointer; }
  .unit { color: var(--muted); font-size: 11px; }
  .actions { display: flex; gap: 6px; margin-top: 8px; }
  .actions .btn { flex: 1; }
  #modelActions { flex-wrap: wrap; }
  #modelActions #splitBtn { flex-basis: 100%; }

  #gear {
    top: calc(env(safe-area-inset-top, 0px) + var(--gap));
    right: calc(env(safe-area-inset-right, 0px) + var(--gap));
    width: 42px; height: 42px; font-size: 20px; padding: 0;
  }
  #features {
    position: fixed; z-index: 20;
    top: calc(env(safe-area-inset-top, 0px) + var(--gap) + 50px);
    right: calc(env(safe-area-inset-right, 0px) + var(--gap));
    width: min(260px, calc(100vw - 2 * var(--gap)));
    padding: 12px;
    max-height: calc(100dvh - 90px); overflow: auto;
  }
  #features h3 { margin: 0 0 8px; font-size: 12px; color: var(--muted); font-weight: 600; }
  #features label.check {
    display: flex; align-items: center; gap: 10px; padding: 7px 4px; cursor: pointer; border-radius: 6px;
  }
  #features label.check:hover { background: rgba(255,255,255,.04); }
  #features input[type="checkbox"] { width: 18px; height: 18px; accent-color: var(--accent); margin: 0; }
  #features .hint { color: var(--muted); font-size: 11px; display: block; }
  #features .actions { margin-top: 12px; }

  #mapBox {
    right: calc(env(safe-area-inset-right, 0px) + var(--gap));
    bottom: calc(env(safe-area-inset-bottom, 0px) + var(--gap));
    padding: 6px;
  }
  #mapBox.big { --map: min(78vmin, 560px); }
  .map-tools { display: flex; gap: 4px; margin-bottom: 6px; align-items: center; width: var(--map); }
  .map-tools .title { color: var(--muted); font-size: 11px; margin-right: auto; padding-left: 4px; }
  .map-tools .btn { min-height: 28px; min-width: 30px; padding: 2px 6px; }
  #minimap {
    display: block; width: var(--map); height: var(--map);
    border-radius: 6px; touch-action: none; cursor: default;
  }

  #toast {
    position: fixed; z-index: 30; left: 50%; bottom: calc(env(safe-area-inset-bottom, 0px) + 20px);
    transform: translateX(-50%); padding: 8px 14px; pointer-events: none;
    max-width: calc(100vw - 40px);
  }
  #dropHint {
    position: fixed; inset: 0; z-index: 40; display: grid; place-items: center; pointer-events: none;
    background: rgba(122,162,255,.12); border: 3px dashed var(--accent); font-size: 18px; color: var(--accent);
  }
  #ctxMenu {
    position: fixed; z-index: 25; padding: 4px; display: flex; flex-wrap: wrap; gap: 4px;
    max-width: min(360px, calc(100vw - 16px));
  }
  #modelInfo { color: var(--muted); font-size: 11px; margin: 2px 0 8px; }
  #modelActions .btn { white-space: nowrap; padding: 6px 4px; }
  #modelInfo b { color: var(--text); font-weight: 600; }
  #ctxMenu .btn { min-width: 72px; }
  #moveBar {
    position: fixed; z-index: 25; left: 50%; top: calc(env(safe-area-inset-top, 0px) + var(--gap));
    transform: translateX(-50%); padding: 6px 6px 6px 12px; display: flex; gap: 10px; align-items: center;
    max-width: calc(100vw - 130px);
  }
  body.moving #view canvas { cursor: move; }
  #fatal {
    position: fixed; inset: 0; display: grid; place-items: center; padding: 24px; text-align: center; color: var(--muted);
  }
</style>
</head>
<body>
<div id="view"></div>

<div id="tl" class="hud">
  <div id="addBar" class="panel">
    <button class="btn" data-add="box" title="상자 추가">▣ 상자</button>
    <button class="btn" data-add="cylinder" title="원기둥 추가">◎ 원기둥</button>
    <button class="btn" data-add="sphere" title="구 추가">● 구</button>
    <button class="btn" id="addModel" title="GLB 모델 불러오기">⬆ GLB</button>
    <input type="file" id="modelFile" accept=".glb,.gltf,model/gltf-binary,model/gltf+json" multiple hidden>
  </div>

  <div id="props" class="panel" hidden>
    <h3 id="propsTitle">속성</h3>
    <div id="modelInfo" hidden></div>
    <div class="field"><label for="pName">이름</label><input id="pName" data-k="name" type="text"></div>
    <div class="field"><label for="pX">X</label><input id="pX" data-k="x" type="number" step="0.1" inputmode="decimal"></div>
    <div class="field"><label for="pZ">Z</label><input id="pZ" data-k="z" type="number" step="0.1" inputmode="decimal"></div>
    <div class="field"><label for="pW">가로</label><input id="pW" data-k="w" type="number" step="0.1" min="0.05" inputmode="decimal"></div>
    <div class="field"><label for="pD">세로</label><input id="pD" data-k="d" type="number" step="0.1" min="0.05" inputmode="decimal"></div>
    <div class="field"><label for="pH">높이</label><input id="pH" data-k="h" type="number" step="0.1" min="0.05" inputmode="decimal"></div>
    <div class="field"><label for="pY">띄움</label><input id="pY" data-k="y" type="number" step="0.1" inputmode="decimal"></div>
    <div class="field"><label for="pRot">회전°</label><input id="pRot" data-k="rot" type="number" step="5" inputmode="decimal"></div>
    <div class="field" id="colorField"><label for="pColor">색</label><input id="pColor" data-k="color" type="color"></div>
    <div class="unit">단위: m</div>
    <div class="actions" id="modelActions" hidden>
      <button class="btn" id="lowBtn">⚡ 로우폴리</button>
      <button class="btn" id="dlBtn">⬇ 받기</button>
      <button class="btn" id="splitBtn" title="떨어져 있는 덩어리를 각각의 모델로 나누기">🧩 파츠 분리</button>
    </div>
    <div class="actions">
      <button class="btn" id="dupBtn">복제</button>
      <button class="btn danger" id="delBtn">삭제</button>
    </div>
  </div>
</div>

<button id="gear" class="hud btn panel" title="기능 켜기/끄기" aria-expanded="false">⚙</button>
<div id="features" class="panel" hidden>
  <h3>기능 켜기 / 끄기</h3>
  <div id="featureList"></div>
  <div class="actions">
    <button class="btn" id="resetCam">카메라 초기화</button>
    <button class="btn danger" id="resetAll">전체 초기화</button>
  </div>
</div>

<div id="mapBox" class="hud panel">
  <div class="map-tools">
    <span class="title">평면도</span>
    <button class="btn" id="zoomOut" title="축소">−</button>
    <button class="btn" id="zoomIn" title="확대">+</button>
    <button class="btn" id="mapBig" title="크게/작게">⤢</button>
  </div>
  <canvas id="minimap"></canvas>
</div>

<div id="ctxMenu" class="panel" hidden>
  <button class="btn" id="ctxMove">✥ 이동</button>
  <button class="btn" id="ctxLow" data-model-only title="폴리를 줄인 사본을 옆에 만들기">⚡ 로우폴리</button>
  <button class="btn" id="ctxSplit" data-model-only title="떨어져 있는 덩어리를 각각의 모델로 나누기">🧩 파츠 분리</button>
  <button class="btn" id="ctxDownload" data-model-only title="이 모델의 GLB 받기">⬇ 다운로드</button>
  <button class="btn danger" id="ctxDelete" title="Del 키">🗑 삭제</button>
</div>
<div id="moveBar" class="panel" hidden>
  <span>이동 중 · 클릭(손 떼기)으로 놓기 · Esc 취소</span>
  <button class="btn" id="moveCancel">취소</button>
</div>
<div id="dropHint" hidden>GLB 파일을 여기에 놓으세요</div>
<div id="toast" class="panel" hidden></div>
<div id="fatal" hidden>three.js를 불러오지 못했어요. 인터넷 연결을 확인하세요.</div>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { GLTFExporter } from 'three/addons/exporters/GLTFExporter.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { clone as cloneObject } from 'three/addons/utils/SkeletonUtils.js';

const $ = s => document.querySelector(s);
const STORE_KEY = '3d-viewer:v1';
const DEG = Math.PI / 180;
const uid = () => Math.random().toString(36).slice(2, 9);
const round2 = v => Math.round(v * 100) / 100;
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));

const FEATURES = [
  { key: 'add', label: '도형 추가 바', hint: '상자·원기둥·구·GLB 추가 버튼' },
  { key: 'minimap', label: '2D 평면도', hint: '끄면 3D 화면만 보여요' },
  { key: 'move', label: '이동', hint: '평면도에서 드래그하거나, 3D 화면에서 탭 → 이동' },
  { key: 'rotate', label: '회전 핸들', hint: '선택한 사물 위쪽 동그라미를 돌리기' },
  { key: 'scale', label: '크기 핸들', hint: '선택한 사물 모서리를 끌어 가로·세로 조절' },
  { key: 'props', label: '속성 패널', hint: '높이·띄움·색 등을 숫자로 입력' },
  { key: 'snap', label: '격자 스냅', hint: '0.5m / 15° / 0.25m 단위로 맞추기' },
  { key: 'pick3d', label: '3D 화면에서 탭하여 선택', hint: '끄면 3D 화면은 카메라 조작만' },
];
const DEFAULT_FEATURES = { add: true, minimap: true, move: true, rotate: true, scale: true, props: true, snap: false, pick3d: true };

const LABELS = { box: '상자', cylinder: '원기둥', sphere: '구', model: '모델' };

// ---------- state ----------
function defaultObjects() {
  return [
    { id: uid(), type: 'box', name: '상자', x: -2, z: 1, y: 0, w: 2, d: 1.2, h: 1, rot: 20, color: '#e76f51' },
    { id: uid(), type: 'cylinder', name: '원기둥', x: 1.5, z: -1.5, y: 0, w: 1, d: 1, h: 2.2, rot: 0, color: '#2a9d8f' },
    { id: uid(), type: 'sphere', name: '구', x: 2, z: 2, y: 0.3, w: 1.2, d: 1.2, h: 1.2, rot: 0, color: '#e9c46a' },
    // Size is a placeholder until the file loads; `fit` makes restoreAssets resize it like an imported model.
    { id: uid(), type: 'model', assetId: DEFAULT_MODEL.id, name: DEFAULT_MODEL.name.replace(/\.glb$/i, ''),
      x: 0, z: 0, y: 0, w: 1.5, d: 1.5, h: 1.5, rot: 0, color: '#ffffff', fit: true },
  ];
}
// Bundled GLB shown on first visit; fetched from next to this page when it isn't in IndexedDB yet.
const DEFAULT_MODEL = { id: 'default:shangho_261003', name: 'shangho_261003.glb', url: 'shangho_261003.glb' };
const DEFAULT_CAMERA = { pos: [9, 9, 11], target: [0, 0, 0] };

function loadState() {
  try {
    const s = JSON.parse(localStorage.getItem(STORE_KEY));
    if (s && Array.isArray(s.objects)) return s;
  } catch { /* storage unavailable */ }
  return null;
}
const saved = loadState();
let objects = saved?.objects ?? defaultObjects();
const features = { ...DEFAULT_FEATURES, ...(saved?.features ?? {}) };
const view = { cx: 0, cz: 0, S: 8, big: false, ...(saved?.view ?? {}) };
let selectedId = null;

let saveTimer = 0;
function save() {
  clearTimeout(saveTimer);
  saveTimer = setTimeout(() => {
    try {
      localStorage.setItem(STORE_KEY, JSON.stringify({
        objects, features, view,
        camera: { pos: camera.position.toArray(), target: controls.target.toArray() },
      }));
    } catch { /* storage unavailable */ }
  }, 250);
}
const objById = id => objects.find(o => o.id === id);

// ---------- model file storage (IndexedDB, since GLB files are too big for localStorage) ----------
const assetDb = (() => {
  let dbPromise;
  const open = () => dbPromise ??= new Promise((resolve, reject) => {
    const req = indexedDB.open('3d-viewer', 1);
    req.onupgradeneeded = () => req.result.createObjectStore('assets', { keyPath: 'id' });
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
  const run = async (mode, fn) => {
    const db = await open();
    return new Promise((resolve, reject) => {
      const tx = db.transaction('assets', mode);
      const req = fn(tx.objectStore('assets'));
      tx.oncomplete = () => resolve(req.result);
      tx.onerror = () => reject(tx.error);
    });
  };
  return {
    put: rec => run('readwrite', s => s.put(rec)),
    get: id => run('readonly', s => s.get(id)),
    delete: id => run('readwrite', s => s.delete(id)),
  };
})();

// ---------- three.js scene ----------
const container = $('#view');
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
container.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color('#1b1d22');
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;
scene.environmentIntensity = 0.7;

const camera = new THREE.PerspectiveCamera(50, 1, 0.1, 500);
const controls = new OrbitControls(camera, renderer.domElement);
controls.maxPolarAngle = Math.PI / 2 - 0.02;
function applyCamera(c) {
  camera.position.fromArray(c.pos);
  controls.target.fromArray(c.target);
  controls.update();
}
applyCamera(saved?.camera ?? DEFAULT_CAMERA);

const sun = new THREE.DirectionalLight(0xffffff, 1.6);
sun.position.set(8, 14, 6);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
Object.assign(sun.shadow.camera, { left: -20, right: 20, top: 20, bottom: -20, near: 1, far: 60 });
sun.shadow.bias = -0.0005;
scene.add(sun, new THREE.HemisphereLight(0xdfe6ff, 0x30323a, 0.5));

const ground = new THREE.Mesh(new THREE.PlaneGeometry(200, 200), new THREE.ShadowMaterial({ opacity: 0.28 }));
ground.rotation.x = -Math.PI / 2;
ground.receiveShadow = true;
scene.add(ground);
const grid = new THREE.GridHelper(40, 40, 0x5a5f6d, 0x34373f);
grid.position.y = 0.001;
scene.add(grid);

// Every object is content normalized to a unit cube (-0.5..0.5) inside a body scaled to (w, h, d).
const GEOMETRY = {
  box: new THREE.BoxGeometry(1, 1, 1),
  cylinder: new THREE.CylinderGeometry(0.5, 0.5, 1, 48),
  sphere: new THREE.SphereGeometry(0.5, 48, 24),
};
const OUTLINE_GEO = new THREE.EdgesGeometry(new THREE.BoxGeometry(1.02, 1.02, 1.02));
const OUTLINE_MAT = new THREE.LineBasicMaterial({ color: 0x7aa2ff });
const MISSING_MAT = new THREE.MeshBasicMaterial({ color: 0xff6b7d, wireframe: true });

const assets = new Map(); // assetId -> { name, template?, size?, error? }
const nodes = new Map();  // objectId -> { root, body, outline, content, contentKey }
const loader = new GLTFLoader();

function contentKey(o) {
  if (o.type !== 'model') return o.type;
  const a = assets.get(o.assetId);
  return `model:${o.assetId}:${a?.template ? 'ready' : 'missing'}`;
}
function makeContent(o) {
  if (o.type !== 'model') {
    const mesh = new THREE.Mesh(GEOMETRY[o.type], new THREE.MeshStandardMaterial({ roughness: 0.55, metalness: 0.05 }));
    mesh.castShadow = mesh.receiveShadow = true;
    return mesh;
  }
  const a = assets.get(o.assetId);
  if (a?.template) return cloneObject(a.template);
  return new THREE.Mesh(GEOMETRY.box, MISSING_MAT);
}
function syncNode(o) {
  let n = nodes.get(o.id);
  if (!n) {
    const root = new THREE.Group();
    root.userData.objectId = o.id;
    const body = new THREE.Group();
    const outline = new THREE.LineSegments(OUTLINE_GEO, OUTLINE_MAT);
    body.add(outline);
    root.add(body);
    scene.add(root);
    n = { root, body, outline, content: null, contentKey: null };
    nodes.set(o.id, n);
  }
  const key = contentKey(o);
  if (n.contentKey !== key) {
    if (n.content) {
      n.body.remove(n.content);
      if (o.type !== 'model') n.content.material.dispose();
    }
    n.content = makeContent(o);
    n.body.add(n.content);
    n.contentKey = key;
  }
  if (o.type !== 'model') n.content.material.color.set(o.color);
  n.root.position.set(o.x, o.y, o.z);
  n.root.rotation.y = o.rot * DEG;
  n.body.scale.set(o.w, o.h, o.d);
  n.body.position.y = o.h / 2;
  n.outline.visible = o.id === selectedId;
}
function removeNode(id) {
  const n = nodes.get(id);
  if (!n) return;
  scene.remove(n.root);
  if (n.content?.material && n.content.material !== MISSING_MAT) n.content.material.dispose();
  nodes.delete(id);
}

async function registerAsset(id, name, buffer) {
  const gltf = await new Promise((resolve, reject) => loader.parse(buffer, '', resolve, reject));
  const model = gltf.scene;
  model.updateMatrixWorld(true);
  const box = new THREE.Box3().setFromObject(model);
  const size = box.getSize(new THREE.Vector3());
  const center = box.getCenter(new THREE.Vector3());
  model.position.sub(center);
  let tris = 0;
  model.traverse(child => {
    if (!child.isMesh) return;
    child.castShadow = child.receiveShadow = true;
    const g = child.geometry;
    tris += (g.index ? g.index.count : g.attributes.position?.count ?? 0) / 3;
  });
  const template = new THREE.Group();
  template.scale.set(1 / Math.max(size.x, 1e-4), 1 / Math.max(size.y, 1e-4), 1 / Math.max(size.z, 1e-4));
  template.add(model);
  const asset = { name, template, size: size.toArray(), bytes: buffer.byteLength, tris: Math.round(tris) };
  assets.set(id, asset);
  return asset;
}
async function restoreAssets() {
  const ids = [...new Set(objects.filter(o => o.type === 'model').map(o => o.assetId))];
  await Promise.all(ids.map(async id => {
    try {
      const rec = await assetDb.get(id) ?? (id === DEFAULT_MODEL.id ? await fetchDefaultModel() : null);
      if (!rec) throw new Error('missing');
      await registerAsset(id, rec.name, rec.data);
    } catch {
      assets.set(id, { error: true });
    }
  }));
  if (ids.some(id => assets.get(id)?.error)) toast('저장된 GLB 일부를 찾지 못해 빨간 상자로 표시했어요');
  let fitted = false;
  for (const o of objects) {
    const a = o.fit && assets.get(o.assetId);
    if (!a?.template) continue;
    const [sx, sy, sz] = a.size;
    const f = 1.5 / Math.max(sx, sy, sz, 1e-4);
    Object.assign(o, { w: round2(sx * f), h: round2(sy * f), d: round2(sz * f) });
    delete o.fit;
    fitted = true;
  }
  objects.forEach(syncNode);
  if (fitted) { renderProps(); save(); }
  requestRender();
}
async function fetchDefaultModel() {
  const res = await fetch(DEFAULT_MODEL.url);
  if (!res.ok) throw new Error(`HTTP ${res.status}`);
  const rec = { id: DEFAULT_MODEL.id, name: DEFAULT_MODEL.name, data: await res.arrayBuffer() };
  await assetDb.put(rec).catch(() => {});
  return rec;
}

// ---------- render loop (on demand) ----------
let frameQueued = false;
function requestRender() {
  if (frameQueued) return;
  frameQueued = true;
  requestAnimationFrame(() => {
    frameQueued = false;
    renderer.render(scene, camera);
    drawMinimap();
  });
}
controls.addEventListener('change', requestRender);
controls.addEventListener('end', save);

new ResizeObserver(() => {
  const w = container.clientWidth, h = container.clientHeight;
  renderer.setSize(w, h, false);
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
  requestRender();
}).observe(container);

// ---------- selection & edits ----------
function select(id) {
  const prev = selectedId;
  selectedId = id && objById(id) ? id : null;
  for (const o of objects) if (o.id === prev || o.id === selectedId) syncNode(o);
  renderProps();
  requestRender();
}
function objectChanged(o, live) {
  syncNode(o);
  renderProps();
  requestRender();
  if (!live) save();
}
function addObject(o) {
  objects.push(o);
  syncNode(o);
  select(o.id);
  save();
}
function spawnPoint() {
  const jitter = () => (Math.random() - 0.5) * 1.5;
  return { x: round2(view.cx + jitter()), z: round2(view.cz + jitter()) };
}
function nextColor() {
  const c = new THREE.Color().setHSL(Math.random(), 0.55, 0.58);
  return '#' + c.getHexString();
}
function deleteSelected() {
  const o = objById(selectedId);
  if (!o) return;
  endMove(false);
  closeMenu();
  objects = objects.filter(x => x !== o);
  removeNode(o.id);
  if (o.type === 'model' && !objects.some(x => x.assetId === o.assetId)) {
    assets.delete(o.assetId);
    assetDb.delete(o.assetId).catch(() => {});
  }
  select(null);
  save();
}
function duplicateSelected() {
  const o = objById(selectedId);
  if (!o) return;
  addObject({ ...o, id: uid(), name: o.name + ' 복사', x: round2(o.x + 0.6), z: round2(o.z + 0.6) });
}

document.querySelectorAll('[data-add]').forEach(btn => btn.addEventListener('click', () => {
  const type = btn.dataset.add;
  const size = type === 'box' ? { w: 1, d: 1, h: 1 } : type === 'cylinder' ? { w: 1, d: 1, h: 1.5 } : { w: 1, d: 1, h: 1 };
  addObject({ id: uid(), type, name: LABELS[type], ...spawnPoint(), y: 0, rot: 0, color: nextColor(), ...size });
}));

$('#addModel').addEventListener('click', () => $('#modelFile').click());
const isModelFile = f => /\.(glb|gltf)$/i.test(f.name);
async function addModelFile(file, at) {
  toast(`${file.name} 불러오는 중…`);
  try {
    const buffer = await file.arrayBuffer();
    const id = uid();
    const asset = await registerAsset(id, file.name, buffer);
    try { await assetDb.put({ id, name: file.name, data: buffer }); }
    catch { asset.data = buffer; toast('모델은 추가했지만 저장 공간이 부족해 새로고침하면 사라져요'); }
    // Keep the model's proportions and fit its largest side to 1.5 m, since GLB units vary.
    const [sx, sy, sz] = asset.size;
    const f = 1.5 / Math.max(sx, sy, sz, 1e-4);
    addObject({
      id: uid(), type: 'model', assetId: id, name: file.name.replace(/\.(glb|gltf)$/i, ''),
      ...(at ?? spawnPoint()), y: 0, rot: 0, w: round2(sx * f), h: round2(sy * f), d: round2(sz * f), color: '#ffffff',
    });
    toast(`${file.name} 추가됨`);
  } catch (err) {
    console.error(err);
    toast('모델을 읽지 못했어요. 텍스처가 포함된 .glb 파일을 권장해요');
  }
}
async function addModelFiles(files, clientX, clientY) {
  const list = [...files].filter(isModelFile);
  if (!list.length) { toast('.glb / .gltf 파일만 추가할 수 있어요'); return; }
  // Dropped on the 3D view: place at the ground point under the cursor, side by side for several files.
  const base = clientX != null ? groundPoint(clientX, clientY) : null;
  for (const [i, file] of list.entries()) {
    const at = base ? { x: round2(base.x + i * 1.6), z: round2(base.z) } : null;
    await addModelFile(file, at);
  }
}
$('#modelFile').addEventListener('change', e => {
  const files = [...e.target.files];
  e.target.value = '';
  if (files.length) addModelFiles(files);
});

// ---------- low-poly copy (glTF-Transform + meshoptimizer, bundled into #lowpolyWorker) ----------
// Same pipeline as `gltf-transform optimize --compress quantize --texture-compress webp --simplify-error 0.001`.
const LOW_OPTS = { error: 0.001, quality: 0.8, maxSize: 2048, keepBelow: 50000 };
const fmtMB = n => (n / 1048576).toFixed(n < 10485760 ? 2 : 1) + ' MB';
const lowJobs = new Set(); // source assetIds being converted
let lowWorker = null, lowJobSeq = 0, lowChain = Promise.resolve();
function runLowWorker(bytes, onStage) {
  lowWorker ??= new Worker(URL.createObjectURL(new Blob([$('#lowpolyWorker').textContent], { type: 'text/javascript' })));
  const jobId = ++lowJobSeq;
  return new Promise((resolve, reject) => {
    const onMessage = ({ data }) => {
      if (data.jobId !== jobId) return;
      if (data.type === 'stage') onStage(data.stage);
      else if (data.type === 'variant') resolve(data);
      else if (data.type === 'error') reject(new Error(data.message));
      if (data.type === 'done' || data.type === 'error') cleanup();
    };
    const onError = e => { cleanup(); lowWorker = null; reject(new Error(e.message || '메모리가 부족했을 수 있어요')); };
    const cleanup = () => { lowWorker?.removeEventListener('message', onMessage); lowWorker?.removeEventListener('error', onError); };
    lowWorker.addEventListener('message', onMessage);
    lowWorker.addEventListener('error', onError);
    lowWorker.postMessage({ jobId, bytes, variants: [{ key: 'light', error: LOW_OPTS.error }], opts: LOW_OPTS }, [bytes]);
  });
}
async function getAssetBytes(assetId) {
  const a = assets.get(assetId);
  if (a?.data) return a.data.slice(0);
  const rec = await assetDb.get(assetId) ?? (assetId === DEFAULT_MODEL.id ? await fetchDefaultModel() : null);
  if (!rec) throw new Error('저장된 파일을 찾지 못했어요');
  return rec.data;
}
function makeLowPoly(objectId) {
  const o = objById(objectId);
  const src = o?.type === 'model' ? assets.get(o.assetId) : null;
  if (!src?.template || lowJobs.has(o.assetId)) return;
  const srcAssetId = o.assetId;
  lowJobs.add(srcAssetId);
  renderProps();
  toast(`${o.name} 로우폴리 대기 중…`);
  lowChain = lowChain.then(async () => {
    try {
      const glb = (await runLowWorker(await getAssetBytes(srcAssetId), stage => toast(`${o.name} · ${stage}`))).glb;
      const buffer = glb.buffer.slice(glb.byteOffset, glb.byteOffset + glb.byteLength);
      const id = uid();
      const name = src.name.replace(/\.(glb|gltf)$/i, '') + '_low.glb';
      const low = await registerAsset(id, name, buffer);
      try { await assetDb.put({ id, name, data: buffer }); }
      catch { low.data = buffer; }
      // Beside the original along its local +X, same footprint so the two compare 1:1.
      const cur = objById(objectId) ?? o;
      const p = toWorld(cur, cur.w + 0.3, 0);
      addObject({ ...cur, id: uid(), assetId: id, name: cur.name + ' low', x: round2(p.x), z: round2(p.z), lowOf: srcAssetId });
      toast(`로우폴리 완료 · ${fmtMB(src.bytes)} → ${fmtMB(low.bytes)} · 삼각형 ${src.tris.toLocaleString('ko-KR')} → ${low.tris.toLocaleString('ko-KR')}`);
    } catch (err) {
      console.error(err);
      toast(`로우폴리를 만들지 못했어요: ${err.message}`);
    } finally {
      lowJobs.delete(srcAssetId);
      renderProps();
    }
  });
}
async function downloadModel(objectId) {
  const o = objById(objectId);
  if (o?.type !== 'model') return;
  try {
    const bytes = await getAssetBytes(o.assetId);
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([bytes], { type: 'model/gltf-binary' }));
    a.download = assets.get(o.assetId)?.name || `${o.name}.glb`;
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 60000);
  } catch (err) {
    toast(`받지 못했어요: ${err.message}`);
  }
}

// ---------- split into parts ----------
// A part is a group of triangle islands (vertices welded by position, so UV seams don't cut an island).
// Islands whose bounding boxes touch or sit within PART_GAP of each other stay together, and crumbs
// under PART_MIN_SHARE of all triangles join the nearest part. Each part becomes its own GLB.
const PART_GAP = 0.01;       // × model diagonal
const PART_MIN_SHARE = 0.01; // × total triangles
const splitJobs = new Set(); // source assetIds being split
const exporter = new GLTFExporter();
const boxGap = (a, b) => Math.max(a.min.x - b.max.x, b.min.x - a.max.x, a.min.y - b.max.y, b.min.y - a.max.y, a.min.z - b.max.z, b.min.z - a.max.z);
const boxDistance = (a, b) => Math.hypot(
  Math.max(0, a.min.x - b.max.x, b.min.x - a.max.x),
  Math.max(0, a.min.y - b.max.y, b.min.y - a.max.y),
  Math.max(0, a.min.z - b.max.z, b.min.z - a.max.z));
function unionFind(n) {
  const parent = Int32Array.from({ length: n }, (_, i) => i);
  const find = x => { while (parent[x] !== x) x = parent[x] = parent[parent[x]]; return x; };
  return { find, union: (a, b) => { a = find(a); b = find(b); if (a !== b) parent[b] = a; } };
}
function meshIslands(mesh, weldTol) {
  const pos = mesh.geometry.attributes.position, index = mesh.geometry.index?.array;
  const n = pos.count, triCount = (index ? index.length : n) / 3;
  const vert = (t, k) => index ? index[t * 3 + k] : t * 3 + k;
  const world = Array.from({ length: n }, (_, i) => new THREE.Vector3().fromBufferAttribute(pos, i).applyMatrix4(mesh.matrixWorld));
  const weldIds = new Map(), weld = new Int32Array(n);
  world.forEach((p, i) => {
    const key = `${Math.round(p.x / weldTol)},${Math.round(p.y / weldTol)},${Math.round(p.z / weldTol)}`;
    if (!weldIds.has(key)) weldIds.set(key, i);
    weld[i] = weldIds.get(key);
  });
  const uf = unionFind(n);
  for (let t = 0; t < triCount; t++) for (let k = 1; k < 3; k++) uf.union(weld[vert(t, 0)], weld[vert(t, k)]);
  const islands = new Map();
  for (let t = 0; t < triCount; t++) {
    const root = uf.find(weld[vert(t, 0)]);
    let isl = islands.get(root);
    if (!isl) islands.set(root, isl = { mesh, tris: [], box: new THREE.Box3() });
    isl.tris.push(t);
    for (let k = 0; k < 3; k++) isl.box.expandByPoint(world[vert(t, k)]);
  }
  return [...islands.values()];
}
function groupIslands(islands, gap) {
  // sweep along X so only boxes that can overlap are compared
  islands.sort((a, b) => a.box.min.x - b.box.min.x);
  const uf = unionFind(islands.length);
  for (let i = 0; i < islands.length; i++) {
    for (let j = i + 1; j < islands.length && islands[j].box.min.x <= islands[i].box.max.x + gap; j++) {
      if (boxGap(islands[i].box, islands[j].box) <= gap) uf.union(i, j);
    }
  }
  const groups = new Map();
  islands.forEach((isl, i) => {
    const root = uf.find(i);
    let g = groups.get(root);
    if (!g) groups.set(root, g = { islands: [], tris: 0, box: new THREE.Box3() });
    g.islands.push(isl);
    g.tris += isl.tris.length;
    g.box.union(isl.box);
  });
  const all = [...groups.values()].sort((a, b) => b.tris - a.tris);
  const total = all.reduce((s, g) => s + g.tris, 0);
  const parts = all.filter((g, i) => i === 0 || g.tris >= total * PART_MIN_SHARE);
  for (const crumb of all.filter(g => !parts.includes(g))) {
    const home = parts.reduce((a, b) => boxDistance(crumb.box, b.box) < boxDistance(crumb.box, a.box) ? b : a);
    home.islands.push(...crumb.islands);
    home.tris += crumb.tris;
    home.box.union(crumb.box);
  }
  // left to right, then front to back, so part numbers follow the layout
  const cx = g => (g.box.min.x + g.box.max.x) / 2;
  return parts.sort((a, b) => cx(a) - cx(b) || a.box.min.z - b.box.min.z);
}
// Copy the listed vertices of an attribute. Position/normal/tangent become float so the world transform can be baked in.
function pickAttribute(attr, order, asFloat) {
  const size = attr.itemSize, inter = attr.isInterleavedBufferAttribute;
  const raw = inter ? attr.data.array : attr.array, stride = inter ? attr.data.stride : size, offset = inter ? attr.offset : 0;
  const out = new (asFloat ? Float32Array : raw.constructor)(order.length * size);
  order.forEach((v, i) => {
    for (let k = 0; k < size; k++) {
      const value = raw[v * stride + offset + k];
      out[i * size + k] = asFloat && attr.normalized ? THREE.MathUtils.denormalize(value, raw) : value;
    }
  });
  return new THREE.BufferAttribute(out, size, asFloat ? false : attr.normalized);
}
function buildPart(part) {
  const byMesh = new Map();
  for (const isl of part.islands) {
    if (!byMesh.has(isl.mesh)) byMesh.set(isl.mesh, []);
    byMesh.get(isl.mesh).push(...isl.tris);
  }
  const root = new THREE.Scene();
  for (const [mesh, tris] of byMesh) {
    const src = mesh.geometry, index = src.index?.array;
    const remap = new Map(), order = [], newIndex = new Uint32Array(tris.length * 3);
    tris.sort((a, b) => a - b).forEach((t, i) => {
      for (let k = 0; k < 3; k++) {
        const v = index ? index[t * 3 + k] : t * 3 + k;
        if (!remap.has(v)) { remap.set(v, order.length); order.push(v); }
        newIndex[i * 3 + k] = remap.get(v);
      }
    });
    const geo = new THREE.BufferGeometry();
    for (const [name, attr] of Object.entries(src.attributes)) {
      geo.setAttribute(name, pickAttribute(attr, order, ['position', 'normal', 'tangent'].includes(name)));
    }
    geo.setIndex(new THREE.BufferAttribute(order.length > 65535 ? newIndex : Uint16Array.from(newIndex), 1));
    geo.applyMatrix4(mesh.matrixWorld);
    const m = new THREE.Mesh(geo, mesh.material);
    m.name = mesh.name;
    root.add(m);
  }
  // each part sits centered on X/Z with its bottom on Y = 0
  const box = new THREE.Box3().setFromObject(root), c = box.getCenter(new THREE.Vector3());
  root.traverse(child => { if (child.isMesh) child.geometry.translate(-c.x, -box.min.y, -c.z); });
  return root;
}
async function splitParts(objectId) {
  const o = objById(objectId);
  const src = o?.type === 'model' ? assets.get(o.assetId) : null;
  if (!src?.template || splitJobs.has(o.assetId)) return;
  const srcAssetId = o.assetId;
  splitJobs.add(srcAssetId);
  renderProps();
  toast(`${o.name} 파츠 찾는 중…`);
  await new Promise(r => setTimeout(r, 30)); // let the toast paint before the heavy work
  try {
    const bytes = await getAssetBytes(srcAssetId);
    const gltf = await new Promise((resolve, reject) => loader.parse(bytes, '', resolve, reject));
    const model = gltf.scene;
    model.updateMatrixWorld(true);
    const meshes = [];
    model.traverse(child => { if (child.isMesh) meshes.push(child); });
    if (meshes.some(m => m.isSkinnedMesh)) throw new Error('뼈대(스킨)가 있는 모델은 나눌 수 없어요');
    const diag = new THREE.Box3().setFromObject(model).getSize(new THREE.Vector3()).length();
    const parts = groupIslands(meshes.flatMap(m => meshIslands(m, diag * 1e-5)), diag * PART_GAP);
    if (parts.length < 2) { toast('떨어져 있는 파츠를 찾지 못했어요'); return; }

    const base = src.name.replace(/\.(glb|gltf)$/i, '');
    const cur = objById(objectId) ?? o;
    const k = [cur.w / src.size[0], cur.h / src.size[1], cur.d / src.size[2]];
    let along = cur.w / 2 + 0.3; // lay parts out beside the original along its local +X
    let last = null;
    for (const [i, part] of parts.entries()) {
      toast(`${o.name} · 파츠 ${i + 1}/${parts.length} 만드는 중…`);
      const buffer = await exporter.parseAsync(buildPart(part), { binary: true });
      const id = uid();
      const name = `${base}_part${i + 1}.glb`;
      const asset = await registerAsset(id, name, buffer);
      try { await assetDb.put({ id, name, data: buffer }); }
      catch { asset.data = buffer; }
      const [w, h, d] = asset.size.map((v, a) => round2(Math.max(v * k[a], 0.05)));
      const p = toWorld(cur, along + w / 2, 0);
      along += w + 0.3;
      last = { ...cur, id: uid(), assetId: id, name: `${cur.name} ${i + 1}`, x: round2(p.x), z: round2(p.z), y: 0, w, h, d };
      delete last.lowOf;
      objects.push(last);
      syncNode(last);
    }
    select(last.id);
    save();
    toast(`파츠 ${parts.length}개로 나눴어요 · 각각 선택해서 ⬇ 받기`);
  } catch (err) {
    console.error(err);
    toast(`파츠를 나누지 못했어요: ${err.message}`);
  } finally {
    splitJobs.delete(srcAssetId);
    renderProps();
  }
}

// drag & drop GLB files anywhere on the page
let dragDepth = 0;
const hasFiles = e => [...(e.dataTransfer?.types ?? [])].includes('Files');
window.addEventListener('dragenter', e => {
  if (!hasFiles(e)) return;
  e.preventDefault();
  dragDepth++;
  $('#dropHint').hidden = false;
});
window.addEventListener('dragover', e => {
  if (!hasFiles(e)) return;
  e.preventDefault();
  e.dataTransfer.dropEffect = 'copy';
});
window.addEventListener('dragleave', e => {
  if (!hasFiles(e)) return;
  dragDepth = Math.max(0, dragDepth - 1);
  if (!dragDepth) $('#dropHint').hidden = true;
});
window.addEventListener('drop', e => {
  if (!hasFiles(e)) return;
  e.preventDefault();
  dragDepth = 0;
  $('#dropHint').hidden = true;
  const onView = e.target === renderer.domElement;
  addModelFiles(e.dataTransfer.files, onView ? e.clientX : null, onView ? e.clientY : null);
});

// ---------- properties panel ----------
const propInputs = [...document.querySelectorAll('#props [data-k]')];
function renderProps() {
  const o = objById(selectedId);
  $('#props').hidden = !(o && features.props);
  if (!o) return;
  $('#propsTitle').textContent = `속성 · ${LABELS[o.type]}`;
  $('#colorField').hidden = o.type === 'model';
  const a = o.type === 'model' ? assets.get(o.assetId) : null;
  $('#modelInfo').hidden = !a?.template;
  $('#modelActions').hidden = !a?.template;
  if (a?.template) {
    let html = `<b>${fmtMB(a.bytes)}</b> · 삼각형 <b>${a.tris.toLocaleString('ko-KR')}</b>`;
    const src = o.lowOf && assets.get(o.lowOf);
    if (src?.bytes) html += `<br>원본 ${fmtMB(src.bytes)} · ${src.tris.toLocaleString('ko-KR')} 대비 −${Math.round((1 - a.bytes / src.bytes) * 100)}%`;
    $('#modelInfo').innerHTML = html;
    const busy = lowJobs.has(o.assetId);
    $('#lowBtn').disabled = busy;
    $('#lowBtn').textContent = busy ? '변환 중…' : '⚡ 로우폴리';
    const splitting = splitJobs.has(o.assetId);
    $('#splitBtn').disabled = splitting;
    $('#splitBtn').textContent = splitting ? '분리 중…' : '🧩 파츠 분리';
  }
  for (const input of propInputs) {
    if (input === document.activeElement) continue;
    const v = o[input.dataset.k];
    input.value = typeof v === 'number' ? round2(v) : v;
  }
}
for (const input of propInputs) {
  const apply = live => {
    const o = objById(selectedId);
    if (!o) return;
    const k = input.dataset.k;
    if (input.type === 'number') {
      let v = parseFloat(input.value);
      if (!Number.isFinite(v)) return;
      if (['w', 'd', 'h'].includes(k)) v = Math.max(0.05, v);
      o[k] = v;
    } else {
      o[k] = input.value;
    }
    objectChanged(o, live);
  };
  input.addEventListener('input', () => apply(true));
  input.addEventListener('change', () => apply(false));
}
$('#lowBtn').addEventListener('click', () => makeLowPoly(selectedId));
$('#dlBtn').addEventListener('click', () => downloadModel(selectedId));
$('#splitBtn').addEventListener('click', () => splitParts(selectedId));
$('#dupBtn').addEventListener('click', duplicateSelected);
$('#delBtn').addEventListener('click', deleteSelected);

document.addEventListener('keydown', e => {
  if (e.target.closest('input, select, textarea')) return;
  if (e.key === 'Escape' && moving) endMove(false);
  else if (e.key === 'Escape' && menuAt) closeMenu();
  else if (e.key === 'Delete' || e.key === 'Backspace') { e.preventDefault(); deleteSelected(); }
  else if (e.key === 'Escape') select(null);
});

// ---------- 3D picking ----------
const raycaster = new THREE.Raycaster();
const GROUND_PLANE = new THREE.Plane(new THREE.Vector3(0, 1, 0), 0);
function aimRay(clientX, clientY) {
  const rect = renderer.domElement.getBoundingClientRect();
  const ndc = new THREE.Vector2(((clientX - rect.left) / rect.width) * 2 - 1, -((clientY - rect.top) / rect.height) * 2 + 1);
  raycaster.setFromCamera(ndc, camera);
}
// Point on the ground (y = 0) under the cursor, or null when the ray points above the horizon.
function groundPoint(clientX, clientY) {
  aimRay(clientX, clientY);
  const p = raycaster.ray.intersectPlane(GROUND_PLANE, new THREE.Vector3());
  return p ? { x: p.x, z: p.z } : null;
}

// tap an object → small menu → "이동" → it follows the pointer on the ground until a click / finger lift
const ctxMenu = $('#ctxMenu');
let menuAt = null;   // { id, x, y } of the tap that opened the menu
let moving = null;   // { o, x0, z0, ox, oz, down }
function openMenu(id, x, y) {
  menuAt = { id, x, y };
  const o = objById(id);
  const isModel = o?.type === 'model' && !!assets.get(o.assetId)?.template;
  for (const b of ctxMenu.querySelectorAll('[data-model-only]')) b.hidden = !isModel;
  $('#ctxMove').hidden = !features.move;
  $('#ctxLow').disabled = isModel && lowJobs.has(o.assetId);
  $('#ctxSplit').disabled = isModel && splitJobs.has(o.assetId);
  ctxMenu.hidden = false;
  const r = ctxMenu.getBoundingClientRect();
  ctxMenu.style.left = clamp(x + 10, 8, innerWidth - r.width - 8) + 'px';
  ctxMenu.style.top = clamp(y + 10, 8, innerHeight - r.height - 8) + 'px';
}
function closeMenu() { ctxMenu.hidden = true; menuAt = null; }
function grabOffset(o, clientX, clientY) {
  const g = groundPoint(clientX, clientY);
  if (g) { moving.ox = o.x - g.x; moving.oz = o.z - g.z; }
}
function startMove(id, clientX, clientY) {
  const o = objById(id);
  closeMenu();
  if (!o) return;
  moving = { o, x0: o.x, z0: o.z, ox: 0, oz: 0, down: false };
  grabOffset(o, clientX, clientY);
  controls.enabled = false;
  document.body.classList.add('moving');
  $('#moveBar').hidden = false;
}
function endMove(commit) {
  if (!moving) return;
  const o = moving.o;
  if (!commit) { o.x = moving.x0; o.z = moving.z0; }
  moving = null;
  controls.enabled = true;
  document.body.classList.remove('moving');
  $('#moveBar').hidden = true;
  objectChanged(o, false);
}
function dragMove(e) {
  const g = groundPoint(e.clientX, e.clientY);
  if (!g) return;
  const o = moving.o;
  o.x = snap(g.x + moving.ox, 0.5);
  o.z = snap(g.z + moving.oz, 0.5);
  objectChanged(o, true);
}
$('#ctxMove').addEventListener('click', () => { if (menuAt) startMove(menuAt.id, menuAt.x, menuAt.y); });
$('#ctxLow').addEventListener('click', () => { if (menuAt) { const id = menuAt.id; closeMenu(); makeLowPoly(id); } });
$('#ctxSplit').addEventListener('click', () => { if (menuAt) { const id = menuAt.id; closeMenu(); splitParts(id); } });
$('#ctxDownload').addEventListener('click', () => { if (menuAt) { const id = menuAt.id; closeMenu(); downloadModel(id); } });
$('#ctxDelete').addEventListener('click', () => { if (menuAt) { select(menuAt.id); deleteSelected(); } });
$('#moveCancel').addEventListener('click', () => endMove(false));
controls.addEventListener('start', closeMenu);
document.addEventListener('pointerdown', e => { if (!ctxMenu.hidden && !ctxMenu.contains(e.target)) closeMenu(); });

let pickStart = null;
renderer.domElement.addEventListener('pointerdown', e => {
  if (moving) {
    // touch has no hover: re-grab where the finger lands so the object doesn't jump
    if (e.isPrimary) { moving.down = true; grabOffset(moving.o, e.clientX, e.clientY); }
    return;
  }
  pickStart = e.isPrimary && e.button === 0 ? { x: e.clientX, y: e.clientY } : null;
});
renderer.domElement.addEventListener('pointermove', e => { if (moving && e.isPrimary) dragMove(e); });
renderer.domElement.addEventListener('pointerup', e => {
  if (moving) {
    if (moving.down && e.isPrimary) endMove(true);
    return;
  }
  const start = pickStart;
  pickStart = null;
  if (!start || !features.pick3d || Math.hypot(e.clientX - start.x, e.clientY - start.y) > 6) return;
  aimRay(e.clientX, e.clientY);
  const roots = [...nodes.values()].map(n => n.root);
  const hit = raycaster.intersectObjects(roots, true).find(h => h.object.isMesh);
  let node = hit?.object;
  while (node && !node.userData.objectId) node = node.parent;
  const id = node?.userData.objectId ?? null;
  select(id);
  if (id) openMenu(id, e.clientX, e.clientY);
});

// ---------- 2D minimap ----------
const map = $('#minimap');
const mctx = map.getContext('2d');
const coarse = matchMedia('(pointer: coarse)').matches;
const HANDLE_HIT = coarse ? 20 : 11;
const KNOB_GAP = 24; // px from the object's front edge to the rotation knob

function mapSize() { return map.clientWidth; }
function mapScale() { return mapSize() / (2 * view.S); }
function worldToMap(x, z) {
  const k = mapScale(), M = mapSize();
  return { x: M / 2 + (x - view.cx) * k, y: M / 2 + (z - view.cz) * k };
}
function mapToWorld(px, py) {
  const k = mapScale(), M = mapSize();
  return { x: view.cx + (px - M / 2) / k, z: view.cz + (py - M / 2) / k };
}
// Local frame of an object on the ground plane: three.js rotation about +Y.
function toLocal(o, wx, wz) {
  const dx = wx - o.x, dz = wz - o.z, c = Math.cos(o.rot * DEG), s = Math.sin(o.rot * DEG);
  return { lx: dx * c - dz * s, lz: dx * s + dz * c };
}
function toWorld(o, lx, lz) {
  const c = Math.cos(o.rot * DEG), s = Math.sin(o.rot * DEG);
  return { x: o.x + lx * c + lz * s, z: o.z - lx * s + lz * c };
}
function knobPoint(o) {
  const w = toWorld(o, 0, -(o.d / 2 + KNOB_GAP / mapScale()));
  return worldToMap(w.x, w.z);
}
function cornerPoints(o) {
  return [[-1, -1], [1, -1], [1, 1], [-1, 1]].map(([sx, sz]) => {
    const w = toWorld(o, sx * o.w / 2, sz * o.d / 2);
    return worldToMap(w.x, w.z);
  });
}
function hitObject(px, py) {
  const w = mapToWorld(px, py);
  const pad = 4 / mapScale(); // keep tiny objects tappable
  for (let i = objects.length - 1; i >= 0; i--) {
    const o = objects[i];
    const { lx, lz } = toLocal(o, w.x, w.z);
    const hw = o.w / 2 + pad, hd = o.d / 2 + pad;
    const inside = o.type === 'cylinder' || o.type === 'sphere'
      ? (lx / hw) ** 2 + (lz / hd) ** 2 <= 1
      : Math.abs(lx) <= hw && Math.abs(lz) <= hd;
    if (inside) return o;
  }
  return null;
}

function sizeMinimap() {
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  const M = mapSize();
  map.width = map.height = Math.round(M * dpr);
  requestRender();
}
new ResizeObserver(sizeMinimap).observe(map);

function drawMinimap() {
  if (!features.minimap) return;
  const M = mapSize(), dpr = map.width / M, k = mapScale(), ctx = mctx;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.clearRect(0, 0, M, M);
  ctx.fillStyle = '#15171b';
  ctx.fillRect(0, 0, M, M);

  // grid
  const step = [0.5, 1, 2, 5, 10, 20].find(s => s * k >= 14) ?? 50;
  const tl = mapToWorld(0, 0), br = mapToWorld(M, M);
  ctx.lineWidth = 1;
  for (let x = Math.ceil(tl.x / step) * step; x <= br.x; x += step) {
    const p = worldToMap(x, 0).x;
    ctx.strokeStyle = Math.abs(x) < 1e-6 ? '#4b5060' : '#25282f';
    ctx.beginPath(); ctx.moveTo(Math.round(p) + 0.5, 0); ctx.lineTo(Math.round(p) + 0.5, M); ctx.stroke();
  }
  for (let z = Math.ceil(tl.z / step) * step; z <= br.z; z += step) {
    const p = worldToMap(0, z).y;
    ctx.strokeStyle = Math.abs(z) < 1e-6 ? '#4b5060' : '#25282f';
    ctx.beginPath(); ctx.moveTo(0, Math.round(p) + 0.5); ctx.lineTo(M, Math.round(p) + 0.5); ctx.stroke();
  }
  ctx.fillStyle = '#6b6f7c';
  ctx.font = '10px system-ui, sans-serif';
  ctx.fillText(`격자 ${step}m`, 6, M - 6);

  // objects
  for (const o of objects) {
    const c = worldToMap(o.x, o.z), sel = o.id === selectedId;
    const w = Math.max(o.w * k, 2), d = Math.max(o.d * k, 2);
    ctx.save();
    ctx.translate(c.x, c.y);
    ctx.rotate(-o.rot * DEG);
    ctx.beginPath();
    if (o.type === 'cylinder' || o.type === 'sphere') ctx.ellipse(0, 0, w / 2, d / 2, 0, 0, Math.PI * 2);
    else ctx.rect(-w / 2, -d / 2, w, d);
    ctx.fillStyle = o.type === 'model' ? (assets.get(o.assetId)?.error ? '#7a3440' : '#8a8f9e') : o.color;
    ctx.globalAlpha = 0.85;
    ctx.fill();
    ctx.globalAlpha = 1;
    ctx.lineWidth = sel ? 2 : 1;
    ctx.strokeStyle = sel ? '#7aa2ff' : 'rgba(0,0,0,.55)';
    ctx.stroke();
    // front marker (local -Z), matches the rotation knob side
    ctx.beginPath();
    ctx.moveTo(-Math.min(5, w / 3), -d / 2 + 1);
    ctx.lineTo(0, -d / 2 - 4);
    ctx.lineTo(Math.min(5, w / 3), -d / 2 + 1);
    ctx.strokeStyle = sel ? '#7aa2ff' : 'rgba(255,255,255,.55)';
    ctx.lineWidth = 1.5;
    ctx.stroke();
    ctx.restore();
  }

  // handles
  const o = objById(selectedId);
  if (o) {
    const c = worldToMap(o.x, o.z);
    if (features.rotate) {
      const kp = knobPoint(o);
      ctx.strokeStyle = '#7aa2ff'; ctx.lineWidth = 1.5;
      ctx.beginPath(); ctx.moveTo(c.x, c.y); ctx.lineTo(kp.x, kp.y); ctx.stroke();
      ctx.fillStyle = '#15171b';
      ctx.beginPath(); ctx.arc(kp.x, kp.y, coarse ? 8 : 6, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
    }
    if (features.scale) {
      const s = coarse ? 10 : 7;
      for (const p of cornerPoints(o)) {
        ctx.fillStyle = '#fff'; ctx.strokeStyle = '#7aa2ff'; ctx.lineWidth = 1.5;
        ctx.fillRect(p.x - s / 2, p.y - s / 2, s, s);
        ctx.strokeRect(p.x - s / 2, p.y - s / 2, s, s);
      }
    }
  }

  // camera: position + direction toward its orbit target
  const cp = worldToMap(camera.position.x, camera.position.z);
  const tp = worldToMap(controls.target.x, controls.target.z);
  const ang = Math.atan2(tp.y - cp.y, tp.x - cp.x);
  const half = (camera.fov * camera.aspect / 2) * DEG;
  const len = 26;
  ctx.fillStyle = 'rgba(122,162,255,.18)';
  ctx.beginPath();
  ctx.moveTo(cp.x, cp.y);
  ctx.lineTo(cp.x + Math.cos(ang - half) * len, cp.y + Math.sin(ang - half) * len);
  ctx.lineTo(cp.x + Math.cos(ang + half) * len, cp.y + Math.sin(ang + half) * len);
  ctx.closePath();
  ctx.fill();
  ctx.fillStyle = '#7aa2ff';
  ctx.beginPath(); ctx.arc(cp.x, cp.y, 4, 0, Math.PI * 2); ctx.fill();
  ctx.strokeStyle = 'rgba(122,162,255,.6)'; ctx.lineWidth = 1;
  ctx.beginPath(); ctx.arc(tp.x, tp.y, 3, 0, Math.PI * 2); ctx.stroke();
}

// minimap gestures: move / rotate / scale an object, pan and pinch-zoom the map
const pointers = new Map();
let gesture = null;
const localPoint = e => {
  const r = map.getBoundingClientRect();
  return { x: e.clientX - r.left, y: e.clientY - r.top };
};
const near = (a, b) => Math.hypot(a.x - b.x, a.y - b.y) <= HANDLE_HIT;
const snap = (v, unit) => (features.snap ? Math.round(v / unit) * unit : round2(v));
const pinchDistance = () => {
  const [a, b] = [...pointers.values()];
  return Math.hypot(a.x - b.x, a.y - b.y);
};
function setZoom(S) {
  view.S = clamp(S, 2, 40);
  requestRender();
  save();
}

map.addEventListener('pointerdown', e => {
  map.setPointerCapture(e.pointerId);
  const p = localPoint(e);
  pointers.set(e.pointerId, p);
  if (pointers.size === 2) {
    gesture = { type: 'pinch', d0: pinchDistance(), S0: view.S };
    return;
  }
  if (pointers.size > 2) return;

  const sel = objById(selectedId);
  if (sel && features.rotate && near(knobPoint(sel), p)) {
    gesture = { type: 'rotate', o: sel };
    return;
  }
  if (sel && features.scale && cornerPoints(sel).some(c => near(c, p))) {
    gesture = { type: 'scale', o: sel };
    return;
  }
  const hit = hitObject(p.x, p.y);
  if (hit) {
    if (hit.id !== selectedId) select(hit.id);
    const w = mapToWorld(p.x, p.y);
    gesture = features.move ? { type: 'move', o: hit, ox: hit.x - w.x, oz: hit.z - w.z } : null;
    return;
  }
  gesture = { type: 'pan', start: p, cx0: view.cx, cz0: view.cz, moved: false };
});

map.addEventListener('pointermove', e => {
  if (!pointers.has(e.pointerId)) return;
  const p = localPoint(e);
  pointers.set(e.pointerId, p);
  if (!gesture) return;
  const w = mapToWorld(p.x, p.y);

  switch (gesture.type) {
    case 'pinch':
      if (pointers.size === 2) setZoom(gesture.S0 * gesture.d0 / Math.max(pinchDistance(), 1));
      break;
    case 'pan': {
      const dx = p.x - gesture.start.x, dy = p.y - gesture.start.y;
      if (!gesture.moved && Math.hypot(dx, dy) < 5) break;
      gesture.moved = true;
      const k = mapScale();
      view.cx = gesture.cx0 - dx / k;
      view.cz = gesture.cz0 - dy / k;
      requestRender();
      break;
    }
    case 'move': {
      const o = gesture.o;
      o.x = snap(w.x + gesture.ox, 0.5);
      o.z = snap(w.z + gesture.oz, 0.5);
      objectChanged(o, true);
      break;
    }
    case 'rotate': {
      const o = gesture.o;
      // local -Z (the front marker) should point at the pointer
      let deg = Math.atan2(-(w.x - o.x), -(w.z - o.z)) / DEG;
      deg = features.snap ? Math.round(deg / 15) * 15 : Math.round(deg);
      o.rot = ((deg + 540) % 360) - 180;
      objectChanged(o, true);
      break;
    }
    case 'scale': {
      const o = gesture.o;
      const { lx, lz } = toLocal(o, w.x, w.z);
      o.w = Math.max(0.1, snap(Math.abs(lx) * 2, 0.25));
      o.d = Math.max(0.1, snap(Math.abs(lz) * 2, 0.25));
      objectChanged(o, true);
      break;
    }
  }
});

function endPointer(e) {
  if (!pointers.delete(e.pointerId)) return;
  if (!gesture) return;
  if (gesture.type === 'pinch') {
    if (pointers.size === 0) gesture = null;
    return;
  }
  if (pointers.size > 0) return;
  if (gesture.type === 'pan' && !gesture.moved) select(null);
  gesture = null;
  save();
}
map.addEventListener('pointerup', endPointer);
map.addEventListener('pointercancel', endPointer);
map.addEventListener('wheel', e => {
  e.preventDefault();
  setZoom(view.S * Math.exp(e.deltaY * 0.001));
}, { passive: false });

$('#zoomIn').addEventListener('click', () => setZoom(view.S / 1.3));
$('#zoomOut').addEventListener('click', () => setZoom(view.S * 1.3));
$('#mapBig').addEventListener('click', () => {
  view.big = !view.big;
  applyFeatures();
  save();
});

// ---------- feature toggles ----------
const featureList = $('#featureList');
for (const f of FEATURES) {
  const label = document.createElement('label');
  label.className = 'check';
  label.innerHTML = `<input type="checkbox" data-feature="${f.key}"><span>${f.label}<span class="hint">${f.hint}</span></span>`;
  featureList.appendChild(label);
}
featureList.addEventListener('change', e => {
  const key = e.target.dataset.feature;
  if (!key) return;
  features[key] = e.target.checked;
  applyFeatures();
  save();
});
function applyFeatures() {
  for (const input of featureList.querySelectorAll('[data-feature]')) input.checked = features[input.dataset.feature];
  $('#addBar').hidden = !features.add;
  $('#mapBox').hidden = !features.minimap;
  $('#mapBox').classList.toggle('big', view.big);
  $('#mapBig').classList.toggle('on', view.big);
  renderProps();
  requestRender();
}

const gear = $('#gear'), panel = $('#features');
function setPanel(open) {
  panel.hidden = !open;
  gear.setAttribute('aria-expanded', String(open));
  gear.classList.toggle('on', open);
}
gear.addEventListener('click', () => setPanel(panel.hidden));
document.addEventListener('pointerdown', e => {
  if (!panel.hidden && !panel.contains(e.target) && !gear.contains(e.target)) setPanel(false);
});

$('#resetCam').addEventListener('click', () => {
  applyCamera(DEFAULT_CAMERA);
  view.cx = 0; view.cz = 0;
  requestRender();
  save();
});
let resetArmed = 0;
$('#resetAll').addEventListener('click', e => {
  const btn = e.currentTarget;
  if (!resetArmed) {
    btn.textContent = '한 번 더 누르면 초기화';
    resetArmed = setTimeout(() => { resetArmed = 0; btn.textContent = '전체 초기화'; }, 2500);
    return;
  }
  clearTimeout(resetArmed);
  resetArmed = 0;
  btn.textContent = '전체 초기화';
  for (const o of objects) {
    removeNode(o.id);
    if (o.type === 'model') assetDb.delete(o.assetId).catch(() => {});
  }
  assets.clear();
  objects = defaultObjects();
  Object.assign(features, DEFAULT_FEATURES);
  Object.assign(view, { cx: 0, cz: 0, S: 8, big: false });
  selectedId = null;
  applyCamera(DEFAULT_CAMERA);
  objects.forEach(syncNode);
  applyFeatures();
  restoreAssets();
  save();
});

// ---------- toast ----------
let toastTimer = 0;
function toast(msg) {
  const el = $('#toast');
  el.textContent = msg;
  el.hidden = false;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { el.hidden = true; }, 2600);
}

// ---------- boot ----------
objects.forEach(syncNode);
applyFeatures();
sizeMinimap();
restoreAssets();
window.__viewerReady = true;
</script>
</body>
</html>
