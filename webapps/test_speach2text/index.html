<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>음성 인식 테스트</title>
  <script src="/assets/js/analytics.js" defer></script>
</head>
<body>
<button id="start-btn">녹음 시작</button>
<button id="stop-btn" disabled>녹음 중지</button>
<p id="status"></p>
<p id="text"></p>

<script>
// SpeechRecognition 객체 생성 (표준 이름이 없으면 webkit 접두사 이름)
var SpeechRecognitionAPI = window.SpeechRecognition || window.webkitSpeechRecognition;
if (!SpeechRecognitionAPI) {
    document.getElementById('status').textContent = '이 브라우저는 음성 인식을 지원하지 않습니다. (Chrome · Edge · Safari 에서 열어 주세요)';
    document.getElementById('start-btn').disabled = true;
    document.getElementById('stop-btn').disabled = true;
}
// 지원하지 않으면 빈 객체로 두어 아래 설정 코드가 그냥 지나가게 한다 (버튼은 꺼 둠)
var recognition = SpeechRecognitionAPI ? new SpeechRecognitionAPI() : {};

// 연속적인 결과를 반환하도록 설정
recognition.continuous = true;

// 사용자의 언어 설정
recognition.lang = 'ko-KR';

// 음성 인식 시작 버튼 이벤트
document.getElementById('start-btn').onclick = function() {
    recognition.start();
};

// 음성 인식 중지 버튼 이벤트
document.getElementById('stop-btn').onclick = function() {
    recognition.stop();
};

// 음성 인식 시작 이벤트 핸들러
recognition.onstart = function() {
    document.getElementById('status').textContent = '';
    document.getElementById('start-btn').disabled = true;
    document.getElementById('stop-btn').disabled = false;
    console.log("음성 인식이 시작되었습니다.");
};

// 음성 인식 결과 이벤트 핸들러
recognition.onresult = function(event) {
    var transcript = '';
    // 연속 모드에서는 results 에 이번 녹음의 모든 문장이 쌓이므로 처음부터 이어 붙인다
    for (var i = 0; i < event.results.length; ++i) {
        transcript += event.results[i][0].transcript;
    }
    document.getElementById('text').textContent = transcript;
};

// 음성 인식 에러 이벤트 핸들러
recognition.onerror = function(event) {
    console.error("음성 인식 에러 발생:", event.error);
    var reasons = {
        'not-allowed': '마이크 사용 권한이 거부되었습니다.',
        'service-not-allowed': '이 브라우저에서 음성 인식 서비스를 쓸 수 없습니다.',
        'no-speech': '음성이 감지되지 않았습니다.',
        'audio-capture': '마이크를 찾을 수 없습니다.',
        'network': '네트워크 오류로 음성 인식을 하지 못했습니다.'
    };
    if (event.error === 'aborted') return;
    document.getElementById('status').textContent = '음성 인식 에러: ' + (reasons[event.error] || event.error);
};

// 음성 인식 서비스 종료 이벤트 핸들러
recognition.onend = function() {
    document.getElementById('start-btn').disabled = false;
    document.getElementById('stop-btn').disabled = true;
    console.log("음성 인식 서비스가 종료되었습니다.");
};
</script>
</body>
</html>
