<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>워해머 전투 계산 시뮬레이터</title>
<!--
  워해머 전투 계산 시뮬레이터 (2026-08-18).

  ★ 이 파일은 혼자 선다. 빌드도 의존도 없다.
  ★ 외부 데이터는 쓰지 않는다. 프로필은 사람이 표에 적는다.
  ★ 하는 일은 하나다 — 해석으로 낸 기대값과 N 번 굴린 실측을 나란히 놓고, 어긋나면 드러낸다.

  주의 1. 어긋났을 때 어느 쪽이 틀렸는지는 이 페이지가 정하지 않는다. 식이 틀렸을 수도,
          굴림이 틀렸을 수도 있다. 판단은 사람이 한다 — 그래서 둘을 나란히 둔다.
  주의 2. 읽지 못한 주사위 표기가 있으면 1 로 때우지 않고 멈춘다.
  주의 3. 화면 말은 전부 L(ko/en) 사전에서 나오고, 칸 이름은 두 말을 나란히 적는다(병기).
          화면에 글자를 박지 않는다 — 박으면 한쪽 말에서만 조용히 안 바뀐다.
  주의 4. 좁은 화면에서는 표를 접고 요약 카드를 낸다. 값 하나에 한 줄을 쓰면 손가락으로 못 쓴다
          — 고치는 것은 카드를 눌러 여는 세로 폼에서 한다.
-->
<style>
  /* 테마는 흰색과 검은색뿐이다. 색으로 뜻을 나르지 않는다 —
     판정은 짙기와 굵기로 가른다. 어긋난 것이 가장 짙고 굵다. */
  :root{
    --ink:#fdfdfd; --ink2:#ffffff; --ink3:#f4f4f4; --line:#e8e8e8;
    --silver:#111111; --silver2:#828282; --silver3:#9b9b9b;
    --accent:#111111; --on-accent:#fdfdfd; --bar:#444444;
    --dim:#9b9b9b; --mid:#555555; --loud:#111111;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--ink);color:var(--silver);padding:20px;
       font:400 15px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,
            sans-serif,"Apple Color Emoji","Segoe UI Emoji";
       -webkit-text-size-adjust:100%}
  h1{font-size:22px;font-weight:400;margin:0 0 4px;color:var(--loud);letter-spacing:-.01em}
  h2{font-size:12px;margin:22px 0 8px;color:var(--silver2);text-transform:uppercase;letter-spacing:.08em}
  p.lead{margin:0;color:var(--silver2);font-size:12.5px}
  /* ⚠ 칸이 열다섯인 표를 800px 글줄에 맞추면 찌그러진다
     — 넓은 화면에서는 표가 펴질 만큼 준다 */
  .wrap{max-width:1400px;margin:0 auto}
  .lead,.note{max-width:74ch}
  .top{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;margin-bottom:18px}
  .langsw{display:flex;border:1px solid var(--line);border-radius:6px;overflow:hidden;flex:0 0 auto}
  .langsw button{border:0;border-radius:0;background:var(--ink2);padding:6px 12px;font-size:12.5px}
  .langsw button[aria-pressed="true"]{background:var(--accent);color:var(--on-accent);font-weight:700}
  .scroll{overflow-x:auto;border:1px solid var(--line);border-radius:6px}
  table{border-collapse:collapse;width:100%;font-size:12.5px}
  th,td{border-bottom:1px solid var(--line);padding:4px 6px;text-align:right;white-space:nowrap}
  th{background:var(--ink3);color:var(--silver2);font-weight:600;font-size:11px}
  td{background:var(--ink2)}
  th:first-child,td:first-child{text-align:left}
  /* 넓은 화면 머리글은 두 말을 위아래로 적는다 — 옆으로 붙이면 칸이 열다섯이라 표가 넓어진다 */
  th .hd{display:inline-flex;align-items:center;gap:2px 4px;justify-content:flex-end;flex-wrap:wrap}
  th .hd em{font-style:normal;color:var(--silver3);font-size:10px;flex-basis:100%;text-align:right}
  th:first-child .hd{justify-content:flex-start}
  th:first-child .hd em{text-align:left}
  tbody tr:hover{background:var(--ink3)}
  .lbl{display:none}
  input,select{background:var(--ink2);color:var(--silver);border:1px solid var(--line);
     border-radius:4px;padding:3px 5px;font:inherit;font-size:12.5px;text-align:right}
  input[type=text].name{text-align:left;width:120px}
  input[type=number]{width:58px}
  input.expr{width:70px;text-align:center}
  select{width:96px;text-align:left}
  input:focus,select:focus{outline:1px solid var(--accent);border-color:var(--accent)}
  button{background:var(--ink3);color:var(--silver);border:1px solid var(--line);
     border-radius:4px;padding:5px 11px;font:inherit;cursor:pointer}
  button:hover{border-color:var(--accent);color:var(--loud)}
  button.run{background:var(--accent);border-color:var(--accent);
     color:var(--on-accent);font-weight:700;padding:7px 18px}
  button.x{padding:2px 8px;color:var(--silver2)}
  /* 특수 규칙 — 체크박스가 아니라 누르면 켜지고 다시 누르면 꺼지는 버튼 (human 2026-08-18) */
  button.pill{border-radius:999px;padding:3px 11px;font-size:12px;color:var(--silver3)}
  button.pill[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--on-accent);font-weight:700}
  /* 물음표 — 누르면 그 칸이 무엇이고 계산에 어떻게 들어가는지 뜬다 */
  button.q{width:18px;height:18px;padding:0;border-radius:50%;font-size:11px;font-weight:700;
     line-height:1;color:var(--silver2);border-color:var(--line);flex:0 0 auto}
  button.q:hover{border-color:var(--accent);color:var(--loud)}
  .bar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:10px 0 4px}
  .bar label{color:var(--silver2);font-size:12px;display:inline-flex;align-items:center;gap:6px}
  .card{border:1px solid var(--line);border-radius:6px;margin-top:14px;overflow:hidden}
  .card>header{background:var(--ink3);padding:6px 10px;font-size:13px;color:var(--loud);
     display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}
  .card>header .sub{color:var(--silver2);font-size:12px;font-weight:400}
  /* 판정은 색이 아니라 밝기로 가른다 — 어긋난 것이 가장 밝고 굵다 */
  .pass{color:var(--dim)} .warn{color:var(--mid)} .fail{color:var(--loud);font-weight:700}
  .num{font-variant-numeric:tabular-nums}
  .note{color:var(--silver2);font-size:11.5px;padding:7px 10px;border-top:1px solid var(--line)}
  .err{color:var(--loud)}
  .stage{color:var(--silver);text-align:left}
  /* 평균만 적으면 실제로 몇 개가 나왔는지 말하지 못한다 — 그 아래 합계를 붙인다 */
  .tot{display:block;font-size:10.5px;font-weight:400;color:var(--silver3);white-space:nowrap}
  .hint{color:var(--silver3);font-size:11px}
  b{color:var(--silver)}

  /* 좁은 화면의 프로필 목록 — 넓은 화면에서는 표가 그 자리를 한다 */
  #atklist,#deflist{display:none}
  .pcard{border:1px solid var(--line);border-radius:8px;background:var(--ink2);
     padding:10px 12px;margin-bottom:10px}
  .pcard .r1{display:flex;justify-content:space-between;align-items:center;gap:10px}
  .pcard .pname{font-size:15px;color:var(--silver);font-weight:600;
     overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
  .pcard .sum{margin-top:6px;font-size:13px;color:var(--silver);font-variant-numeric:tabular-nums}
  .pcard .sum span{display:block}
  .pcard .sum .alt{color:var(--silver2);font-size:12px;margin-top:2px}
  .pcard .tags{margin-top:7px;display:flex;flex-wrap:wrap;gap:5px}
  .tag{border:1px solid var(--line);border-radius:999px;padding:2px 9px;font-size:11.5px;color:var(--mid)}

  /* 묶음이 바뀌는 자리 — 모형 프로필과 그 위에 얹히는 것을 눈으로 가른다 */
  th.gsep,td.gsep{border-left:2px solid var(--silver3)}

  /* 공격 순서 — 접어 둔다. 펴면 어느 단계가 어느 값을 쓰는지 보인다 */
  details.seq{border:1px solid var(--line);border-radius:8px;background:var(--ink2);margin-bottom:18px}
  details.seq>summary{padding:11px 13px;cursor:pointer;font-size:13px;color:var(--silver);
     display:flex;justify-content:space-between;gap:10px;align-items:center;list-style:none}
  details.seq>summary::-webkit-details-marker{display:none}
  /* 닫혀 있다는 것이 한눈에 보여야 한다 — 표식을 제목 앞에 둔다 */
  details.seq>summary>span::before{content:'▶';color:var(--silver2);font-size:11px;margin-right:7px}
  details.seq[open]>summary>span::before{content:'▼'}
  .seqbody{padding:0 13px 12px}
  .step{display:flex;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
  .step .no{width:22px;height:22px;border:1px solid var(--line);border-radius:50%;
     display:grid;place-items:center;font-size:11px;color:var(--silver2);flex:0 0 auto}
  .step .sname{font-size:13.5px;color:var(--silver);font-weight:600}
  .step .sname em{font-style:normal;font-weight:400;color:var(--silver2);font-size:12px;margin-left:4px}
  .step .sref{font-size:11px;color:var(--silver3);margin-left:6px}
  .chips{display:flex;flex-wrap:wrap;gap:5px;margin-top:6px}
  .chip{border:1px solid var(--line);border-radius:999px;padding:4px 10px;font-size:12px;
     color:var(--silver2);background:transparent}
  .chip em{font-style:normal;color:var(--silver3);font-size:10.5px;margin-left:3px}
  /* 건너뛰는 자리 — 어느 단계에서 어느 단계로 넘어가는지 */
  .skip{margin:0 0 0 32px;padding:7px 11px;border-left:2px solid var(--accent);
     background:#0000000a;font-size:12.5px;color:var(--mid);border-radius:0 6px 6px 0}
  .skip b{color:var(--loud)}

  /* 세로 폼 — 이름과 값이 한 줄에 나란히 붙는다 (key-value) */
  .fsec{margin-bottom:14px}
  .fsec:last-child{margin-bottom:0}
  .fsec>h4{margin:0 0 7px;font-size:11px;letter-spacing:.08em;text-transform:uppercase;
     color:var(--silver3);border-bottom:1px solid var(--line);padding-bottom:5px}
  .form{display:grid;grid-template-columns:repeat(auto-fit,minmax(215px,1fr));gap:8px}
  .fld{display:flex;align-items:center;justify-content:space-between;gap:10px;
     border:1px solid var(--line);border-radius:6px;background:var(--ink);padding:8px 10px}
  /* ⚠ 격자 칸은 기본이 min-width:auto 라 긴 이름표를 만나면 칸이 부풀어 격자가 터진다.
     0 으로 눌러 두고 이름표가 줄바꿈하게 한다 — 그래야 좁은 화면에서 두 칸이 선다 */
  .form>*{min-width:0}
  .fld .k{display:flex;align-items:baseline;flex-wrap:wrap;gap:2px 5px;flex:1 1 auto;
     min-width:0;font-size:13.5px;color:var(--silver2);
     word-break:keep-all}   /* 「명중 보정」이 "명중 보/정" 으로 끊기지 않게 */
  .fld .k em{font-style:normal;font-size:11px;color:var(--silver3)}
  .fld .v{display:flex;align-items:center;gap:5px;flex:0 0 auto}
  .fld.wide{grid-column:1/-1}
  .fld.wide input[type=text]{width:100%}
  .fld.wide .v{flex:1 1 auto}

  /* 히스토그램 — 계열이 하나라 범례 없이 제목이 계열을 말한다.
     ⚠ SVG 로 그리면 글자가 그림과 함께 늘고 줄어 폰에서 읽을 수 없다.
       막대는 상자로 긋고 글자는 그냥 글자로 둔다 — 어느 폭에서나 제 크기다 */
  .chart{padding:12px 10px;border-top:1px solid var(--line)}
  .chart .ttl{font-size:11.5px;color:var(--silver2);margin-bottom:9px}
  .plot{position:relative}
  .bars{display:flex;align-items:flex-end;gap:3px;height:150px;padding-top:18px;
     border-bottom:1px solid var(--line)}
  .bcol{flex:1 1 0;min-width:0;height:100%;display:flex;align-items:flex-end}
  .bbar{width:100%;background:var(--bar);position:relative}
  .bpct{position:absolute;bottom:100%;left:50%;transform:translateX(-50%);margin-bottom:3px;
     font-size:10px;color:var(--silver2);white-space:nowrap}
  .bxs{display:flex;gap:3px;margin-top:5px}
  .bxs span{flex:1 1 0;min-width:0;text-align:center;font-size:10px;color:var(--silver3);
     white-space:nowrap;overflow:hidden}
  .mline{position:absolute;top:18px;bottom:0;border-left:2px dashed var(--loud)}
  .mlbl{position:absolute;top:0;font-size:10px;color:var(--loud);white-space:nowrap;
     transform:translateX(-50%)}
  .statrow{display:flex;flex-wrap:wrap;gap:4px 16px;padding:0 10px 9px;font-size:11.5px;color:var(--silver2)}

  /* 팝업 — 브라우저가 주는 <dialog> 를 쓴다. 겹쳐 열면 나중 것이 위에 선다 */
  dialog{background:var(--ink2);color:var(--silver);border:1px solid var(--line);border-radius:10px;
     padding:0;max-width:660px;width:calc(100% - 20px);box-shadow:0 12px 44px #00000026}
  dialog::backdrop{background:#00000059}
  dialog header{display:flex;justify-content:space-between;align-items:baseline;gap:12px;
     padding:12px 14px;border-bottom:1px solid var(--line);background:var(--ink3)}
  dialog h3{margin:0;font-size:15px;color:var(--loud)}
  dialog .ref{font-size:11.5px;color:var(--silver3);white-space:nowrap}
  dialog .body{padding:13px 14px;font-size:13px;line-height:1.65;
     max-height:min(72vh,620px);overflow:auto}
  dialog .body p{margin:0 0 9px}
  dialog .body .how{color:var(--mid)}
  dialog .body ul{margin:6px 0 10px;padding-left:18px;color:var(--silver2)}
  dialog .body li{margin:3px 0}
  dialog .body table{font-size:12px;margin:4px 0 10px}
  dialog .body td{white-space:normal;text-align:left;vertical-align:top;padding:3px 8px 3px 0}
  dialog footer{padding:10px 14px;border-top:1px solid var(--line);
     display:flex;justify-content:space-between;gap:10px}
  /* 팝업 안에서 다른 항목으로 건너뛰는 자리 — 누르면 이 위에 또 뜬다 */
  .seealso{display:flex;flex-wrap:wrap;gap:6px;padding-top:9px;border-top:1px solid var(--line)}
  .seealso button{font-size:12px;padding:4px 10px;border-radius:999px}

  @media (max-width: 820px){
    body{padding:12px}
    h1{font-size:17px}
    .top{flex-direction:column;gap:10px}
    .langsw{align-self:flex-start}
    /* 값 하나에 한 줄을 쓰지 않는다 — 표를 접고 요약 카드를 낸다 */
    #atkwrap,#defwrap{display:none}
    #atklist,#deflist{display:block}
    /* 결과표는 칸이 셋뿐이라 접지 않는다 — 표가 그대로 읽힌다 */
    #out td.stage{white-space:normal}
    #out .hint{display:block;font-size:10.5px}
    /* 16px 미만이면 칸을 누를 때 iOS 가 화면을 확대한다 — 확대되면 표가 어긋나 보인다 */
    input,select{font-size:16px;padding:7px 9px}
    input[type=number]{width:4.6em}
    input.expr{width:5.6em}
    select{width:auto;min-width:8.5em}
    button{padding:9px 13px}
    button.q{width:23px;height:23px;font-size:12px}
    button.pill{padding:7px 14px;font-size:13.5px}
    button.run{flex:1 1 100%;padding:13px}
    .bar label{justify-content:space-between;flex:1 1 100%;font-size:13.5px}
    .bar .hint,#status{flex:1 1 100%}
    .card>header{flex-direction:column;gap:3px}
    /* 값 둘씩 나란히 — 한 줄에 하나는 낭비다 (human 2026-08-18) */
    .form{grid-template-columns:repeat(auto-fit,minmax(165px,1fr));gap:7px}
    .fld{padding:7px 9px}
    .fld .k{font-size:13px}
    .fld input[type=number]{width:4.1em}
    dialog .body{padding:11px}
    .statrow{gap:3px 12px}
  }
</style>
</head>
<body>
<div class="wrap">

  <div class="top">
    <div>
      <h1 id="t-title"></h1>
      <p class="lead" id="t-lead"></p>
    </div>
    <div class="langsw" id="langsw">
      <button data-lang="ko">한국어</button><button data-lang="en">English</button>
    </div>
  </div>

  <div class="bar" style="margin:0 0 10px"><button id="basics"></button></div>
  <details class="seq" id="seq"></details>

  <h2 id="t-atk"></h2>
  <div class="scroll" id="atkwrap"><table id="atk"><thead><tr></tr></thead><tbody></tbody></table></div>
  <div id="atklist"></div>
  <div class="bar">
    <button id="add"></button>
    <span class="hint" id="t-exprhint"></span>
  </div>

  <h2 id="t-def"></h2>
  <div class="scroll" id="defwrap"><table id="def"><thead><tr></tr></thead><tbody></tbody></table></div>
  <div id="deflist"></div>

  <h2 id="t-cfg"></h2>
  <div class="bar">
    <label><span id="t-runs"></span><input type="number" id="runs" min="1" max="1000000" step="1000" style="width:84px"></label>
    <label><span id="t-seed"></span><input type="number" id="seed" style="width:130px;text-align:left"></label>
    <button class="run" id="run"></button>
    <span id="status" class="hint"></span>
  </div>

  <div id="out"></div>

  <p class="note" id="t-footnote" style="border:1px solid var(--line);border-radius:6px;margin-top:22px"></p>
</div>

<script>
"use strict";

// ─────────────────────────────────────────────────────────────────────────────
// 주사위 — 시드를 주면 같은 판이 다시 나온다. 어긋난 결과를 다시 볼 수 있어야 한다
// ─────────────────────────────────────────────────────────────────────────────
const mulberry32 = (seed) => { let a = seed >>> 0; return () => {
  a = (a + 0x6D2B79F5) | 0;
  let t = Math.imul(a ^ (a >>> 15), 1 | a);
  t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
  return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
};};
let rand = Math.random;
const dN = (faces) => 1 + Math.floor(rand() * faces);
const d6 = () => dN(6);

// ─────────────────────────────────────────────────────────────────────────────
// 주사위 식 — 한 번 뜯어서 굴림과 기대값 둘 다 이 결과로 낸다.
// 두 번 뜯으면 굴림과 식이 조용히 갈라진다
// ─────────────────────────────────────────────────────────────────────────────
function parseExpr(str) {
  const s = String(str == null ? '' : str).toUpperCase().replace(/\s+/g, '');
  if (s === '') return null;
  const chunks = s.match(/[+-]?[^+-]+/g);
  if (!chunks) return null;
  const terms = [];
  for (const c of chunks) {
    const sign = c.startsWith('-') ? -1 : 1;
    const body = c.replace(/^[+-]/, '');
    if (/^\d+$/.test(body)) { terms.push({ sign: sign, konst: parseInt(body, 10) }); continue; }
    const m = body.match(/^(\d*)D(\d+)$/);
    if (!m) return null;
    const count = m[1] ? parseInt(m[1], 10) : 1;
    const faces = parseInt(m[2], 10);
    if (faces <= 0 || count <= 0 || count > 100) return null;
    terms.push({ sign: sign, count: count, faces: faces });
  }
  return terms;
}

/** 식에 든 주사위 개수 — "2D6+1" 은 2 개, "3" 은 0 개. 굴리지 않아도 정해진다 */
const diceOf = (terms) => terms.reduce((n, t) => n + (t.konst != null ? 0 : t.count), 0);

// 합은 0에서 끊는다 — "D3-1" 이 음수 피해를 내지 않는다
const rollExpr = (terms) => {
  let sum = 0;
  for (const t of terms) {
    if (t.konst != null) { sum += t.sign * t.konst; continue; }
    for (let i = 0; i < t.count; i++) sum += t.sign * dN(t.faces);
  }
  return Math.max(0, sum);
};

// 기대값은 분포를 접어서 정확히 낸다. 3.5 를 곱하면 0 에서 끊기는 몫을 놓친다
function meanExpr(terms) {
  let pmf = new Map([[0, 1]]);
  for (const t of terms) {
    if (t.konst != null) {
      const shifted = new Map();
      for (const entry of pmf) shifted.set(entry[0] + t.sign * t.konst, entry[1]);
      pmf = shifted;
      continue;
    }
    for (let i = 0; i < t.count; i++) {
      const n = new Map();
      for (const entry of pmf) for (let f = 1; f <= t.faces; f++) {
        const k = entry[0] + t.sign * f;
        n.set(k, (n.get(k) || 0) + entry[1] / t.faces);
      }
      pmf = n;
    }
  }
  let e = 0;
  for (const entry of pmf) e += Math.max(0, entry[0]) * entry[1];
  return e;
}

// ─────────────────────────────────────────────────────────────────────────────
// 판정 규칙
// ─────────────────────────────────────────────────────────────────────────────
const woundTarget = (s, t) => (s >= t * 2 ? 2 : s > t ? 3 : s === t ? 4 : s <= t / 2 ? 6 : 5);

/** 재굴림은 한 번만 한다. 다시 굴린 눈은 좋든 나쁘든 그대로 쓴다 */
const applyReroll = (rolls, type, isFail) => {
  if (type === 'none') return rolls;
  return rolls.map((die) => {
    const re = type === 'all' ? true : type === '1s' ? die === 1 : isFail(die);
    return re ? d6() : die;
  });
};

/** 재굴림을 반영한 눈의 분포 — 굴림 쪽 applyReroll 과 같은 규칙이어야 한다 */
function facePmf(type, isFail) {
  const re = type === 'none' ? function () { return false; }
    : type === 'all' ? function () { return true; }
    : type === '1s' ? function (f) { return f === 1; }
    : isFail;
  let pRe = 0;
  for (let f = 1; f <= 6; f++) if (re(f)) pRe += 1 / 6;
  const p = new Array(7).fill(0);
  for (let f = 1; f <= 6; f++) p[f] = (re(f) ? 0 : 1 / 6) + pRe / 6;
  return p;
}
const pOf = (p, pred) => { let s = 0; for (let f = 1; f <= 6; f++) if (pred(f)) s += p[f]; return s; };

/** 프로필 한 쌍에서 판정 기준을 뽑는다 — 굴림과 식이 같은 것을 본다 */
function derive(a, d) {
  const wt = woundTarget(a.strength, d.toughness);
  const armor = d.save - a.ap;                       // AP 는 음수로 적는다
  const st = d.inv > 0 && d.inv < armor ? d.inv : armor;
  const anti = a.anti > 0 ? a.anti : 0;

  return {
    wt: wt, armor: armor, st: st, anti: anti,
    // 무기마다 더 굴리는 공격 주사위 — [폭발] 24.05 와 [속사] 24.30
    atkBonus: (a.blast > 0 ? a.blast * Math.floor(d.models / 5) : 0) +
              (a.rapidFire > 0 && a.halfRange ? a.rapidFire : 0),
    hitCrit:  (f) => f === 6,
    hitOk:    (f) => f === 6 || (f !== 1 && f + a.hitMod >= a.hitTarget),
    hitFail:  (f) => f !== 6 && (f === 1 || f + a.hitMod < a.hitTarget),
    wCrit:    (f) => f === 6 || (anti > 0 && f >= anti),
    wOk:      (f) => f === 6 || (anti > 0 && f >= anti) || (f !== 1 && f >= wt),
    wFail:    (f) => !(f === 6 || (anti > 0 && f >= anti)) && f < wt,
    saveOk:   (f) => f !== 1 && f >= st,
    saveFail: (f) => f === 1 || f < st,
    fnpKeep:  d.fnp > 0 ? (d.fnp - 1) / 6 : 1,
  };
}

/** 사격 한 번을 끝까지 굴린다 */
function simulateOnce(a, d, k, atkTerms, dmgTerms) {
  // [위험] 24.15 — 모든 공격을 처리한 뒤 무기 수만큼 위험 굴림. 맞는 것은 자기 유닛이다.
  // 공격이 하나도 없어도 굴린다(유닛이 사격에 선택된 것은 사실이므로) — 그래서 먼저 센다
  const n = Math.max(1, a.weapons);
  let hazard = 0;
  if (a.hazardous) for (let i = 0; i < n; i++) if (d6() <= 2) hazard++;

  // 단계마다 「몇 번 굴렸나(t_)」와 「몇이 나왔나」를 함께 센다.
  // 합계만 있으면 그 수가 무엇 중의 몇인지 말하지 못한다
  // ⚠ 공격 횟수 단계에는 시도가 없다. 그 단계는 주사위를 만들어 내는 자리이지
  //   무엇을 시도해 걸러 내는 자리가 아니다 — 없는 것은 적지 않는다
  const t = { t_hits: 0, t_wounds: 0, t_failed: 0, t_raw: 0, t_hazard: a.hazardous ? n : 0 };

  let attacks = 0;
  for (let i = 0; i < n; i++) attacks += rollExpr(atkTerms) + k.atkBonus;
  if (attacks <= 0) return { attacks: 0, hits: 0, wounds: 0, failed: 0, raw: 0,
                             applied: 0, destroyed: 0, hazard: hazard, ...t };

  // 명중 — [방사] 24.37 은 굴리지 않고 자동으로 맞는다.
  // 굴림이 없으니 「보정 전 6」도 없다 → 결정적 명중이 생기지 않고, 거기 기대는
  // [치명적 명중]·[지속 명중]도 발동하지 않는다
  let successes = 0, crits = 0;
  t.t_hits = a.torrent ? 0 : attacks;        // [방사] 는 굴리지 않는다 — 시도가 0 이다
  if (a.torrent) {
    successes = attacks;
  } else {
    let hr = Array.from({ length: attacks }, d6);
    hr = applyReroll(hr, a.hitReroll, k.hitFail);
    for (const die of hr) { if (!k.hitOk(die)) continue; successes++; if (k.hitCrit(die)) crits++; }
  }
  const sustained = a.sustained > 0 ? crits * a.sustained : 0;
  const lethal = a.lethal ? crits : 0;
  const hits = successes + sustained;

  // 상처 — 치명적 명중으로 자동 상처가 된 것은 굴리지 않는다
  t.t_wounds = Math.max(0, hits - lethal);
  let wr = Array.from({ length: t.t_wounds }, d6);
  wr = applyReroll(wr, a.woundReroll, k.wFail);
  let wSucc = 0, wCritN = 0;
  for (const die of wr) { if (!k.wOk(die)) continue; wSucc++; if (k.wCrit(die)) wCritN++; }
  const devast = a.devastating ? wCritN : 0;
  const wounds = wSucc + lethal;

  // 방호 — 파괴적 상처는 방호를 건너뛴다
  const attempts = Math.max(0, wounds - devast);
  t.t_failed = attempts;
  let sr = Array.from({ length: attempts }, d6);
  sr = applyReroll(sr, d.saveReroll, k.saveFail);
  let saved = 0;
  for (const die of sr) if (k.saveOk(die)) saved++;
  const failed = (attempts - saved) + devast;

  // 피해 — 원피해는 상한 없이 세고, 적용 피해는 모델 체력에 걸려 소멸하는 몫을 뺀다
  t.t_raw = failed;                          // 피해는 방호에 실패한 수만큼 굴린다
  let raw = 0, applied = 0, destroyed = 0, remaining = d.wounds;
  for (let i = 0; i < failed; i++) {
    let dmg = rollExpr(dmgTerms);
    if (d.fnp > 0 && dmg > 0) {
      let ignored = 0;
      for (let x = 0; x < dmg; x++) if (d6() >= d.fnp) ignored++;
      dmg = Math.max(0, dmg - ignored);
    }
    if (dmg <= 0) continue;
    raw += dmg;
    if (destroyed >= d.models) continue;            // 전멸한 뒤의 피해는 갈 곳이 없다
    applied += Math.min(dmg, remaining);
    if (dmg >= remaining) { destroyed++; remaining = d.wounds; } else { remaining -= dmg; }
  }

  return { attacks: attacks, hits: hits, wounds: wounds, failed: failed,
           raw: raw, applied: applied, destroyed: destroyed, hazard: hazard, ...t };
}

/** 같은 프로필의 기대값 — 굴리지 않고 식으로 낸다 */
function expected(a, d, k, atkTerms, dmgTerms) {
  const ph = facePmf(a.hitReroll, k.hitFail);
  const pw = facePmf(a.woundReroll, k.wFail);
  const ps = facePmf(d.saveReroll, k.saveFail);

  const attacks = Math.max(1, a.weapons) * (meanExpr(atkTerms) + k.atkBonus);
  const pHit = a.torrent ? 1 : pOf(ph, k.hitOk);
  const pHitCrit = a.torrent ? 0 : pOf(ph, (f) => k.hitOk(f) && k.hitCrit(f));

  const hits = attacks * (pHit + (a.sustained > 0 ? a.sustained * pHitCrit : 0));
  const lethal = attacks * (a.lethal ? pHitCrit : 0);

  const woundDice = Math.max(0, hits - lethal);
  const pWound = pOf(pw, k.wOk);
  const pWoundCrit = pOf(pw, (f) => k.wOk(f) && k.wCrit(f));
  const wounds = woundDice * pWound + lethal;
  const devast = a.devastating ? woundDice * pWoundCrit : 0;

  const attempts = Math.max(0, wounds - devast);
  const failed = attempts * pOf(ps, k.saveFail) + devast;

  return { attacks: attacks, hits: hits, wounds: wounds, failed: failed,
           raw: failed * meanExpr(dmgTerms) * k.fnpKeep,
           // 위험 굴림은 무기마다 한 번, 1~2 에서 실패한다 → 무기 수 × 2/6
           hazard: a.hazardous ? Math.max(1, a.weapons) * (2 / 6) : 0 };
}

  name: T().profile(n), weapons: 5, attacks: '2', hitTarget: 3, hitMod: 0, hitReroll: 'none',
  strength: 4, woundReroll: 'none', ap: 0, damage: '1',

});
let state = {
  lang: (navigator.language || 'ko').toLowerCase().startsWith('ko') ? 'ko' : 'en',
  attackers: [],
  defender: { toughness: 4, save: 3, inv: 0, fnp: 0, wounds: 2, models: 5, saveReroll: 'none' },
  runs: 10000, seed: '',
};
/** 판정 기준 — 표준오차의 두 배 안이면 통과. 고르게 하지 않는다(사람이 만질 값이 아니다) */
const SIGMA = 2;
try {
  const saved = JSON.parse(localStorage.getItem(KEY) || 'null');
  if (saved && Array.isArray(saved.attackers) && saved.attackers.length) state = saved;
} catch (e) { /* 깨진 저장물로 시작하지 않는다 */ }
if (!state.attackers.length) state.attackers = [newAttacker(1)];
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) {} };

const num = (v, lo, hi) => { const n = Number(v); return Number.isFinite(n) ? Math.min(hi, Math.max(lo, n)) : lo; };
const esc = (s) => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/"/g, '&quot;');
const getPath = (p) => p.split('.').reduce((o, x) => o[x], state);
const setPath = (p, v) => {
  const parts = p.split('.');
  let o = state;
  for (const x of parts.slice(0, -1)) o = o[x];
  o[parts[parts.length - 1]] = v;
};

// ─────────────────────────────────────────────────────────────────────────────
// 팝업 — 브라우저가 주는 <dialog> 를 쓴다. 하나씩 만들어 띄우므로 **겹쳐 열린다**
// (팝업 안의 ? 를 누르면 그 위에 또 뜨고, 닫으면 아래 것이 그대로 남는다)
// ─────────────────────────────────────────────────────────────────────────────
function openDialog(title, ref, bodyHtml, footHtml) {
  const d = document.createElement('dialog');
  d.innerHTML = '<header><h3>' + esc(title) + '</h3><span class="ref">' + esc(ref || '') + '</span></header>' +
    '<div class="body">' + bodyHtml + '</div>' +
    '<footer>' + (footHtml || '<span></span>') +
    '<button data-close>' + esc(T().close) + '</button></footer>';
  document.body.appendChild(d);
  d.addEventListener('click', (e) => {
    if (e.target === d || e.target.closest('[data-close]')) d.close();   // 바깥을 눌러도 닫힌다
  });
  d.addEventListener('close', () => d.remove());
  d.showModal();
  return d;
}

function openHelp(key) {
  const h = H()[key];
  if (!h) return;
  let body = '<p>' + esc(h.what) + '</p>';
  if (h.list) body += '<ul>' + h.list.map((x) => '<li>' + esc(x) + '</li>').join('') + '</ul>';
  if (h.table) {
    body += '<table><tbody>' + h.table.map((r) =>
      '<tr>' + r.map((c, i) => '<td' + (i === 1 ? ' style="color:var(--mid);white-space:nowrap"' : '') +
        '>' + esc(c) + '</td>').join('') + '</tr>').join('') + '</tbody></table>';
  }
  if (h.how) body += '<p class="how">→ ' + esc(h.how) + '</p>';
  if (h.see) {
    body += '<div class="seealso"><span class="hint">' + esc(T().seeAlso) + '</span>' +
      h.see.filter((k) => H()[k]).map((k) =>
        '<button data-help="' + k + '">' + esc(H()[k].t) + '</button>').join('') + '</div>';
  }
  openDialog(h.t, h.ref, body);
}

/** 물음표 하나 — 머리글에도, 세로 폼에도, 팝업 안에도 같은 것이 붙는다 */
const q = (key) => H()[key]
  ? '<button class="q" data-help="' + key + '" aria-label="' + esc(T().helpAria) + '" title="' + esc(H()[key].t) + '">?</button>'
  : '';

// ─────────────────────────────────────────────────────────────────────────────
// 칸 하나 그리기 — 이름은 두 말을 나란히(병기), 값은 종류에 맞는 입력칸
// ─────────────────────────────────────────────────────────────────────────────
const other = () => (state.lang === 'ko' ? 'en' : 'ko');
/** 이름 병기 — 두 말이 같으면 한 번만 적는다 (AP 를 "AP AP" 로 적지 않는다) */
function fieldName(k, tag) {
  const a = L[state.lang].f[k], b = L[other()].f[k];
  return esc(a) + (a === b ? '' : ' <' + tag + '>' + esc(b) + '</' + tag + '>');
}

const selectOf = (path, v) => '<select data-p="' + path + '">' +
  Object.keys(T().reroll).map((k) => '<option value="' + k + '"' + (v === k ? ' selected' : '') + '>' +
    esc(T().reroll[k]) + '</option>').join('') + '</select>';

function cellInput(path, col, v) {
  const lim = LIMITS[col.k] || [-999, 999];
  const n = (extra) => '<input type="number" data-p="' + path + '" value="' + v +
    '" min="' + lim[0] + '" max="' + lim[1] + '" step="1">' + (extra || '');
  switch (col.t) {
    case 'text':   return '<input type="text" class="name" data-p="' + path + '" value="' + esc(v) + '">';
    case 'expr':   return '<input type="text" class="expr" data-p="' + path + '" value="' + esc(v) + '">';
    // 특수 규칙은 체크박스가 아니라 누르면 켜지는 버튼이다 (human 2026-08-18)
    case 'pill':   return '<button class="pill" data-toggle="' + path + '" aria-pressed="' + (v ? 'true' : 'false') +
                          '">' + esc(v ? T().on : T().off) + '</button>';
    case 'reroll': return selectOf(path, v);
    case 'plus':   return n('+');
    case 'plusz':  return n(v > 0 ? '+' : '');
    default:       return n();
  }
}

// ─────────────────────────────────────────────────────────────────────────────
// 공격 순서 — 단계마다 **그 단계가 쓰는 값**을 딱지로 단다. 딱지를 누르면 설명이 뜬다.
// ⚠ 단계 이름과 참조번호는 설명 사전(s_*)에서 그대로 온다 — 두 벌로 적지 않는다
// ─────────────────────────────────────────────────────────────────────────────
const NUM = ['①', '②', '③', '④', '⑤'];
const STEPS = [
  { key: 's_attacks', fields: ['weapons', 'attacks', 'blast', 'rapidFire', 'halfRange'] },
  { key: 's_hits',    fields: ['hitTarget', 'hitMod', 'hitReroll', 'torrent'] },
  { key: 's_wounds',  fields: ['strength', 'toughness', 'woundReroll', 'anti'] },
  { key: 's_failed',  fields: ['save', 'ap', 'inv', 'saveReroll'] },
  { key: 's_raw',     fields: ['damage', 'fnp', 'wounds', 'models'] },
];
/** 건너뛰는 규칙 — 어느 단계 뒤에서 어느 단계를 건너뛰는지 */
const SKIPS = [
  { after: 2, help: 'lethal', text: 'skipLethal' },
  { after: 3, help: 'devastating', text: 'skipDevast' },
  { after: 5, help: 'hazardous', text: 'afterHazard' },
];

function renderSeq() {
  const t = T();
  let rows = '';
  STEPS.forEach((st, i) => {
    const ph = t.phases[i];
    rows += '<div class="step"><span class="no">' + NUM[i] + '</span><div>' +
      '<div><span class="sname">' + esc(ph[0]) + ' <em>' + esc(ph[1]) + '</em></span>' +
        '<span class="sref">' + esc(ph[2]) + '</span> ' + q(st.key) + '</div>' +
      '<div class="chips">' + st.fields.map((k) =>
        '<button class="chip" data-help="' + k + '">' + fieldName(k, 'em') + '</button>').join('') + '</div>' +
    '</div></div>';
    for (const sk of SKIPS) if (sk.after === i + 1) rows += '<div class="skip">' + t[sk.text] + ' ' + q(sk.help) + '</div>';
  });
  document.getElementById('seq').innerHTML =
    '<summary><span>' + esc(t.seqTitle) + '</span></summary><div class="seqbody">' + rows + '</div>';
}

// ─────────────────────────────────────────────────────────────────────────────
// 넓은 화면 — 표 하나에 다 보이고, 보는 자리가 곧 고치는 자리다
// ─────────────────────────────────────────────────────────────────────────────
const headRow = (cols, tail) =>
  cols.map((c, i) => '<th' + (isGroupStart(cols, i) ? ' class="gsep"' : '') + '><span class="hd">' +
    fieldName(c.k, 'em') + q(c.k) + '</span></th>').join('') + (tail || '');

function renderTables() {
  document.querySelector('#atk thead tr').innerHTML = headRow(COLS_ATK, '<th></th>');
  document.querySelector('#atk tbody').innerHTML = state.attackers.map((a, i) => '<tr>' +
    COLS_ATK.map((c, j) => '<td' + (isGroupStart(COLS_ATK, j) ? ' class="gsep"' : '') + '>' +
      cellInput('attackers.' + i + '.' + c.k, c, a[c.k]) + '</td>').join('') +
    '<td><button class="x" data-dup="' + i + '" title="' + esc(T().dup) + '">&#10697;</button>' +
    '<button class="x" data-del="' + i + '" title="' + esc(T().del) + '">&#10005;</button></td>' +
  '</tr>').join('');

  document.querySelector('#def thead tr').innerHTML = headRow(COLS_DEF);
  document.querySelector('#def tbody').innerHTML = '<tr>' +
    COLS_DEF.map((c, j) => '<td' + (isGroupStart(COLS_DEF, j) ? ' class="gsep"' : '') + '>' +
      cellInput('defender.' + c.k, c, state.defender[c.k]) + '</td>').join('') + '</tr>';

  document.getElementById('runs').value = state.runs;
  document.getElementById('seed').value = state.seed;
}

// ─────────────────────────────────────────────────────────────────────────────
// 좁은 화면 — 요약 카드. 값 하나에 한 줄을 쓰지 않는다.
// 고치는 것은 카드를 눌러 여는 세로 폼에서 한다 (human 2026-08-18)
// ─────────────────────────────────────────────────────────────────────────────
const sign = (n) => (n > 0 ? '+' + n : String(n));

/** 요약에 적는 칸 — 데이터시트 차례대로 (A · BS/WS · S · AP · D) */
const SUM_ATK = ['attacks', 'hitTarget', 'strength', 'ap', 'damage'];
const SUM_DEF = ['toughness', 'save', 'wounds'];

/** 값의 꼴은 칸 정의를 따른다 — 「3」 이 아니라 「3+」 로 보여야 한다 */
function valueText(cols, k, v) {
  const t = (cols.find((c) => c.k === k) || {}).t;
  if (t === 'plus') return v + '+';
  if (t === 'plusz') return v > 0 ? v + '+' : String(v);
  return String(v);
}

/**
 * 요약 한 줄 — 어느 말로 적는지만 다르다.
 * ko  (공격 2 · 명중 3+ · 위력 4 · 관통 0 · 피해 1) 5개
 * en  5 × (A 2 · BS/WS 3+ · S 4 · AP 0 · D 1)
 */
function summaryLine(lang, cols, keys, obj, count) {
  const dict = L[lang];
  const body = '(' + keys.map((k) => dict.f[k] + ' ' + valueText(cols, k, obj[k])).join(' · ') + ')';
  const unit = dict.unit(count);
  return dict.countFirst ? unit + ' ' + body : body + ' ' + unit;
}
/** 지금 말이 위, 다른 말이 아래 — 칸 이름을 병기하는 것과 같은 차례다 */
const summaryOf = (cols, keys, obj, count) =>
  '<span>' + esc(summaryLine(state.lang, cols, keys, obj, count)) + '</span>' +
  '<span class="alt">' + esc(summaryLine(other(), cols, keys, obj, count)) + '</span>';
/** 켜져 있는 것만 딱지로 보인다 — 꺼진 것을 늘어놓으면 요약이 아니다 */
function tagsOf(a) {
  const f = T().f, r = T().reroll, out = [];
  if (a.torrent) out.push(f.torrent);
  if (a.hitMod) out.push(f.hitMod + ' ' + sign(a.hitMod));
  if (a.hitReroll !== 'none') out.push(f.hitReroll + ' ' + r[a.hitReroll]);
  if (a.woundReroll !== 'none') out.push(f.woundReroll + ' ' + r[a.woundReroll]);
  if (a.lethal) out.push(f.lethal);
  if (a.sustained > 0) out.push(f.sustained + ' ' + a.sustained);
  if (a.devastating) out.push(f.devastating);
  if (a.anti > 0) out.push(f.anti + ' ' + a.anti + '+');
  if (a.blast > 0) out.push(f.blast + ' ' + a.blast);
  if (a.rapidFire > 0) out.push(f.rapidFire + ' ' + a.rapidFire + (a.halfRange ? ' · ' + f.halfRange : ''));
  if (a.hazardous) out.push(f.hazardous);
  return out;
}
function defTags(d) {
  const f = T().f, r = T().reroll, out = [];
  if (d.inv > 0) out.push(f.inv + ' ' + d.inv + '+');
  if (d.fnp > 0) out.push(f.fnp + ' ' + d.fnp + '+');
  if (d.saveReroll !== 'none') out.push(f.saveReroll + ' ' + r[d.saveReroll]);
  return out;
}

const pcard = (title, sum, tags, editAttr, dupAttr, delAttr) =>
  '<div class="pcard">' +
    '<div class="r1"><span class="pname">' + esc(title) + '</span><span style="display:flex;gap:6px">' +
      '<button ' + editAttr + '>' + esc(T().edit) + '</button>' +
      (dupAttr ? '<button ' + dupAttr + '>' + esc(T().dup) + '</button>' : '') +
      (delAttr ? '<button class="x" ' + delAttr + '>&#10005;</button>' : '') +
    '</span></div>' +
    '<div class="sum">' + sum + '</div>' +
    (tags && tags.length ? '<div class="tags">' + tags.map((x) => '<span class="tag">' + esc(x) + '</span>').join('') + '</div>' : '') +
  '</div>';

function renderList() {
  document.getElementById('atklist').innerHTML = state.attackers.map((a, i) =>
    pcard(a.name, summaryOf(COLS_ATK, SUM_ATK, a, a.weapons), tagsOf(a), 'data-edit="' + i + '"',
          'data-dup="' + i + '"',
          state.attackers.length > 1 ? 'data-del="' + i + '"' : '')).join('');
  const d = state.defender;
  document.getElementById('deflist').innerHTML =
    pcard(T().defName, summaryOf(COLS_DEF, SUM_DEF, d, d.models), defTags(d), 'data-edit="def"', '', '');
}

/** 세로 폼 — 이름과 값이 한 줄에 붙어 있다(key-value). 이름 옆의 ? 는 위에 겹쳐 뜬다 */
function openEditor(which) {
  const isDef = which === 'def';
  const cols = isDef ? COLS_DEF : COLS_ATK;
  const base = isDef ? 'defender' : 'attackers.' + which;
  const obj = isDef ? state.defender : state.attackers[which];
  const fld = (c) => {
    const wide = c.t === 'text' || c.t === 'reroll';   // 켬/끔 버튼은 좁아도 되니 둘씩 선다
    return '<label class="fld' + (wide ? ' wide' : '') + '">' +
      '<span class="k">' + fieldName(c.k, 'em') + q(c.k) + '</span>' +
      '<span class="v">' + cellInput(base + '.' + c.k, c, obj[c.k]) + '</span></label>';
  };
  const section = (g, title) => {
    const part = cols.filter((c) => c.g === g);
    return part.length ? '<div class="fsec"><h4>' + esc(title) + '</h4><div class="form">' +
      part.map(fld).join('') + '</div></div>' : '';
  };
  const body = section('base', T().secBase) + section('extra', T().secExtra);
  openDialog(isDef ? T().defName : obj.name, '', body);
}

// ─────────────────────────────────────────────────────────────────────────────
// 화면 말 갈아 끼우기 — 글자가 박혀 있지 않으므로 다시 그리기만 하면 된다
// ─────────────────────────────────────────────────────────────────────────────
function renderChrome() {
  const t = T();
  document.documentElement.lang = t.html;
  document.title = t.title;
  const set = (id, v, html) => { const el = document.getElementById(id); if (html) el.innerHTML = v; else el.textContent = v; };
  set('t-title', t.title); set('t-lead', t.lead, true);
  set('t-atk', t.atk); set('t-def', t.def); set('t-cfg', t.cfg);
  set('add', t.add); set('basics', t.basics); set('t-exprhint', t.exprHint);
  set('t-runs', t.runs); set('t-seed', t.seed);
  set('run', t.run); set('t-footnote', t.footnote, true);
  renderSeq();
  document.getElementById('seed').placeholder = t.seedPlaceholder;
  for (const b of document.querySelectorAll('#langsw button'))
    b.setAttribute('aria-pressed', String(b.dataset.lang === state.lang));
}
const renderAll = () => { renderTables(); renderList(); };

// ─────────────────────────────────────────────────────────────────────────────
// 손대는 자리
// ─────────────────────────────────────────────────────────────────────────────
document.addEventListener('change', (e) => {
  const el = e.target.closest('[data-p]');
  if (!el) return;
  const field = el.dataset.p.split('.').pop();
  const lim = LIMITS[field] || [-999, 999];
  setPath(el.dataset.p, el.type === 'number' ? num(el.value, lim[0], lim[1]) : el.value);
  save();
  // ⚠ 열려 있는 세로 폼은 다시 그리지 않는다 — 고치던 칸이 사라진다
  renderAll();
});
document.addEventListener('click', (e) => {
  const help = e.target.closest('[data-help]');
  if (help) { openHelp(help.dataset.help); return; }

  const pill = e.target.closest('[data-toggle]');
  if (pill) {
    const v = !getPath(pill.dataset.toggle);
    setPath(pill.dataset.toggle, v);
    save();
    pill.setAttribute('aria-pressed', String(v));      // 열려 있는 폼의 버튼은 제자리에서 바뀐다
    pill.textContent = v ? T().on : T().off;
    renderAll();
    return;
  }

  const edit = e.target.closest('[data-edit]');
  if (edit) { openEditor(edit.dataset.edit === 'def' ? 'def' : Number(edit.dataset.edit)); return; }

  const dup = e.target.closest('[data-dup]');
  if (dup) {
    const src = state.attackers[Number(dup.dataset.dup)];
    state.attackers.splice(Number(dup.dataset.dup) + 1, 0, JSON.parse(JSON.stringify(src)));
    save(); renderAll();
    return;
  }

  const del = e.target.closest('[data-del]');
  if (!del) return;
  if (state.attackers.length <= 1) return;
  state.attackers.splice(Number(del.dataset.del), 1);
  save(); renderAll();
});
document.getElementById('add').onclick = () => {
  state.attackers.push(newAttacker(state.attackers.length + 1));
  save(); renderAll();
};
document.getElementById('basics').onclick = () => openHelp('basics');
document.getElementById('langsw').onclick = (e) => {
  const b = e.target.closest('[data-lang]');
  if (!b || b.dataset.lang === state.lang) return;
  state.lang = b.dataset.lang;
  save(); renderChrome(); renderAll();
  if (lastRun) draw(lastRun);              // 이미 나온 결과도 함께 갈아 끼운다 (다시 굴리지 않는다)
};
document.getElementById('runs').addEventListener('change', (e) => {
  state.runs = num(e.target.value, 1, 1000000); save(); renderTables();
});
document.getElementById('seed').addEventListener('change', (e) => { state.seed = e.target.value; save(); });

// ─────────────────────────────────────────────────────────────────────────────
// 히스토그램 — 계열이 하나라 범례 없이 제목이 계열을 말한다
// ─────────────────────────────────────────────────────────────────────────────
function histogram(counts, runs, mean) {
  const seen = [...counts.keys()].sort((x, y) => x - y);
  if (!seen.length) return '<div class="chart"><p class="hint">' + esc(T().chartNone) + '</p></div>';

  const max = seen[seen.length - 1];
  const bins = [];
  for (let v = 0; v <= max; v++) bins.push({ v: v, ratio: (counts.get(v) || 0) / runs });
  const maxRatio = Math.max(...bins.map((b) => b.ratio), 1e-9);
  // 칸이 촘촘하면 막대 위 숫자가 서로 겹친다 — 그때는 눌러 보는 설명만 남긴다
  const showPct = bins.length <= 20;
  const pct = (r) => (r * 100 >= 10 ? (r * 100).toFixed(0) : (r * 100).toFixed(1)) + '%';
  const every = Math.max(1, Math.ceil(bins.length / 16));

  const cols = bins.map((b) => '<div class="bcol" title="' + b.v + ' — ' + (b.ratio * 100).toFixed(2) + '%">' +
    '<div class="bbar" style="height:' + (b.ratio / maxRatio * 100).toFixed(1) + '%' +
      (b.ratio > 0 ? ';min-height:1px' : '') + '">' +
      (showPct && b.ratio > 0 ? '<span class="bpct">' + pct(b.ratio) + '</span>' : '') +
    '</div></div>').join('');
  const xs = bins.map((b, i) => '<span>' + (i % every ? '' : b.v) + '</span>').join('');
  const meanAt = ((mean + 0.5) / bins.length * 100).toFixed(2);

  return '<div class="chart"><div class="ttl">' + esc(T().chartTitle) + '</div>' +
    '<div class="plot"><div class="bars">' + cols + '</div>' +
      '<div class="mline" style="left:' + meanAt + '%"></div>' +
      '<div class="mlbl" style="left:' + meanAt + '%">' + esc(T().chartMean) + ' ' + mean.toFixed(2) + '</div>' +
    '</div><div class="bxs">' + xs + '</div></div>';
}

/** 셈한 개수에서 분위수를 뽑는다 — 1만 시행을 통째로 들고 있을 이유가 없다 */
function quantile(counts, runs, p) {
  const target = p * (runs - 1);
  let seen = 0;
  for (const v of [...counts.keys()].sort((x, y) => x - y)) {
    seen += counts.get(v);
    if (seen > target) return v;
  }
  return 0;
}

// ─────────────────────────────────────────────────────────────────────────────
// 돌리기
// ─────────────────────────────────────────────────────────────────────────────
const f2 = (n) => n.toFixed(2);
const f3 = (n) => n.toFixed(3);
const STAGE_KEYS = ['attacks', 'hits', 'wounds', 'failed', 'raw'];
/** [위험] 은 켠 프로필에서만 잰다 — 끈 프로필에 0.000 줄을 세워 봐야 읽을 것이 없다 */
const stagesOf = (r) => (r.hazardous ? STAGE_KEYS.concat('hazard') : STAGE_KEYS);
const KEYS = ['attacks', 'hits', 'wounds', 'failed', 'raw', 'applied', 'destroyed', 'hazard',
              't_hits', 't_wounds', 't_failed', 't_raw', 't_hazard'];
let lastRun = null;   // 말을 바꿔도 결과를 다시 굴리지 않는다

function verdict(exp, obs, se, sigma) {
  const t = T();
  if (se === 0) {
    return Math.abs(obs - exp) < 1e-9
      ? { cls: 'pass', text: t.vPassFixed, z: 0 }
      : { cls: 'fail', text: t.vFailFixed, z: Infinity };
  }
  const z = (obs - exp) / se;
  const az = Math.abs(z);
  if (az <= sigma) return { cls: 'pass', text: t.vPass(sigma), z: z };
  if (az <= sigma * 1.5) return { cls: 'warn', text: t.vWarn, z: z };
  return { cls: 'fail', text: t.vFail, z: z };
}

/** 굴린 결과를 화면에 편다. 말을 바꾸면 이것만 다시 부른다 */
function draw(run) {
  const t = T();
  const blocks = run.results.map((r) => {
    if (r.bad) {
      return '<div class="card"><header><span>' + esc(r.name) + '</span></header>' +
        '<div class="note err">' + esc(t.badExpr(r.attacks, r.damage)) + '</div></div>';
    }
    let worst = 'pass';
    const rows = stagesOf(r).map((k) => {
      const v = verdict(r.exp[k], r.mean[k], r.se[k], run.sigma);
      if (v.cls === 'fail' || (v.cls === 'warn' && worst === 'pass')) worst = v.cls;
      // 차이·표준오차·z 는 표에서 뺐다. 그래도 볼 수 있게 실측 칸에 달아 둔다
      const detail = esc(t.cols.diff) + ' ' + (r.mean[k] - r.exp[k] >= 0 ? '+' : '') + f3(r.mean[k] - r.exp[k]) +
        ' · ' + esc(t.cols.se) + ' ' + f3(r.se[k]) +
        ' · z ' + (Number.isFinite(v.z) ? (v.z >= 0 ? '+' : '') + f2(v.z) : '—') + ' · ' + esc(v.text);
      return '<tr>' +
        '<td class="stage"><span>' + esc(t.stage[k][0]) + ' <span class="hint">' + esc(t.stage[k][1]) + '</span></span>' +
          q('s_' + k) + '</td>' +
        '<td class="num">' + f3(r.exp[k]) + '</td>' +
        '<td class="num ' + v.cls + '" title="' + detail + '">' + f3(r.mean[k]) +
          // 공격 횟수에는 「시도」가 없다. 걸러 내는 단계가 아니라 만들어 내는 단계라
          // 합계가 시도보다 커진다 — 같은 이름을 쓰면 통과율처럼 읽힌다.
          // 대신 식이 주사위를 쓸 때만 굴린 주사위 수를 적는다
          (k === 'attacks'
            ? (r.atkDice > 0 ? '<span class="tot">' + esc(t.diceLabel(r.atkDice.toLocaleString())) + '</span>' : '')
            : '<span class="tot">' + esc(t.triedLabel(r.total['t_' + k].toLocaleString())) + '</span>') +
          '<span class="tot">' + esc(t.totalLabel(r.total[k].toLocaleString())) + '</span></td>' +
      '</tr>';
    }).join('');

    const head = worst === 'pass' ? '<span class="pass">' + esc(t.allPass) + '</span>'
      : worst === 'warn' ? '<span class="warn">' + esc(t.someWarn) + '</span>'
      : '<span class="fail">' + esc(t.someFail) + '</span>';

    const st = r.k.st > 6 ? t.noSave : r.k.st + '+';
    return '<div class="card">' +
      '<header><span>' + esc(r.name) + '</span><span class="sub">' +
        esc(t.runsLabel(run.runs.toLocaleString())) + ' · ' +
        t.wt(r.k.wt) + ' · ' + t.stv(st) + (r.usingInv ? ' ' + t.usingInv : '') + ' · ' + head + '</span></header>' +
      '<div class="scroll" style="border:0;border-radius:0"><table>' +
        '<thead><tr><th>' + esc(t.cols.stage) + '</th><th>' + esc(t.cols.exp) +
        '</th><th><span class="hd">' + esc(t.cols.obs) + q('verdict') + '</span></th></tr></thead>' +
        '<tbody>' + rows + '</tbody></table></div>' +
      histogram(r.applied, run.runs, r.mean.applied) +
      '<div class="statrow">' +
        '<span>' + esc(t.median) + ' <b class="num">' + r.stats.median + '</b></span>' +
        '<span>' + esc(t.p10) + ' <b class="num">' + r.stats.p10 + '</b></span>' +
        '<span>' + esc(t.p90) + ' <b class="num">' + r.stats.p90 + '</b></span>' +
        '<span>' + esc(t.min) + ' <b class="num">' + r.stats.min + '</b></span>' +
        '<span>' + esc(t.max) + ' <b class="num">' + r.stats.max + '</b></span>' +
        '<span>' + esc(t.stdev) + ' <b class="num">' + f2(r.stats.stdev) + '</b></span>' +
      '</div>' +
      '<div class="note">' + esc(t.refNote) + ' — ' +
        esc(t.applied) + ' <b class="num">' + f3(r.mean.applied) + '</b> · ' +
        esc(t.destroyed) + ' <b class="num">' + f3(r.mean.destroyed) + '</b> / ' + r.models + ' · ' +
        esc(t.wipe) + ' <b class="num">' + f2(r.wipeRate * 100) + '%</b> · ' +
        esc(t.lost) + ' <b class="num">' + f3(r.mean.raw - r.mean.applied) + '</b>' +
        '</div>' +
    '</div>';
  });

  document.getElementById('out').innerHTML = blocks.join('');
  document.getElementById('status').textContent =
    t.status(run.runs.toLocaleString(), run.results.length, run.ms, run.seed);
}

document.getElementById('run').onclick = () => {
  const runs = state.runs;
  const seed = state.seed === '' ? (Math.random() * 4294967296) >>> 0 : Number(state.seed) >>> 0;
  rand = mulberry32(seed);
  const t0 = performance.now();
  const results = [];

  for (const a of state.attackers) {
    const atkTerms = parseExpr(a.attacks);
    const dmgTerms = parseExpr(a.damage);
    if (!atkTerms || !dmgTerms) {
      results.push({ bad: true, name: a.name, attacks: a.attacks, damage: a.damage });
      continue;
    }
    const d = state.defender;
    const k = derive(a, d);
    const exp = expected(a, d, k, atkTerms, dmgTerms);

    // 단계마다 합과 제곱합만 든다. 적용 피해만 분포가 필요해 개수를 센다
    const sum = {}, sq = {};
    for (const key of KEYS) { sum[key] = 0; sq[key] = 0; }
    const applied = new Map();
    let wipes = 0;

    for (let i = 0; i < runs; i++) {
      const r = simulateOnce(a, d, k, atkTerms, dmgTerms);
      for (const key of KEYS) { sum[key] += r[key]; sq[key] += r[key] * r[key]; }
      applied.set(r.applied, (applied.get(r.applied) || 0) + 1);
      if (r.destroyed >= d.models) wipes++;
    }

    const mean = {}, se = {}, total = {};
    for (const key of KEYS) {
      mean[key] = sum[key] / runs;
      total[key] = Math.round(sum[key]);
      se[key] = Math.sqrt(Math.max(0, sq[key] / runs - mean[key] * mean[key]) / runs);
    }
    const keys = [...applied.keys()].sort((x, y) => x - y);
    results.push({
      name: a.name, k: k, exp: exp, mean: mean, se: se, total: total, applied: applied,
      models: d.models, wipeRate: wipes / runs, usingInv: d.inv > 0 && d.inv < k.armor,
      // 공격 식이 주사위를 쓸 때만 뜻이 있다 — 고정 숫자면 굴린 것이 없다
      atkDice: diceOf(atkTerms) * Math.max(1, a.weapons) * runs,
      hazardous: a.hazardous,
      stats: {
        median: quantile(applied, runs, 0.5), p10: quantile(applied, runs, 0.1),
        p90: quantile(applied, runs, 0.9), min: keys[0], max: keys[keys.length - 1],
        stdev: se.applied * Math.sqrt(runs),
      },
    });
  }

  lastRun = { results: results, runs: runs, seed: seed, sigma: SIGMA,
              ms: Math.round(performance.now() - t0) };
  draw(lastRun);
  // 어긋난 판을 다시 볼 수 있게 쓴 시드를 남긴다
  state.seed = String(seed);
  document.getElementById('seed').value = seed;
  save();
};

renderChrome();
renderAll();
</script>
