<!doctype html>
<html lang="ko">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>워해머 전투 계산 시뮬레이터</title>
  <style>
    :root {
      --ink: #fdfdfd;
      --ink2: #ffffff;
      --ink3: #f4f4f4;
      --line: #e8e8e8;
      --silver: #111111;
      --silver2: #828282;
      --silver3: #9b9b9b;
      --accent: #111111;
      --on-accent: #fdfdfd;
      --bar: #444444;
      --dim: #9b9b9b;
      --mid: #555555;
      --loud: #111111;
    }

    * {
      box-sizing: border-box
    }

    body {
      margin: 0;
      background: var(--ink);
      color: var(--silver);
      padding: 20px;
      font: 400 15px/1.55 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial,
        sans-serif, "Apple Color Emoji", "Segoe UI Emoji";
      -webkit-text-size-adjust: 100%
    }

    h1 {
      font-size: 22px;
      font-weight: 400;
      margin: 0 0 4px;
      color: var(--loud);
      letter-spacing: -.01em
    }

    h2 {
      font-size: 12px;
      margin: 22px 0 8px;
      color: var(--silver2);
      text-transform: uppercase;
      letter-spacing: .08em
    }

    p.lead {
      margin: 0;
      color: var(--silver2);
      font-size: 12.5px
    }

    .wrap {
      max-width: 760px;
      margin: 0 auto
    }

    .lead,
    .note {
      max-width: 74ch
    }

    .top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 16px;
      margin-bottom: 18px
    }

    .langsw {
      display: flex;
      border: 1px solid var(--line);
      border-radius: 6px;
      overflow: hidden;
      flex: 0 0 auto
    }

    .langsw button {
      border: 0;
      border-radius: 0;
      background: var(--ink2);
      padding: 6px 12px;
      font-size: 12.5px
    }

    .langsw button[aria-pressed="true"] {
      background: var(--accent);
      color: var(--on-accent);
      font-weight: 700
    }

    .scroll {
      overflow-x: auto;
      border: 1px solid var(--line);
      border-radius: 6px
    }

    table {
      border-collapse: collapse;
      width: 100%;
      font-size: 12.5px
    }

    th,
    td {
      border-bottom: 1px solid var(--line);
      padding: 4px 6px;
      text-align: right;
      white-space: nowrap
    }

    th {
      background: var(--ink3);
      color: var(--silver2);
      font-weight: 600;
      font-size: 11px
    }

    td {
      background: var(--ink2)
    }

    th:first-child,
    td:first-child {
      text-align: left
    }

    th .hd {
      display: inline-flex;
      align-items: center;
      gap: 2px 4px;
      justify-content: flex-end;
      flex-wrap: wrap
    }

    th .hd em {
      font-style: normal;
      color: var(--silver3);
      font-size: 10px;
      flex-basis: 100%;
      text-align: right
    }

    th:first-child .hd {
      justify-content: flex-start
    }

    th:first-child .hd em {
      text-align: left
    }

    tbody tr:hover {
      background: var(--ink3)
    }

    input,
    select {
      background: var(--ink2);
      color: var(--silver);
      border: 1px solid var(--line);
      border-radius: 4px;
      padding: 3px 5px;
      font: inherit;
      font-size: 12.5px;
      text-align: right
    }

    input[type=text].name {
      text-align: left;
      width: 120px
    }

    input[type=number] {
      width: 58px
    }

    input.expr {
      width: 70px;
      text-align: center
    }

    select {
      width: 96px;
      text-align: left
    }

    input:focus,
    select:focus {
      outline: 1px solid var(--accent);
      border-color: var(--accent)
    }

    button {
      background: var(--ink3);
      color: var(--silver);
      border: 1px solid var(--line);
      border-radius: 4px;
      padding: 5px 11px;
      font: inherit;
      cursor: pointer
    }

    button:hover {
      border-color: var(--accent);
      color: var(--loud)
    }

    button.run {
      background: var(--accent);
      border-color: var(--accent);
      color: var(--on-accent);
      font-weight: 700;
      padding: 7px 18px
    }

    button.x {
      padding: 2px 8px;
      color: var(--silver2)
    }

    button.pill {
      border-radius: 999px;
      padding: 3px 11px;
      font-size: 12px;
      color: var(--silver3)
    }

    button.pill[aria-pressed="true"] {
      background: var(--accent);
      border-color: var(--accent);
      color: var(--on-accent);
      font-weight: 700
    }

    button.q {
      width: 18px;
      height: 18px;
      padding: 0;
      border-radius: 50%;
      font-size: 11px;
      font-weight: 700;
      line-height: 1;
      color: var(--silver2);
      border-color: var(--line);
      flex: 0 0 auto
    }

    button.q:hover {
      border-color: var(--accent);
      color: var(--loud)
    }

    .bar {
      display: flex;
      gap: 10px;
      align-items: center;
      flex-wrap: wrap;
      margin: 10px 0 4px
    }

    .bar label {
      color: var(--silver2);
      font-size: 12px;
      display: inline-flex;
      align-items: center;
      gap: 6px
    }

    .card {
      border: 1px solid var(--line);
      border-radius: 6px;
      margin-top: 14px;
      overflow: hidden
    }

    .card>header {
      background: var(--ink3);
      padding: 6px 10px;
      font-size: 13px;
      color: var(--loud);
      display: flex;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap
    }

    .card>header .sub {
      color: var(--silver2);
      font-size: 12px;
      font-weight: 400
    }

    .pass {
      color: var(--dim)
    }

    .warn {
      color: var(--mid)
    }

    .fail {
      color: var(--loud);
      font-weight: 700
    }

    .num {
      font-variant-numeric: tabular-nums
    }

    .note {
      color: var(--silver2);
      font-size: 11.5px;
      padding: 7px 10px;
      border-top: 1px solid var(--line)
    }

    .err {
      color: var(--loud)
    }

    .stage {
      color: var(--silver);
      text-align: left
    }

    td.stage em {
      font-style: normal;
      color: var(--silver3);
      font-size: 11px;
      margin-left: 4px
    }

    .tot {
      display: block;
      font-size: 10.5px;
      font-weight: 400;
      color: var(--silver3);
      white-space: nowrap
    }

    .tot.chain {
      white-space: normal;
      line-height: 1.55;
      margin-top: 3px
    }

    .tot.chain .led {
      display: flex;
      justify-content: flex-end;
      align-items: baseline;
      gap: 6px
    }

    .tot.chain .led i {
      font-style: normal;
      color: var(--silver3);
      width: 11px;
      text-align: center;
      flex: 0 0 auto
    }

    .tot.chain .led b {
      font-weight: 600;
      color: var(--mid);
      min-width: 58px;
      text-align: right;
      flex: 0 0 auto
    }

    .tot.chain .led:last-child {
      border-top: 1px solid var(--line);
      margin-top: 2px;
      padding-top: 2px
    }

    .tot.chain .led:last-child b {
      color: inherit;
      font-size: 12.5px
    }

    .appliedsum .tot.chain {
      max-width: 300px;
      margin-top: 4px
    }

    .tot.chain.note {
      color: var(--dim);
      margin-top: 0;
      display: flex;
      justify-content: flex-end;
      flex-wrap: wrap;
      align-items: baseline;
      gap: 0 6px
    }

    .tot.chain.note em {
      font-style: normal
    }

    .tot.chain.note .led {
      flex: 0 0 auto
    }

    .tot.chain.note .led b {
      color: var(--silver3);
      font-weight: 400;
      font-size: 10.5px
    }

    .tot.chain.note .led:last-child {
      border-top: 0;
      margin-top: 0;
      padding-top: 0
    }

    .hint {
      color: var(--silver3);
      font-size: 11px
    }

    b {
      color: var(--silver)
    }

    .pcard {
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--ink2);
      padding: 10px 12px;
      margin-bottom: 10px
    }

    .pcard .r1 {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px
    }

    .pcard .pname {
      font-size: 15px;
      color: var(--silver);
      font-weight: 600;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      min-width: 0
    }

    .pcard .sum {
      margin-top: 6px;
      font-size: 13px;
      color: var(--silver);
      font-variant-numeric: tabular-nums
    }

    .pcard .sum span {
      display: block
    }

    .pcard .sum .alt {
      color: var(--silver2);
      font-size: 12px;
      margin-top: 2px
    }

    .pcard .tags {
      margin-top: 7px;
      display: flex;
      flex-wrap: wrap;
      gap: 5px
    }

    .tag {
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: 2px 9px;
      font-size: 11.5px;
      color: var(--mid)
    }

    .tag.off {
      opacity: .5;
      text-decoration: line-through
    }

    .seg {
      display: inline-flex;
      border: 1px solid var(--line);
      border-radius: 6px;
      overflow: hidden
    }

    .seg button {
      border: 0;
      border-radius: 0;
      background: var(--ink2);
      padding: 7px 14px;
      font-size: 13.5px
    }

    .seg button[aria-pressed="true"] {
      background: var(--accent);
      color: var(--on-accent);
      font-weight: 700
    }

    details.fsec>summary {
      cursor: pointer;
      list-style: none;
      margin: 0 0 7px;
      padding-bottom: 5px;
      border-bottom: 1px solid var(--line);
      font-size: 11px;
      letter-spacing: .08em;
      text-transform: uppercase;
      color: var(--silver3)
    }

    details.fsec>summary::-webkit-details-marker {
      display: none
    }

    details.fsec>summary::before {
      content: '▶';
      margin-right: 6px
    }

    details.fsec[open]>summary::before {
      content: '▼'
    }

    #pre {
      padding: 0 13px 12px
    }

    .prehint {
      color: var(--silver3);
      font-size: 11.5px;
      margin: 8px 0 0
    }

    .chks {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(255px, 1fr));
      gap: 7px
    }

    .chk {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 9px;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: var(--ink);
      padding: 8px 10px
    }

    .chk .k {
      display: flex;
      align-items: center;
      gap: 6px;
      min-width: 0;
      font-size: 13px;
      color: var(--silver3);
      word-break: keep-all
    }

    .chk[data-on="true"] .k {
      color: var(--silver)
    }

    .chk .v {
      flex: 0 0 auto
    }

    details.seq {
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--ink2);
      margin-bottom: 18px
    }

    details.seq>summary {
      padding: 11px 13px;
      cursor: pointer;
      font-size: 13px;
      color: var(--silver);
      display: flex;
      justify-content: space-between;
      gap: 10px;
      align-items: center;
      list-style: none
    }

    details.seq>summary::-webkit-details-marker {
      display: none
    }

    details.seq>summary>span:first-child::before {
      content: '▶';
      color: var(--silver2);
      font-size: 11px;
      margin-right: 7px
    }

    details.seq[open]>summary>span:first-child::before {
      content: '▼'
    }

    .seqbody {
      padding: 0 13px 12px
    }

    .fold {
      font-size: 11.5px;
      color: var(--silver3);
      white-space: nowrap
    }

    details.seq[open] .fold .off {
      display: none
    }

    details.seq:not([open]) .fold .on {
      display: none
    }

    .fold em {
      font-style: normal
    }

    .step {
      display: flex;
      gap: 10px;
      padding: 10px 0;
      border-top: 1px solid var(--line)
    }

    .step .no {
      width: 22px;
      height: 22px;
      border: 1px solid var(--line);
      border-radius: 50%;
      display: grid;
      place-items: center;
      font-size: 11px;
      color: var(--silver2);
      flex: 0 0 auto
    }

    .step .sname {
      font-size: 13.5px;
      color: var(--silver);
      font-weight: 600
    }

    .step .sname em {
      font-style: normal;
      font-weight: 400;
      color: var(--silver2);
      font-size: 12px;
      margin-left: 4px
    }

    .step .sref {
      font-size: 11px;
      color: var(--silver3);
      margin-left: 6px
    }

    .chips {
      display: flex;
      flex-wrap: wrap;
      gap: 5px;
      margin-top: 6px
    }

    .chip {
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: 4px 10px;
      font-size: 12px;
      color: var(--silver2);
      background: transparent
    }

    .chip em {
      font-style: normal;
      color: var(--silver3);
      font-size: 10.5px;
      margin-left: 3px
    }

    .skip {
      margin: 0 0 0 32px;
      padding: 7px 11px;
      border-left: 2px solid var(--accent);
      background: #0000000a;
      font-size: 12.5px;
      color: var(--mid);
      border-radius: 0 6px 6px 0
    }

    .skip b {
      color: var(--loud)
    }

    .fsec {
      margin-bottom: 14px
    }

    .fsec:last-child {
      margin-bottom: 0
    }

    .fsec>h4 {
      margin: 0 0 7px;
      font-size: 11px;
      letter-spacing: .08em;
      text-transform: uppercase;
      color: var(--silver3);
      border-bottom: 1px solid var(--line);
      padding-bottom: 5px
    }

    .form {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(215px, 1fr));
      gap: 8px
    }

    .fld {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: var(--ink);
      padding: 8px 10px
    }

    .form>* {
      min-width: 0
    }

    .fld .k {
      display: flex;
      align-items: baseline;
      flex-wrap: wrap;
      gap: 2px 5px;
      flex: 1 1 auto;
      min-width: 0;
      font-size: 13.5px;
      color: var(--silver2);
      word-break: keep-all
    }

    .fld .k em {
      font-style: normal;
      font-size: 11px;
      color: var(--silver3)
    }

    .fld .v {
      display: flex;
      align-items: center;
      gap: 5px;
      flex: 0 0 auto
    }

    .fld.wide {
      grid-column: 1/-1
    }

    .fld.wide input[type=text] {
      width: 100%
    }

    .fld.wide .v {
      flex: 1 1 auto
    }

    .chart {
      padding: 12px 10px;
      border-top: 1px solid var(--line)
    }

    .chart .ttl {
      font-size: 11.5px;
      color: var(--silver2);
      margin-bottom: 9px
    }

    .plot {
      position: relative
    }

    .bars {
      display: flex;
      align-items: flex-end;
      gap: 3px;
      height: 150px;
      padding-top: 18px;
      border-bottom: 1px solid var(--line)
    }

    .bcol {
      flex: 1 1 0;
      min-width: 0;
      height: 100%;
      display: flex;
      align-items: flex-end
    }

    .bbar {
      width: 100%;
      background: var(--bar);
      position: relative
    }

    .bpct {
      position: absolute;
      bottom: 100%;
      left: 50%;
      transform: translateX(-50%);
      margin-bottom: 3px;
      font-size: 10px;
      color: var(--silver2);
      white-space: nowrap
    }

    .bxs {
      display: flex;
      gap: 3px;
      margin-top: 5px
    }

    .bxs span {
      flex: 1 1 0;
      min-width: 0;
      text-align: center;
      font-size: 10px;
      color: var(--silver3);
      white-space: nowrap;
      overflow: hidden
    }

    .mline {
      position: absolute;
      top: 18px;
      bottom: 0;
      border-left: 2px dashed var(--loud)
    }

    .mlbl {
      position: absolute;
      top: 0;
      font-size: 10px;
      color: var(--loud);
      white-space: nowrap;
      transform: translateX(-50%)
    }

    .statrow {
      display: flex;
      flex-wrap: wrap;
      gap: 4px 16px;
      padding: 0 10px 9px;
      font-size: 11.5px;
      color: var(--silver2)
    }

    details.trace {
      border-top: 1px solid var(--line);
      background: var(--ink)
    }

    details.trace>summary {
      padding: 11px 12px;
      cursor: pointer;
      font-size: 12.5px;
      color: var(--silver2);
      list-style: none
    }

    details.trace>summary::-webkit-details-marker {
      display: none
    }

    details.trace>summary::before {
      content: '▶';
      margin-right: 7px;
      color: var(--silver3);
      font-size: 11px
    }

    details.trace[open]>summary::before {
      content: '▼'
    }

    .tracebody {
      padding: 0 12px 14px;
      font-size: 12.5px;
      color: var(--mid)
    }

    .tracebody h5 {
      margin: 14px 0 6px;
      font-size: 11px;
      letter-spacing: .06em;
      text-transform: uppercase;
      color: var(--silver3);
      font-weight: 600
    }

    .tracebody ul {
      margin: 0;
      padding-left: 18px
    }

    .tracebody li {
      margin: 3px 0
    }

    .tracebody p {
      margin: 6px 0
    }

    .dice {
      display: flex;
      flex-wrap: wrap;
      gap: 4px;
      margin: 6px 0
    }

    .die {
      min-width: 26px;
      height: 26px;
      padding: 0 5px;
      border: 1px solid var(--line);
      border-radius: 5px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 2px;
      font-size: 12.5px;
      font-variant-numeric: tabular-nums;
      background: var(--ink);
      color: var(--silver3)
    }

    .die.hit {
      background: var(--accent);
      border-color: var(--accent);
      color: var(--on-accent);
      font-weight: 700
    }

    .die em {
      font-style: normal;
      font-size: 9.5px;
      opacity: .65
    }

    .alloc {
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 9px 11px;
      margin: 9px 0;
      background: var(--ink2)
    }

    .alloc>.h {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      gap: 8px;
      flex-wrap: wrap
    }

    .alloc>.h b {
      font-size: 13px;
      color: var(--silver)
    }

    .alloc>.h span {
      font-size: 12px;
      color: var(--silver2)
    }

    .alloc .sum {
      font-size: 12px;
      color: var(--mid);
      margin-top: 5px
    }

    .men {
      margin-top: 6px;
      font-size: 13px;
      color: var(--silver);
      letter-spacing: 2px
    }

    .men .gone {
      color: var(--line)
    }

    .men .arrow {
      letter-spacing: normal;
      color: var(--silver3);
      font-size: 12px;
      margin: 0 6px
    }

    .aside {
      border-top: 2px solid var(--silver3);
      margin-top: 4px
    }

    .aside>h4 {
      margin: 0;
      padding: 9px 10px 7px;
      font-size: 11px;
      letter-spacing: .08em;
      text-transform: uppercase;
      color: var(--silver2)
    }

    dialog {
      background: var(--ink2);
      color: var(--silver);
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 0;
      max-width: 660px;
      width: calc(100% - 20px);
      box-shadow: 0 12px 44px #00000026
    }

    dialog::backdrop {
      background: #00000059
    }

    dialog header {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      gap: 12px;
      padding: 12px 14px;
      border-bottom: 1px solid var(--line);
      background: var(--ink3)
    }

    dialog h3 {
      margin: 0;
      font-size: 15px;
      color: var(--loud)
    }

    dialog .ref {
      font-size: 11.5px;
      color: var(--silver3);
      white-space: nowrap
    }

    dialog .body {
      padding: 13px 14px;
      font-size: 13px;
      line-height: 1.65;
      max-height: min(72vh, 620px);
      overflow: auto
    }

    dialog .body p {
      margin: 0 0 9px
    }

    dialog .body .how {
      color: var(--mid)
    }

    dialog .body ul {
      margin: 6px 0 10px;
      padding-left: 18px;
      color: var(--silver2)
    }

    dialog .body li {
      margin: 3px 0
    }

    dialog .body table {
      font-size: 12px;
      margin: 4px 0 10px
    }

    dialog .body td {
      white-space: normal;
      text-align: left;
      vertical-align: top;
      padding: 3px 8px 3px 0

    }

  </style>

<body>
  <div class="wrap">

    <div class="top">
      <div>
        <h1 id="t-title"></h1>
        <p class="lead" id="t-lead"></p>
      </div>
      <div class="langsw" id="langsw">
        <button data-lang="ko">한국어</button><button data-lang="en">English</button>
      </div>
    </div>

    <div class="bar" style="margin:0 0 10px"><button id="basics"></button></div>
    <details class="seq" id="seq" open></details>

    <details class="seq" id="prewrap" open>
      <summary><span id="t-pre"></span><span class="fold"><em class="on"></em><em class="off"></em></span></summary>
      <div id="pre"></div>
    </details>

    <h2 id="t-atk"></h2>
    <div id="atklist"></div>
    <div class="bar">
      <button id="add"></button>
      <span class="hint" id="t-exprhint"></span>
    </div>

    <h2 id="t-def"></h2>
    <div id="deflist"></div>
    <div class="bar"><button id="addgrp"></button></div>

    <h2 id="t-mortal"></h2>
    <p class="prehint" id="t-mortallead" style="margin:0 0 8px"></p>
    <div id="mortallist"></div>
    <div class="bar"><button id="addmortal"></button></div>

    <h2 id="t-cfg"></h2>
    <div class="bar">
      <label><span id="t-runs"></span><input type="number" id="runs" min="1" max="1000000" step="1000"
          style="width:84px"></label>
      <label><span id="t-seed"></span><input type="number" id="seed" style="width:130px;text-align:left"></label>
      <button class="run" id="run"></button>
      <span id="status" class="hint"></span>
    </div>

    <div id="out"></div>

    <p class="note" id="t-footnote" style="border:1px solid var(--line);border-radius:6px;margin-top:22px"></p>

    <h2 id="t-share"></h2>
    <p class="prehint" id="t-sharelead" style="margin:0 0 8px"></p>
    <div class="bar"><button id="share"></button></div>
  </div>

  <script>
    "use strict";

    const mulberry32 = (seed) => {
      let a = seed >>> 0; return () => {
        a = (a + 0x6D2B79F5) | 0;
        let t = Math.imul(a ^ (a >>> 15), 1 | a);
        t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
        return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
      };
    };
    let rand = Math.random;
    const dN = (faces) => 1 + Math.floor(rand() * faces);
    const d6 = () => dN(6);

    function parseExpr(str) {
      const s = String(str == null ? '' : str).toUpperCase().replace(/\s+/g, '');
      if (s === '') return null;
      const chunks = s.match(/[+-]?[^+-]+/g);
      if (!chunks) return null;
      const terms = [];
      for (const c of chunks) {
        const sign = c.startsWith('-') ? -1 : 1;
        const body = c.replace(/^[+-]/, '');
        if (/^\d+$/.test(body)) { terms.push({ sign: sign, konst: parseInt(body, 10) }); continue; }
        const m = body.match(/^(\d*)D(\d+)$/);
        if (!m) return null;
        const count = m[1] ? parseInt(m[1], 10) : 1;
        const faces = parseInt(m[2], 10);
        if (faces <= 0 || count <= 0 || count > 100) return null;
        terms.push({ sign: sign, count: count, faces: faces });
      }
      return terms;
    }

    const diceOf = (terms) => terms.reduce((n, t) => n + (t.konst != null ? 0 : t.count), 0);

    const rollExpr = (terms) => {
      let sum = 0;
      for (const t of terms) {
        if (t.konst != null) { sum += t.sign * t.konst; continue; }
        for (let i = 0; i < t.count; i++) sum += t.sign * dN(t.faces);
      }
      return Math.max(0, sum);
    };

    function pmfExpr(terms) {
      let pmf = new Map([[0, 1]]);
      for (const t of terms) {
        if (t.konst != null) {
          const shifted = new Map();
          for (const entry of pmf) shifted.set(entry[0] + t.sign * t.konst, entry[1]);
          pmf = shifted;
          continue;
        }
        for (let i = 0; i < t.count; i++) {
          const n = new Map();
          for (const entry of pmf) for (let f = 1; f <= t.faces; f++) {
            const k = entry[0] + t.sign * f;
            n.set(k, (n.get(k) || 0) + entry[1] / t.faces);
          }
          pmf = n;
        }
      }
      return pmf;
    }

    const meanPmf = (pmf, f) => { let e = 0; for (const entry of pmf) e += f(entry[0]) * entry[1]; return e; };

    const meanExpr = (terms) => meanPmf(pmfExpr(terms), (v) => Math.max(0, v));

    const woundTarget = (s, t) => (s >= t * 2 ? 2 : s > t ? 3 : s === t ? 4 : s <= t / 2 ? 6 : 5);

    const adjustDmg = (v, k, gk) => (v <= 0 ? 0 : Math.max(0, v + k.dmgBonus - (gk ? gk.dmgCut : 0)));

    function groupKernel(g, a) {
      const armor = g.save - a.ap;
      const usingInv = g.inv > 0 && g.inv < armor;
      const st = usingInv ? g.inv : armor;
      return {
        armor: armor, st: st, usingInv: usingInv, fnp: g.fnp, reroll: g.saveReroll,
        saveOk: (f) => f !== 1 && f >= st,
        saveFail: (f) => f === 1 || f < st,
        fnpKeep: g.fnp > 0 ? (g.fnp - 1) / 6 : 1,
        dmgCut: g.dmgReduce > 0 ? g.dmgReduce : 0,
      };
    }

    function unitToughness(gs) {
      const body = gs.filter((g) => !g.character && g.models > 0);
      const from = body.length ? body : gs;
      return from.reduce((t, g) => Math.max(t, g.toughness), 0) || 1;
    }
    const totalModels = (gs) => gs.reduce((n, g) => n + g.models, 0);

    const applyReroll = (rolls, type, isFail) => {
      if (type === 'none') return rolls;
      return rolls.map((die) => {
        const re = type === 'all' ? true : type === '1s' ? die === 1 : isFail(die);
        return re ? d6() : die;
      });
    };

    function facePmf(type, isFail) {
      const re = type === 'none' ? function () { return false; }
        : type === 'all' ? function () { return true; }
          : type === '1s' ? function (f) { return f === 1; }
            : isFail;
      let pRe = 0;
      for (let f = 1; f <= 6; f++) if (re(f)) pRe += 1 / 6;
      const p = new Array(7).fill(0);
      for (let f = 1; f <= 6; f++) p[f] = (re(f) ? 0 : 1 / 6) + pRe / 6;
      return p;
    }
    const pOf = (p, pred) => { let s = 0; for (let f = 1; f <= 6; f++) if (pred(f)) s += p[f]; return s; };

    function derive(a, gs, p) {
      const pre = p || { mode: 'ranged' };
      const melee = pre.mode === 'melee';
      const models = totalModels(gs);
      const wt = woundTarget(a.strength, unitToughness(gs));
      const anti = a.anti > 0 ? a.anti : 0;

      const wMod = melee && pre.charged && a.lance ? 1 : 0;

      const hMod = a.ignoreHitMod ? 0 : a.hitMod;

      const critHit = a.critHit >= 2 && a.critHit <= 6 ? a.critHit : 6;

      const torrent = !melee && !!a.torrent;

      const atkParts = melee
        ? { cleave: a.cleave > 0 ? a.cleave * Math.floor(models / 5) : 0 }
        : {
          blast: a.blast > 0 ? a.blast * Math.floor(models / 5) : 0,
          rapidFire: a.rapidFire > 0 && a.halfRange ? a.rapidFire : 0
        };

      const mkHitOk = (m, cr) => (f) => f >= cr || (f !== 1 && f + m >= a.hitTarget);
      const mkWOk = (m, an) => (f) => f === 6 || (an > 0 && f >= an) || (f !== 1 && f + m >= wt);

      return {
        wt: wt, anti: anti, melee: melee, wMod: wMod, models: models,
        hMod: hMod, critHit: critHit, torrent: torrent,
        gk: gs.map((g) => groupKernel(g, a)),

        single: gs.length === 1,

        precision: !!a.precision,

        charged: melee && !!pre.charged,

        atkParts: atkParts,
        atkBonus: Object.keys(atkParts).reduce((s, key) => s + atkParts[key], 0),

        dmgBonus: !melee && a.melta > 0 && a.halfRange ? a.melta : 0,
        hitCrit: (f) => f >= critHit,

        hitOk: mkHitOk(hMod, critHit),

        hitOkPlain: mkHitOk(a.hitMod, 6),
        hitOkCrit: mkHitOk(a.hitMod, critHit),
        hitFail: (f) => f < critHit && (f === 1 || f + hMod < a.hitTarget),
        wCrit: (f) => f === 6 || (anti > 0 && f >= anti),

        wOk: mkWOk(wMod, anti),

        wOkPlain: mkWOk(0, 0),
        wOkAnti: mkWOk(0, anti),
        wFail: (f) => !(f === 6 || (anti > 0 && f >= anti)) && (f === 1 || f + wMod < wt),
      };
    }

    const CONTRIB = [
      { key: 'by_blast', tag: 'blast' },
      { key: 'by_rapidFire', tag: 'rapidFire' },
      { key: 'by_cleave', tag: 'cleave' },
      { key: 'by_torrent', tag: 'torrent' },
      { key: 'by_critHit', tag: 'critHit' },
      { key: 'by_hitReroll', tag: 'hitReroll' },
      { key: 'by_ignoreHitMod', tag: 'ignoreHitMod' },
      { key: 'sust', tag: 'sustained' },
      { key: 'leth', tag: 'lethal' },
      { key: 'by_anti', tag: 'anti' },
      { key: 'by_woundReroll', tag: 'woundReroll' },
      { key: 'by_lance', tag: 'lance' },
      { key: 'by_saveReroll', tag: 'saveReroll' },
      { key: 'by_melta', tag: 'melta' },
      { key: 'by_dmgReduce', tag: 'dmgReduce' },
      { key: 'by_meltaDev', tag: 'melta' },
      { key: 'by_dmgReduceDev', tag: 'dmgReduce' },
      { key: 'by_hazardBig', tag: 'hazardBig' },
      { key: 'hazard', tag: 'hazardous' },
    ];

    const CKEYS = CONTRIB.map((x) => x.key).filter((key) => key.indexOf('by_') === 0);

    const CONTRIB_TAG = {};
    CONTRIB.forEach((x) => { CONTRIB_TAG[x.key] = x.tag; });

    const LEDGER = {
      attacks: ['ld_atkBase', '+by_blast', '+by_rapidFire', '+by_cleave', '=attacks'],
      hits: ['ld_hitBase', '+by_critHit', '+by_ignoreHitMod', '+by_hitReroll',
        '+by_torrent', '+sust', '=hits'],
      wounds: ['ld_wndBase', '+by_anti', '+by_lance', '+by_woundReroll', '+leth', '=wounds'],
      failed: ['ld_failBase', '-by_saveReroll', '=failed'],

      dmg: ['ld_dmgBase', '+by_melta', '-by_dmgReduce', '-ld_fnpRaw',
        '+ld_dmgBaseDev', '+by_meltaDev', '-by_dmgReduceDev', '-ld_fnpDev', '=dmg'],
      hazard: ['ld_hazFail', '+by_hazardBig', '=hazard'],

      applied: ['dmg', '+mortal', '-ld_lost', '=applied'],
    };

    const LEDGER_NOTE = {
      hits: ['crit'],
      wounds: ['ld_wCrit'],
    };

    const NOTE_FROM = {
      crit: ['lethal', 'sustained'],
      ld_wCrit: ['devastating'],
    };

    const ledKey = (s) => ('+-=>'.indexOf(s[0]) >= 0 ? s.slice(1) : s);

    const LKEYS = [...new Set([].concat(
      ...Object.keys(LEDGER).map((k) => LEDGER[k].map(ledKey)),
      ...Object.keys(LEDGER_NOTE).map((k) => LEDGER_NOTE[k])))]
      .filter((key) => key.indexOf('ld_') === 0);

    const NO_BONUS = { dmgBonus: 0 };

    function simulateOnce(a, gs, k, atkTerms, dmgTerms, srcs, trace) {
      srcs = srcs || [];

      const n = Math.max(1, a.weapons);
      const hazardEach = a.hazardBig ? 3 : 1;
      let hazard = 0, hazardFail = 0;
      if (a.hazardous) for (let i = 0; i < n; i++) if (d6() <= 2) { hazardFail++; hazard += hazardEach; }

      const t = { t_hits: 0, t_wounds: 0, t_failed: 0, t_raw: 0, t_hazard: a.hazardous ? n : 0 };

      const c = {};
      for (const key of CKEYS) c[key] = 0;
      for (const key of LKEYS) c[key] = 0;
      const by = (key, v) => { c['by_' + key] += v; };

      c.ld_hazFail = hazardFail;
      by('hazardBig', hazard - hazardFail);

      const live = gs.map((g) => ({ left: g.models, hp: g.wounds, killed: 0 }));
      const aliveAt = (i) => live[i].left > 0;

      const current = () => {
        if (k.precision) {
          const c = gs.findIndex((g, i) => g.character && aliveAt(i));
          if (c >= 0) return c;
        }
        return live.findIndex((x) => x.left > 0);
      };

      const mortalPick = () => {
        const find = (test) => gs.findIndex((g, i) => aliveAt(i) && test(g, live[i]));
        let i = find((g, s0) => !g.character && s0.hp < g.wounds);
        if (i < 0) i = find((g) => !g.character);
        if (i < 0) i = find((g, s0) => g.character && s0.hp < g.wounds);
        if (i < 0) i = find((g) => g.character);
        return i;
      };

      const hurt = (i, dmg) => {
        if (i < 0 || dmg <= 0) return 0;
        const s0 = live[i], got = Math.min(dmg, s0.hp);
        if (dmg >= s0.hp) { s0.killed++; s0.left--; s0.hp = gs[i].wounds; } else { s0.hp -= dmg; }
        return got;
      };

      let applied = 0, raw = 0, rawPre = 0;

      const mortal = { total: 0, per: srcs.map(() => 0), rawPer: srcs.map(() => 0) };
      const runSource = (src, si) => {
        if (src.needCharge && !k.charged) return;
        let pts = 0;
        for (let i = 0; i < src.count; i++) {
          if (src.gate > 0 && d6() < src.gate) continue;
          pts += rollExpr(src.terms);
        }
        mortal.rawPer[si] += pts;
        for (let i = 0; i < pts; i++) {
          const gi = mortalPick();

          const fnp = (gi >= 0 ? gs[gi] : gs[0]).fnp;
          if (fnp > 0 && d6() >= fnp) continue;
          mortal.total++;
          mortal.per[si]++;
          applied += hurt(gi, 1);
          if (trace) trace.mortalRows.push({ si: si, gi: gi, left: live.map((x) => x.left) });
        }
      };

      srcs.forEach((src, si) => { if (src.when !== 'after') runSource(src, si); });

      if (trace) trace.startLeft = live.map((x) => x.left);

      let attacks = 0;
      for (let i = 0; i < n; i++) attacks += rollExpr(atkTerms) + k.atkBonus;

      for (const key in k.atkParts) by(key, n * k.atkParts[key]);
      c.ld_atkBase = attacks - n * k.atkBonus;
      const killedOf = () => live.reduce((m, x) => m + x.killed, 0);

      const spread = () => {
        const o = {};
        mortal.per.forEach((v, i) => { o['m' + i] = v; });
        mortal.rawPer.forEach((v, i) => { o['mr' + i] = v; });

        mortal.rawPer.forEach((v, i) => { o['mf' + i] = v - mortal.per[i]; });
        return o;
      };
      if (attacks <= 0) {
        srcs.forEach((src, si) => { if (src.when === 'after') runSource(src, si); });
        c.ld_lost = mortal.total - applied;
        return {
          attacks: 0, hits: 0, wounds: 0, failed: 0, raw: 0, rawPre: 0,
          crit: 0, sust: 0, leth: 0,
          applied: applied, destroyed: killedOf(),
          gkilled: live.map((x) => x.killed),
          mortal: mortal.total, devastM: 0, devastRaw: 0, dmg: 0, hazard: hazard,
          ...spread(), ...t, ...c
        };
      }

      let successes = 0, crits = 0;
      t.t_hits = k.torrent ? 0 : attacks;
      if (k.torrent) {
        successes = attacks;
        by('torrent', attacks);
      } else {
        const hr0 = Array.from({ length: attacks }, d6);
        const hr = applyReroll(hr0, a.hitReroll, k.hitFail);
        for (const die of hr) { if (!k.hitOk(die)) continue; successes++; if (k.hitCrit(die)) crits++; }

        const okPlain = hr0.filter(k.hitOkPlain).length;
        const okCrit = hr0.filter(k.hitOkCrit).length;
        const okMod = hr0.filter(k.hitOk).length;
        c.ld_hitBase = okPlain;
        by('critHit', okCrit - okPlain);
        by('ignoreHitMod', okMod - okCrit);

        by('hitReroll', successes - okMod);
      }
      const sustained = a.sustained > 0 ? crits * a.sustained : 0;
      const lethal = a.lethal ? crits : 0;
      const hits = successes + sustained;

      t.t_wounds = Math.max(0, hits - lethal);
      const wr0 = Array.from({ length: t.t_wounds }, d6);
      const wr = applyReroll(wr0, a.woundReroll, k.wFail);
      let wSucc = 0, wCritN = 0;
      for (const die of wr) { if (!k.wOk(die)) continue; wSucc++; if (k.wCrit(die)) wCritN++; }

      const wPlain = wr0.filter(k.wOkPlain).length;
      const wAnti = wr0.filter(k.wOkAnti).length;
      const wLance = wr0.filter(k.wOk).length;
      c.ld_wCrit = wCritN;
      c.ld_wndBase = wPlain;
      by('anti', wAnti - wPlain);
      by('lance', wLance - wAnti);
      by('woundReroll', wSucc - wLance);
      const devast = a.devastating ? wCritN : 0;
      const wounds = wSucc + lethal;

      let lastGk = k.gk[0];

      const damageOf = (base, gk, dev) => {

        const plain = adjustDmg(base, NO_BONUS, null);
        const withBonus = adjustDmg(base, k, null);
        const dmg = adjustDmg(base, k, gk);

        const sfx = dev ? 'Dev' : '';
        c['ld_dmgBase' + sfx] += plain;
        by('melta' + sfx, withBonus - plain);
        by('dmgReduce' + sfx, withBonus - dmg);
        return dmg;
      };
      const inflict = (gi) => {
        const gk = gi >= 0 ? k.gk[gi] : lastGk;
        if (gi >= 0) lastGk = gk;
        t.t_raw++;
        let dmg = damageOf(rollExpr(dmgTerms), gk);
        rawPre += dmg;
        if (gk.fnp > 0 && dmg > 0) {
          let ignored = 0;
          for (let x = 0; x < dmg; x++) if (d6() >= gk.fnp) ignored++;
          dmg = Math.max(0, dmg - ignored);
        }
        if (dmg <= 0) return;
        raw += dmg;
        applied += hurt(gi, dmg);
      };

      const attempts = Math.max(0, wounds - devast);
      t.t_failed = attempts;

      const sr = Array.from({ length: attempts }, d6).sort((x, y) => x - y);
      let saved = 0, failed = 0;
      for (const die of sr) {
        const gi = current();
        const gk = gi >= 0 ? k.gk[gi] : lastGk;

        const f = gk.reroll === 'none' ? die : applyReroll([die], gk.reroll, gk.saveFail)[0];
        const before = applied;
        const ok = gk.saveOk(f);

        if (f !== die) by('saveReroll', (ok ? 1 : 0) - (gk.saveOk(die) ? 1 : 0));
        if (ok) { saved++; } else { failed++; inflict(gi); }
        if (trace) trace.rows.push({
          die: die, used: f, gi: gi, st: gk.st, saved: ok,
          got: applied - before, left: live.map((x) => x.left)
        });
      }

      let devastM = 0, devastRaw = 0;
      for (let i = 0; i < devast; i++) {
        const gi0 = mortalPick();
        const pts = damageOf(rollExpr(dmgTerms), k.gk[gi0 >= 0 ? gi0 : 0], true);
        devastRaw += pts;
        for (let j = 0; j < pts; j++) {
          const gi = mortalPick();
          const fnp = (gi >= 0 ? gs[gi] : gs[0]).fnp;
          if (fnp > 0 && d6() >= fnp) continue;
          devastM++;
          applied += hurt(gi, 1);
          if (trace) trace.devastRows.push({ gi: gi, left: live.map((x) => x.left) });
        }
      }
      if (trace) {
        trace.attacks = attacks; trace.hits = hits; trace.wounds = wounds;
        trace.devast = devast; trace.lethal = lethal; trace.attempts = attempts;
        trace.saved = saved; trace.failed = failed; trace.raw = raw; trace.applied = applied;
      }

      srcs.forEach((src, si) => { if (src.when === 'after') runSource(src, si); });

      c.ld_failBase = failed + c.by_saveReroll;
      c.ld_fnpRaw = rawPre - raw;
      c.ld_fnpDev = devastRaw - devastM;

      c.ld_lost = raw + devastM + mortal.total - applied;

      return {
        attacks: attacks, hits: hits, wounds: wounds, failed: failed,

        crit: crits, sust: sustained, leth: lethal,
        raw: raw, rawPre: rawPre, applied: applied, destroyed: killedOf(),

        gkilled: live.map((x) => x.killed),
        mortal: mortal.total, devastM: devastM, devastRaw: devastRaw,

        dmg: raw + devastM,
        hazard: hazard, ...spread(), ...t, ...c
      };
    }

    function expected(a, gs, k, atkTerms, dmgTerms, srcs) {
      srcs = srcs || [];
      const ph = facePmf(a.hitReroll, k.hitFail);
      const pw = facePmf(a.woundReroll, k.wFail);
      const gk = k.gk[0];
      const ps = facePmf(gk.reroll, gk.saveFail);

      const attacks = Math.max(1, a.weapons) * (meanExpr(atkTerms) + k.atkBonus);
      const pHit = k.torrent ? 1 : pOf(ph, k.hitOk);
      const pHitCrit = k.torrent ? 0 : pOf(ph, (f) => k.hitOk(f) && k.hitCrit(f));

      const hits = attacks * (pHit + (a.sustained > 0 ? a.sustained * pHitCrit : 0));
      const lethal = attacks * (a.lethal ? pHitCrit : 0);

      const woundDice = Math.max(0, hits - lethal);
      const pWound = pOf(pw, k.wOk);
      const pWoundCrit = pOf(pw, (f) => k.wOk(f) && k.wCrit(f));
      const wounds = woundDice * pWound + lethal;
      const devast = a.devastating ? woundDice * pWoundCrit : 0;

      const attempts = Math.max(0, wounds - devast);

      const failed = attempts * pOf(ps, gk.saveFail);

      const dmgMean = meanPmf(pmfExpr(dmgTerms), (v) => adjustDmg(Math.max(0, v), k, gk));

      const out = {};
      srcs.forEach((src, i) => {
        const on = !src.needCharge || k.charged;
        const pGate = src.gate > 0 ? (7 - src.gate) / 6 : 1;
        out['m' + i] = !on ? 0
          : k.single ? src.count * pGate * meanExpr(src.terms) * gk.fnpKeep : null;
      });
      const mortalTotal = srcs.length === 0 ? 0
        : srcs.some((src, i) => out['m' + i] == null) ? null
          : srcs.reduce((sum, src, i) => sum + out['m' + i], 0);

      return {
        attacks: attacks, hits: hits, wounds: wounds, ...out,
        failed: k.single ? failed : null,
        raw: k.single ? failed * dmgMean * gk.fnpKeep : null,

        devastM: !a.devastating ? 0 : k.single ? devast * dmgMean * gk.fnpKeep : null,

        dmg: !k.single ? null
          : failed * dmgMean * gk.fnpKeep + (a.devastating ? devast * dmgMean * gk.fnpKeep : 0),

        mortal: mortalTotal,

        hazard: a.hazardous ? Math.max(1, a.weapons) * (2 / 6) * (a.hazardBig ? 3 : 1) : 0
      };
    }

          how: 'Every value is a <b>mean per run</b>, the same measure as the figure right above it, so the chain can be added up by eye. The "of which" line is <b>already folded into the chain</b> and must not be added — hits gained by rerolling are already inside "hit".',
          list: ['What an ability <b>adds</b> is counted where it happens — extra attack dice, hits added by Sustained Hits, wounds that skipped the save',
            'What an ability <b>changes</b> is measured by judging the same dice once more as they would have been without it — rerolls, [LANCE], [PSYCHIC]',
            'So rerolling everything, which can turn a success into a failure, may come out negative',

            'Anything that did nothing this run is left out. The total across all runs sits on the tooltip of the figure'],

        },

        c_shootType: {
          t: 'Shooting type selected — normal · assault · close-quarters · indirect', ref: 'core rules 10.02',
          what: 'When a unit is selected to shoot, a shooting type is selected first. Each type has its own eligibility and its own restrictions.',

        c_visible: {

        c_targetable: {

        c_inRange: {

        c_cover: {

          how: 'The benefit of cover worsens the BS characteristic of that attack by 1. Here you can either worsen the hit target by one step (3+ → 4+) or set the hit modifier to −1 — the result is the same. It does not improve the save.',

        },
        c_canFight: {

          what: 'A unit can fight only if it is engaged, was engaged at the start of the step, or made a charge move this turn.',

        c_engaged: {

          see: ['weapons', 'attacks']
        },
        c_oneWeapon: {
          t: 'One melee weapon selected per model', ref: 'core rules 04.01 · 24.11',
          what: 'While fighting, each model selects one melee weapon. [EXTRA ATTACKS] weapons are the exception and are used in addition.',
          how: 'Give an [EXTRA ATTACKS] weapon its own profile here.',
          see: ['weapons']
        },
        c_chargeBonus: {
          t: 'Checked what the successful charge turns on', ref: 'core rules 11.02 · 24.21',
          what: 'A successful charge switches on things that apply only on that turn — +1 to wound from [LANCE], abilities that inflict mortal wounds on the charge, and so on.',
          how: 'Turn on "Made a charge move" at ⓪, and enter any mortal wounds in the field beside it.',
          see: ['charged', 'lance', 'chargeMortal']
        },
        c_rangeAbility: {
          t: 'Checked abilities gated by range or movement', ref: 'core rules 22.01 · 24.16 · 24.30',
          what: 'Aura abilities that reach "within 12 inches", [HEAVY] that needs the unit to have stayed put, [RAPID FIRE] that needs half range — an ability whose condition is not met simply does not apply to this attack.',
          how: 'This page knows neither distance nor movement. Check the condition yourself and enter only the result — what applies goes in, what does not stays out.',
          see: ['hitMod', 'rapidFire']
        },

        verdict: {
          t: 'Verdict',
          what: 'How many standard errors the measurement sits from the expectation (z).',
          how: 'Within two standard errors it passes; up to three it is borderline; beyond that it is a mismatch. More runs shrink the standard error and catch smaller discrepancies — at 10,000 runs the standard error is a hundredth of the standard deviation.'
        },
        basics: {
          t: 'Basics — what each field is, and how to write dice',
          what: 'This page reads no Warhammer data. Every field below is typed in by hand, and only those values are rolled. Tap any of them for the details.',
          how: 'Dice notation mixes numbers, nDm, + and −. Nothing is rolled from an expression that cannot be read.',
          see: ['mode', 'charged', 'chargeMortal',
            'weapons', 'attacks', 'hitTarget', 'hitMod', 'ignoreHitMod', 'critHit',
            'strength', 'ap', 'damage',
            'lethal', 'sustained', 'devastating', 'anti', 'hazardous', 'hazardBig',
            'torrent', 'blast', 'rapidFire', 'halfRange', 'melta',
            'lance', 'cleave',
            'toughness', 'save', 'inv', 'fnp', 'dmgReduce', 'wounds', 'models', 'verdict']
        },
      },
    };

    const COLS_ATK = [

      { k: 'name', t: 'text', g: 'base' }, { k: 'weapons', t: 'int', g: 'base' },
      { k: 'attacks', t: 'expr', g: 'base' }, { k: 'hitTarget', t: 'plus', g: 'base' },
      { k: 'strength', t: 'int', g: 'base' }, { k: 'ap', t: 'int', g: 'base' },
      { k: 'damage', t: 'expr', g: 'base' },

      { k: 'hitMod', t: 'int', g: 'both' }, { k: 'ignoreHitMod', t: 'pill', g: 'both' },
      { k: 'critHit', t: 'plus', g: 'both' },
      { k: 'hitReroll', t: 'reroll', g: 'both' }, { k: 'woundReroll', t: 'reroll', g: 'both' },
      { k: 'lethal', t: 'pill', g: 'both' }, { k: 'sustained', t: 'int', g: 'both' },
      { k: 'devastating', t: 'pill', g: 'both' }, { k: 'anti', t: 'plusz', g: 'both' },
      { k: 'hazardous', t: 'pill', g: 'both' }, { k: 'hazardBig', t: 'pill', g: 'both' },
      { k: 'precision', t: 'pill', g: 'both' },

      { k: 'blast', t: 'int', g: 'ranged' }, { k: 'rapidFire', t: 'int', g: 'ranged' },
      { k: 'halfRange', t: 'pill', g: 'ranged' }, { k: 'melta', t: 'int', g: 'ranged' },
      { k: 'torrent', t: 'pill', g: 'ranged' },

      { k: 'lance', t: 'pill', g: 'melee' }, { k: 'cleave', t: 'int', g: 'melee' },
    ];

    const COLS_GRP = [
      { k: 'name', t: 'text', g: 'base' }, { k: 'character', t: 'pill', g: 'base' },
      { k: 'models', t: 'int', g: 'base' }, { k: 'toughness', t: 'int', g: 'base' },
      { k: 'save', t: 'plus', g: 'base' }, { k: 'wounds', t: 'int', g: 'base' },
      { k: 'inv', t: 'plusz', g: 'both' }, { k: 'fnp', t: 'plusz', g: 'both' },
      { k: 'saveReroll', t: 'reroll', g: 'both' }, { k: 'dmgReduce', t: 'int', g: 'both' },
    ];

    const COLS_MOR = [
      { k: 'name', t: 'text', g: 'base' }, { k: 'count', t: 'int', g: 'base' },
      { k: 'gate', t: 'plusz', g: 'base' }, { k: 'amount', t: 'expr', g: 'base' },
      { k: 'when', t: 'seg', opts: 'whens', g: 'base' }, { k: 'needCharge', t: 'pill', g: 'base' },
    ];

    const SECS = [['base', 'secBase'], ['both', 'secCommon'], ['ranged', 'secRanged'], ['melee', 'secMelee']];
    const LIMITS = {
      weapons: [1, 999], hitTarget: [2, 6], hitMod: [-3, 3], strength: [1, 40], ap: [-6, 0],
      sustained: [0, 6], anti: [0, 6], blast: [0, 6], rapidFire: [0, 6],
      critHit: [2, 6], melta: [0, 6], cleave: [0, 6], count: [1, 99], gate: [0, 6],
      toughness: [1, 40], save: [2, 7], inv: [0, 6],
      fnp: [0, 6], wounds: [1, 99], models: [1, 99], dmgReduce: [0, 6],
    };

    const KEY = 'bulk_html_v2';
    const T = () => L[state.lang] || L.ko;
    const H = () => HELP[state.lang] || HELP.ko;
    const newAttacker = (n) => ({
      name: T().profile(n), weapons: 5, attacks: '2', hitTarget: 3, hitMod: 0, hitReroll: 'none',
      strength: 4, woundReroll: 'none', ap: 0, damage: '1',
      lance: false, lethal: false, sustained: 0, devastating: false, anti: 0,
      blast: 0, rapidFire: 0, halfRange: false, hazardous: false, torrent: false,
      critHit: 6, ignoreHitMod: false, melta: 0, cleave: 0, hazardBig: false,
    });

    const newGroup = (n) => ({
      name: T().group(n), character: false, models: 5, toughness: 4,
      save: 3, wounds: 2, inv: 0, fnp: 0, saveReroll: 'none', dmgReduce: 0
    });

    const enforceOrder = () => {
      state.groups = state.groups.filter((g) => !g.character).concat(state.groups.filter((g) => g.character));
    };

    const num = (v, lo, hi) => { const n = Number(v); return Number.isFinite(n) ? Math.min(hi, Math.max(lo, n)) : lo; };

    const newPre = () => ({ mode: 'ranged', charged: false, checked: {} });

    const newMortal = (n) => ({
      name: T().mortal(n), count: 1, gate: 0, amount: 'D3',
      when: 'before', needCharge: false
    });

    let state = {
      lang: (navigator.language || 'ko').toLowerCase().startsWith('ko') ? 'ko' : 'en',
      attackers: [],
      groups: [],
      mortals: [],
      pre: newPre(),
      runs: 10000, seed: '',
    };

    const SIGMA = 2;
    try {
      const saved = JSON.parse(localStorage.getItem(KEY) || 'null');
      if (saved && Array.isArray(saved.attackers) && saved.attackers.length) state = saved;
    } catch (e) { }

    function normalize() {
      if (!Array.isArray(state.attackers) || !state.attackers.length) state.attackers = [newAttacker(1)];
      state.pre = Object.assign(newPre(), state.pre);
      if (!state.pre.checked) state.pre.checked = {};

      if (!Array.isArray(state.groups) || !state.groups.length) {
        state.groups = [Object.assign(newGroup(1), state.defender || {})];
      }
      delete state.defender;
      state.groups = state.groups.map((g, i) => Object.assign(newGroup(i + 1), g));
      state.attackers = state.attackers.map((a) => Object.assign(newAttacker(1), { name: a.name }, a));
      enforceOrder();

      if (!Array.isArray(state.mortals)) state.mortals = [];
      if (state.pre.chargeMortal) {
        state.mortals.push(Object.assign(newMortal(state.mortals.length + 1),
          { name: T().mortalCharge, amount: state.pre.chargeMortal, needCharge: true }));
      }
      delete state.pre.chargeMortal;
      state.mortals = state.mortals.map((m, i) => Object.assign(newMortal(i + 1), m));
      state.runs = num(state.runs, 1, 1000000);
    }
    normalize();
    const save = () => { try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) { } };
    const esc = (s) => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/"/g, '&quot;');
    const getPath = (p) => p.split('.').reduce((o, x) => o[x], state);
    const setPath = (p, v) => {
      const parts = p.split('.');
      let o = state;
      for (const x of parts.slice(0, -1)) o = o[x];
      o[parts[parts.length - 1]] = v;
    };

    function openDialog(title, ref, bodyHtml, footHtml) {
      const d = document.createElement('dialog');
      d.innerHTML = '<header><h3>' + esc(title) + '</h3><span class="ref">' + esc(ref || '') + '</span></header>' +
        '<div class="body">' + bodyHtml + '</div>' +
        '<footer>' + (footHtml || '<span></span>') +
        '<button data-close>' + esc(T().close) + '</button></footer>';
      document.body.appendChild(d);
      d.addEventListener('click', (e) => {
        if (e.target === d || e.target.closest('[data-close]')) d.close();
      });
      d.addEventListener('close', () => d.remove());
      d.showModal();
      return d;
    }

    function openHelp(key) {
      const h = H()[key];
      if (!h) return;

      let body = '<p>' + h.what + '</p>';
      if (h.list) body += '<ul>' + h.list.map((x) => '<li>' + esc(x) + '</li>').join('') + '</ul>';
      if (h.table) {
        body += '<table><tbody>' + h.table.map((r) =>
          '<tr>' + r.map((c, i) => '<td' + (i === 1 ? ' style="color:var(--mid);white-space:nowrap"' : '') +
            '>' + esc(c) + '</td>').join('') + '</tr>').join('') + '</tbody></table>';
      }
      if (h.how) body += '<p class="how">→ ' + h.how + '</p>';
      if (h.see) {
        body += '<div class="seealso"><span class="hint">' + esc(T().seeAlso) + '</span>' +
          h.see.filter((k) => H()[k]).map((k) =>
            '<button data-help="' + k + '">' + esc(H()[k].t) + '</button>').join('') + '</div>';
      }
      openDialog(h.t, h.ref, body);
    }

    const q = (key) => H()[key]
      ? '<button class="q" data-help="' + key + '" aria-label="' + esc(T().helpAria) + '" title="' + esc(H()[key].t) + '">?</button>'
      : '';

    const other = () => (state.lang === 'ko' ? 'en' : 'ko');

    function fieldName(k, tag) {
      const a = L[state.lang].f[k], b = L[other()].f[k];
      if (state.lang !== 'ko') return esc(a);
      return esc(a) + (a === b ? '' : ' <' + tag + '>' + esc(b) + '</' + tag + '>');
    }

    const selectOf = (path, v, dict) => '<select data-p="' + path + '">' +
      Object.keys(dict).map((k) => '<option value="' + k + '"' + (v === k ? ' selected' : '') + '>' +
        esc(dict[k]) + '</option>').join('') + '</select>';

    function cellInput(path, col, v) {
      const lim = LIMITS[col.k] || [-999, 999];
      const n = (extra) => '<input type="number" data-p="' + path + '" value="' + v +
        '" min="' + lim[0] + '" max="' + lim[1] + '" step="1">' + (extra || '');
      switch (col.t) {
        case 'text': return '<input type="text" class="name" data-p="' + path + '" value="' + esc(v) + '">';
        case 'expr': return '<input type="text" class="expr" data-p="' + path + '" value="' + esc(v) + '">';

        case 'pill': return '<button class="pill" data-toggle="' + path + '" aria-pressed="' + (v ? 'true' : 'false') +
          '">' + esc(v ? T().on : T().off) + '</button>';
        case 'reroll': return selectOf(path, v, T().reroll);
        case 'sel': return selectOf(path, v, T()[col.opts]);

        case 'seg': return '<span class="seg">' + Object.keys(T()[col.opts]).map((o) =>
          '<button data-set="' + path + '|' + o + '" aria-pressed="' + (v === o) + '">' +
          esc(T()[col.opts][o]) + '</button>').join('') + '</span>';
        case 'plus': return n('+');
        case 'plusz': return n(v > 0 ? '+' : '');
        default: return n();
      }
    }

    const COLS_PRE = [
      { k: 'mode', t: 'seg', opts: 'modes', g: 'both' },
      { k: 'charged', t: 'pill', g: 'melee' },
    ];

    const CHECKS = [
      { k: 'shootType', m: 'ranged' }, { k: 'visible', m: 'ranged' },
      { k: 'targetable', m: 'ranged' },
      { k: 'hidden', m: 'ranged' }, { k: 'inRange', m: 'ranged' },
      { k: 'unengaged', m: 'ranged' }, { k: 'cover', m: 'ranged' },
      { k: 'canFight', m: 'melee' }, { k: 'engaged', m: 'melee' },
      { k: 'oneWeapon', m: 'melee' }, { k: 'chargeBonus', m: 'melee' },
      { k: 'rangeAbility', m: 'both' },
    ];
    const inMode = (g) => g === 'both' || g === state.pre.mode;
    const checksNow = () => CHECKS.filter((c) => inMode(c.m));

    function renderPre() {
      const t = T();
      const flds = COLS_PRE.filter((c) => inMode(c.g)).map((c) =>
        '<label class="fld">' +
        '<span class="k">' + fieldName(c.k, 'em') + q(c.k) + '</span>' +
        '<span class="v">' + cellInput('pre.' + c.k, c, state.pre[c.k]) + '</span></label>').join('');

      const list = checksNow();
      const on = list.filter((c) => state.pre.checked[c.k]).length;
      const chks = list.map((c) => {
        const h = H()['c_' + c.k] || { t: c.k };
        const v = !!state.pre.checked[c.k];
        return '<div class="chk" data-on="' + v + '">' +
          '<span class="k"><span>' + esc(h.t) + '</span>' + q('c_' + c.k) + '</span>' +
          '<span class="v"><button class="pill" data-toggle="pre.checked.' + c.k + '" aria-pressed="' + v + '">' +
          esc(v ? t.checkOn : t.checkOff) + '</button></span></div>';
      }).join('');

      document.getElementById('pre').innerHTML =
        '<div class="fsec"><h4>' + esc(t.secSituation) + '</h4><div class="form">' + flds + '</div>' +

        '<p class="prehint">' + (state.pre.mode === 'melee' ? t.gateMelee : t.gateRanged) + '</p></div>' +
        '<div class="fsec"><h4>' + esc(t.secChecks) + ' · ' + esc(t.checkCount(on, list.length)) +

        ' <button class="pill" data-checkall style="text-transform:none;letter-spacing:0">' +
        esc(on === list.length ? t.uncheckAll : t.checkAll) + '</button></h4>' +
        '<div class="chks">' + chks + '</div></div>';
    }

    const NUM = ['⓪', '①', '②', '③', '④', '⑤'];
    const STEPS = [
      { key: 's_pre', fields: ['mode', 'charged'] },
      { key: 's_attacks', fields: ['weapons', 'attacks', 'blast', 'rapidFire', 'halfRange', 'cleave'] },
      { key: 's_hits', fields: ['hitTarget', 'hitMod', 'ignoreHitMod', 'critHit', 'hitReroll', 'torrent'] },
      { key: 's_wounds', fields: ['strength', 'toughness', 'woundReroll', 'anti', 'lance'] },
      { key: 's_failed', fields: ['save', 'ap', 'inv', 'saveReroll'] },
      { key: 's_dmg', fields: ['damage', 'melta', 'fnp', 'dmgReduce', 'wounds', 'models'] },
    ];

    const SKIPS = [
      { after: 's_pre', help: 'mode', text: 'skipMode' },
      { after: 's_hits', help: 'lethal', text: 'skipLethal' },
      { after: 's_wounds', help: 'devastating', text: 'skipDevast' },
      { after: 's_dmg', help: 'hazardous', text: 'afterHazard' },
    ];

    const FIELD_SIDE = {};
    for (const c of COLS_ATK.concat(COLS_GRP, COLS_MOR, COLS_PRE)) FIELD_SIDE[c.k] = c.g;
    const usableNow = (f) => !['ranged', 'melee'].includes(FIELD_SIDE[f]) || FIELD_SIDE[f] === state.pre.mode;

    function renderSeq() {
      const t = T();
      let rows = '';
      STEPS.forEach((st, i) => {
        const ph = t.phases[i];
        rows += '<div class="step"><span class="no">' + NUM[i] + '</span><div>' +
          '<div><span class="sname">' + esc(ph[0]) +
          (state.lang === 'ko' ? ' <em>' + esc(ph[1]) + '</em>' : '') + '</span>' +
          '<span class="sref">' + esc(ph[2]) + '</span> ' + q(st.key) + '</div>' +

          '<div class="chips">' + st.fields.filter(usableNow).map((k) =>
            '<button class="chip" data-help="' + k + '">' + fieldName(k, 'em') + '</button>').join('') + '</div>' +
          '</div></div>';
        for (const sk of SKIPS) if (sk.after === st.key) rows += '<div class="skip">' + t[sk.text] + ' ' + q(sk.help) + '</div>';
      });
      document.getElementById('seq').innerHTML =
        '<summary><span>' + esc(t.seqTitle) + '</span>' +
        '<span class="fold"><em class="on">' + esc(t.fold) + '</em>' +
        '<em class="off">' + esc(t.unfold) + '</em></span></summary>' +
        '<div class="seqbody">' + rows + '</div>';
    }

    const sign = (n) => (n > 0 ? '+' + n : String(n));

    const SUM_ATK = ['attacks', 'hitTarget', 'strength', 'ap', 'damage'];
    const SUM_GRP = ['toughness', 'save', 'wounds'];

    function valueText(cols, k, v) {
      const t = (cols.find((c) => c.k === k) || {}).t;
      if (t === 'plus') return v + '+';
      if (t === 'plusz') return v > 0 ? v + '+' : String(v);
      return String(v);
    }

    function summaryLine(lang, cols, keys, obj, count) {
      const dict = L[lang];
      const body = '(' + keys.map((k) => dict.f[k] + ' ' + valueText(cols, k, obj[k])).join(' · ') + ')';
      const unit = dict.unit(count);
      return dict.countFirst ? unit + ' ' + body : body + ' ' + unit;
    }

      if (a.rapidFire > 0) add(f.rapidFire + ' ' + a.rapidFire + (a.halfRange ? ' · ' + f.halfRange : ''), melee);
      if (a.melta > 0) add(f.melta + ' ' + a.melta + (a.halfRange ? ' · ' + f.halfRange : ''), melee || !a.halfRange);

    const toB64 = (bytes) => {
      let bin = '';
      for (let i = 0; i < bytes.length; i += 0x8000) {
        bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
      }
      return btoa(bin).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
    };
    const fromB64 = (s0) => {
      const bin = atob(s0.replace(/-/g, '+').replace(/_/g, '/'));
      const out = new Uint8Array(bin.length);
      for (let i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i);
      return out;
    };
    const canZip = typeof CompressionStream !== 'undefined';
    const zip = async (str) => new Uint8Array(await new Response(
      new Blob([new TextEncoder().encode(str)]).stream().pipeThrough(new CompressionStream('deflate-raw'))
    ).arrayBuffer());
    const unzip = async (bytes) => new TextDecoder().decode(await new Response(
      new Blob([bytes]).stream().pipeThrough(new DecompressionStream('deflate-raw'))
    ).arrayBuffer());

    async function shareUrl() {
      const dump = JSON.stringify({ app: 'bulk.html', at: new Date().toISOString().slice(0, 10), state: state });
      const packed = canZip ? 'z' + toB64(await zip(dump)) : 'j' + toB64(new TextEncoder().encode(dump));
      return location.origin + location.pathname + '?s=' + packed;
    }

    async function readShared(text) {
      let packed = String(text || '').trim();
      const m = packed.match(/[?&]s=([^&#\s]+)/);
      if (m) packed = m[1];
      if (!packed) return null;
      const head = packed[0], rest = packed.slice(1);
      let json = null;
      try {
        if (head === 'z') json = await unzip(fromB64(rest));
        else if (head === 'j') json = new TextDecoder().decode(fromB64(rest));
        else json = packed;
      } catch (e) { return null; }
      try {
        const got = JSON.parse(json);
        return got && got.state ? got.state : got;
      } catch (e) { return null; }
    }

    function histogram(counts, runs, mean, title) {
      const seen = [...counts.keys()].sort((x, y) => x - y);
      const head = title == null ? T().chartTitle : title + ' — ' + T().mortalDist;
      if (!seen.length) return '<div class="chart"><p class="hint">' + esc(T().chartNone) + '</p></div>';

      const max = seen[seen.length - 1];
      const bins = [];
      for (let v = 0; v <= max; v++) bins.push({ v: v, ratio: (counts.get(v) || 0) / runs });
      const maxRatio = Math.max(...bins.map((b) => b.ratio), 1e-9);

      const showPct = bins.length <= 20;
      const pct = (r) => (r * 100 >= 10 ? (r * 100).toFixed(0) : (r * 100).toFixed(1)) + '%';
      const every = Math.max(1, Math.ceil(bins.length / 16));

      const cols = bins.map((b) => '<div class="bcol" title="' + b.v + ' — ' + (b.ratio * 100).toFixed(2) + '%">' +
        '<div class="bbar" style="height:' + (b.ratio / maxRatio * 100).toFixed(1) + '%' +
        (b.ratio > 0 ? ';min-height:1px' : '') + '">' +
        (showPct && b.ratio > 0 ? '<span class="bpct">' + pct(b.ratio) + '</span>' : '') +
        '</div></div>').join('');
      const xs = bins.map((b, i) => '<span>' + (i % every ? '' : b.v) + '</span>').join('');
      const meanAt = ((mean + 0.5) / bins.length * 100).toFixed(2);

      return '<div class="chart"><div class="ttl">' + esc(head) + '</div>' +
        '<div class="plot"><div class="bars">' + cols + '</div>' +
        '<div class="mline" style="left:' + meanAt + '%"></div>' +
        '<div class="mlbl" style="left:' + meanAt + '%">' + esc(T().chartMean) + ' ' + mean.toFixed(2) + '</div>' +
        '</div><div class="bxs">' + xs + '</div></div>';
    }

    function quantile(counts, runs, p) {
      const target = p * (runs - 1);
      let seen = 0;
      for (const v of [...counts.keys()].sort((x, y) => x - y)) {
        seen += counts.get(v);
        if (seen > target) return v;
      }
      return 0;
    }
