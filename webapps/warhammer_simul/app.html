    function verdict(exp, obs, se, sigma) {
      const t = T();

      if (exp == null) return { cls: 'none', text: t.noFormulaWhy, z: NaN };
      if (se === 0) {
        return Math.abs(obs - exp) < 1e-9
          ? { cls: 'pass', text: t.vPassFixed, z: 0 }
          : { cls: 'fail', text: t.vFailFixed, z: Infinity };
      }
      const z = (obs - exp) / se;
      const az = Math.abs(z);
      if (az <= sigma) return { cls: 'pass', text: t.vPass(sigma), z: z };
      if (az <= sigma * 1.5) return { cls: 'warn', text: t.vWarn, z: z };
      return { cls: 'fail', text: t.vFail, z: z };
    }

    function traceBlock(r, t) {
      const tr = r.trace;
      if (!tr) return '';
      tr.devastRows = tr.devastRows || [];
      const many = r.groups.length > 1;
      const nameOf = (i) => (i >= 0 ? (i + 1) + '. ' + r.groups[i].name : '—');

      const groups = '<ul>' + r.groups.map((g, i) =>
        '<li>' + esc(nameOf(i)) + (g.character ? ' · <b>' + esc(t.f.character) + '</b>' : '') + ' — ' +
        esc(t.f.models) + ' ' + g.models + ' · ' + esc(t.f.wounds) + ' ' + g.wounds + ' · ' +
        t.stv(g.st > 6 ? t.noSave : g.st + '+') + (g.usingInv ? ' ' + t.usingInv : '') +
        '</li>').join('') + '</ul>' +
        (r.precision && r.groups.some((g) => g.character) ? '<p>' + esc(t.tracePrecision) + '</p>' : '');

      const tally = [0, 0, 0, 0, 0, 0, 0];
      for (const x of tr.rows) if (x.die != null) tally[x.die]++;
      const dieBox = (face, hit, from) =>
        '<span class="die' + (hit ? ' hit' : '') + '">' +
        (from != null ? '<em>' + from + '→</em>' : '') +
        (face == null ? esc(t.traceSkipDie) : face) + '</span>';
      const tallyHtml = '<div class="dice">' + tally.map((n2, face) =>
        n2 > 0 ? dieBox(face, false) + '<span class="hint" style="align-self:center">×' + n2 + '</span>' : '')
        .join('') + '</div>';

      const segs = [];
      let cursor = tr.startLeft || r.groups.map((g) => g.models);
      for (const x of tr.rows) {
        const last = segs[segs.length - 1];
        if (last && last.gi === x.gi) { last.rows.push(x); } else { segs.push({ gi: x.gi, rows: [x], before: cursor }); }
        cursor = x.left;
      }
      const shifted = segs.length > 1;

      const menBar = (gi, before, after) => {
        if (gi < 0) return '';
        const all = r.groups[gi].models;
        const dots = (n2) => (all > 20 ? '<b class="num">' + n2 + '</b> / ' + all
          : '●'.repeat(Math.max(0, n2)) + '<span class="gone">' + '○'.repeat(Math.max(0, all - n2)) + '</span>');
        return '<div class="men">' + dots(before) + '<span class="arrow">→</span>' + dots(after) + '</div>';
      };

      const segHtml = segs.map((sg, i) => {
        const gk = sg.rows[0];
        const ok = sg.rows.filter((x) => x.saved).length;
        const dmg = sg.rows.reduce((n2, x) => n2 + x.got, 0);
        const after = sg.rows[sg.rows.length - 1].left;
        return '<div class="alloc"><div class="h">' +
          '<b>' + esc(t.traceRound(i + 1)) + ' · ' + esc(nameOf(sg.gi)) + '</b>' +
          '<span>' + (gk.st == null ? '' : t.stv(gk.st > 6 ? t.noSave : gk.st + '+')) + '</span>' +
          '</div>' +
          '<div class="dice">' + sg.rows.map((x) =>
            dieBox(x.used == null ? null : x.used, !x.saved, x.used !== x.die ? x.die : null)).join('') + '</div>' +
          '<div class="sum">' + esc(t.traceSegSum(ok, sg.rows.length - ok, dmg)) + '</div>' +
          menBar(sg.gi, sg.gi >= 0 ? sg.before[sg.gi] : 0, sg.gi >= 0 ? after[sg.gi] : 0) +
          '</div>';
      }).join('');

      const table = tr.rows.length
        ? '<p>' + esc(t.traceRolled(tr.rows.length)) + '</p>' + tallyHtml +
        '<p>' + esc(t.traceSort) + '</p>' + segHtml +
        '<p class="hint">' + esc(t.traceLegend) + '</p>'
        : '<p>' + esc(t.traceNone) + '</p>';

      const mby = new Map();
      for (const x of tr.mortalRows) {
        const key = x.si + '|' + x.gi;
        mby.set(key, (mby.get(key) || 0) + 1);
      }
      const mortal = tr.mortalRows.length
        ? '<h5>' + esc(t.traceMortal) + '</h5>' + r.mortals.map((m, si) => {
          const mine = [...mby.entries()].filter((e) => e[0].split('|')[0] === String(si));
          if (!mine.length) return '';
          return '<div class="alloc"><div class="h"><b>' + esc(t.traceMortalRound(m.name)) + '</b>' +
            '<span>' + esc(t.mortalSub) + '</span></div><div class="dice">' +
            mine.map((e) => '<span class="die hit">' + e[1] + '</span>' +
              '<span class="hint" style="align-self:center">' + esc(nameOf(Number(e[0].split('|')[1]))) +
              '</span>').join('') + '</div></div>';
        }).join('') : '';

      return '<details class="trace"><summary>' + esc(t.traceTitle) + '</summary><div class="tracebody">' +
        '<p>' + t.traceLead + '</p>' +
        '<h5>' + esc(t.traceGroups) + '</h5>' + groups +
        '<h5>' + esc(t.traceCounts) + '</h5><p>' +
        esc(t.traceCount(tr.attacks, tr.hits, tr.wounds, tr.devast)) + '</p>' +
        '<h5>' + esc(t.traceSaves) + '</h5>' + table + mortal +
        (many ? '<h5>' + esc(t.traceWhy) + '</h5><p>' + (shifted ? t.traceWhyBody : t.traceNoBreak) + '</p>' : '') +
        '</div></details>';
    }

    const ledName = (key, rowKey, t) =>
      key === rowKey
        ? (t.ledFinal[rowKey] || t.ledFinal.mortal)

        : t.led[key] ? t.led[key] +
          (NOTE_FROM[key] || []).map((x) => ' [' + t.f[x] + ']').join('')
          : CONTRIB_TAG[key] ? t.f[CONTRIB_TAG[key]]

            : /^mr\d+$/.test(key) ? t.ledMr
              : /^mf\d+$/.test(key) ? t.ledMf
                : t.led[key];
    const LED_OP = { '+': '＋', '-': '−', '>': '→', '=': '＝' };

    function ledgerRow(r, k, t) {

      const led = LEDGER[k] || (/^m\d+$/.test(k)
        ? ['mr' + k.slice(1), '-mf' + k.slice(1), '=' + k] : null);
      if (!led) return '';
      const chip = (s, rowKey) => {
        const op = LED_OP[s[0]] || '';
        const key = ledKey(s);
        const v = r.mean[key];

        if (!v && key !== rowKey) return '';

        return '<span class="led"><i>' + op + '</i>' +
          '<span>' + esc(ledName(key, rowKey, t)) + '</span><b>' + f3(v) + '</b></span>';
      };

      const note = (LEDGER_NOTE[k] || []).map((key) => chip(key, null)).join('');
      return '<span class="tot chain">' + led.map((s) => chip(s, k)).join('') + '</span>' +
        (note ? '<span class="tot chain note"><em>' + esc(t.ledNote) + '</em>' + note + '</span>' : '');
    }

    function draw(run) {
      const t = T();
      const blocks = run.results.map((r) => {
        if (r.bad) {
          return '<div class="card"><header><span>' + esc(r.name) + '</span></header>' +
            '<div class="note err">' + esc(t.badExpr(r.attacks, r.damage)) + '</div></div>';
        }
        let worst = 'pass', anyNone = false;

        const labelOf = (k) => t.stage[k] ||
          [(r.aside.find((x) => x.key === k) || {}).name || k, t.mortalSub];
        const helpOf = (k) => (t.stage[k] ? 's_' + k : 's_mortal');

        const rowName = (k) => {
          const cur = labelOf(k)[0];
          if (state.lang !== 'ko') return esc(cur);
          const alt = (L[other()].stage[k] || [])[0];
          return esc(cur) + (alt && alt !== cur ? ' <em>' + esc(alt) + '</em>' : '');
        };
        const rowsOf = (keys) => keys.map((k) => {
          const v = verdict(r.exp[k], r.mean[k], r.se[k], run.sigma);
          if (v.cls === 'none') anyNone = true;
          else if (v.cls === 'fail' || (v.cls === 'warn' && worst === 'pass')) worst = v.cls;
          const expText = r.exp[k] == null ? esc(t.noFormula) : f3(r.exp[k]);

          const detail = (r.exp[k] == null ? esc(v.text)
            : esc(t.cols.diff) + ' ' + (r.mean[k] - r.exp[k] >= 0 ? '+' : '') + f3(r.mean[k] - r.exp[k]) +
            ' · ' + esc(t.cols.se) + ' ' + f3(r.se[k]) +
            ' · z ' + (Number.isFinite(v.z) ? (v.z >= 0 ? '+' : '') + f2(v.z) : '—') + ' · ' + esc(v.text)) +

            ' · ' + esc(t.totalLabel(r.total[k].toLocaleString()));
          return '<tr>' +
            '<td class="stage"><span>' + rowName(k) + ' <span class="hint">' + esc(labelOf(k)[1]) + '</span></span>' +
            q(helpOf(k)) + '</td>' +
            '<td class="num' + (r.exp[k] == null ? ' pass' : '') + '">' + expText + '</td>' +

            '<td class="num ' + v.cls + '" title="' + detail + '">' +
            (ledgerRow(r, k, t) || f3(r.mean[k])) +
            '</td>' +
            '</tr>';
        }).join('');
        const rows = rowsOf(stagesOf(r));
        const aside = rowsOf(asideOf(r));

        const head = worst === 'pass'
          ? '<span class="pass">' + esc(anyNone ? t.somePartial : t.allPass) + '</span>'
          : worst === 'warn' ? '<span class="warn">' + esc(t.someWarn) + '</span>'
            : '<span class="fail">' + esc(t.someFail) + '</span>';

        const saveText = (g) => t.stv(g.st > 6 ? t.noSave : g.st + '+') + (g.usingInv ? ' ' + t.usingInv : '');
        const same = r.groups.every((g) => saveText(g) === saveText(r.groups[0]));
        const saves = same ? saveText(r.groups[0])
          : r.groups.map((g) => esc(g.name) + ' ' + saveText(g)).join(' · ');
        return '<div class="card">' +
          '<header><span>' + esc(r.name) + '</span><span class="sub">' +
          esc(t.runsLabel(run.runs.toLocaleString())) + ' · ' +
          t.wt(r.k.wt) + ' · ' + saves + ' · ' + head + '</span></header>' +
          '<div class="scroll" style="border:0;border-radius:0"><table>' +
          '<thead><tr><th><span class="hd">' + esc(t.cols.stage) + q('s_ledger') + '</span></th><th>' + esc(t.cols.exp) +
          '</th><th><span class="hd">' + esc(t.cols.obs) + q('verdict') + '</span></th></tr></thead>' +
          '<tbody>' + rows + '</tbody></table></div>' +
          histogram(r.applied, run.runs, r.mean.applied) +
          '<div class="statrow">' +

          (r.mortalOn ? '<span>' + esc(t.stage.mortal[0]) + ' <b class="num">' + f3(r.mean.mortal) + '</b></span>' : '') +
          '<span>' + esc(t.median) + ' <b class="num">' + r.stats.median + '</b></span>' +
          '<span>' + esc(t.p10) + ' <b class="num">' + r.stats.p10 + '</b></span>' +
          '<span>' + esc(t.p90) + ' <b class="num">' + r.stats.p90 + '</b></span>' +
          '<span>' + esc(t.min) + ' <b class="num">' + r.stats.min + '</b></span>' +
          '<span>' + esc(t.max) + ' <b class="num">' + r.stats.max + '</b></span>' +
          '<span>' + esc(t.stdev) + ' <b class="num">' + f2(r.stats.stdev) + '</b></span>' +
          '</div>' +

          '<div class="note appliedsum">' + esc(t.appliedTitle) +
          ledgerRow(r, 'applied', t) + '</div>' +
          '<div class="note">' + esc(t.refNote) + ' — ' +
          esc(t.destroyed) + ' <b class="num">' + f3(r.mean.destroyed) + '</b> / ' + r.models + ' · ' +
          esc(t.wipe) + ' <b class="num">' + f2(r.wipeRate * 100) + '%</b>' +

          (r.groups.length > 1 ? '<br>' + esc(t.perGroup) + ' — ' + r.groups.map((g) =>
            esc(g.name) + ' <b class="num">' + f3(g.killed) + '</b> / ' + g.models).join(' · ') : '') +
          '</div>' +

          (aside ? '<div class="aside"><h4>' + esc(t.asideTitle) + '</h4>' +
            '<div class="scroll" style="border:0;border-radius:0"><table>' +
            '<thead><tr><th><span class="hd">' + esc(t.cols.stage) + q('s_ledger') + '</span></th><th>' + esc(t.cols.exp) +
            '</th><th><span class="hd">' + esc(t.cols.obs) + q('verdict') + '</span></th></tr></thead>' +
            '<tbody>' + aside + '</tbody></table></div>' +

            r.aside.map((x) => histogram(x.dist, run.runs, r.mean[x.key], x.name)).join('') +

            '<div class="note">' + t.asideWhy + '</div></div>' : '') +
          traceBlock(r, t) +
          '</div>';
      });

      const notes =
        (run.badMortal ? '<div class="card"><div class="note err">' + esc(t.badMortal(run.badMortal)) + '</div></div>' : '') +
        (run.unchecked > 0 ? '<div class="card"><div class="note">' + esc(t.uncheckedNote(run.unchecked)) + '</div></div>' : '');
      document.getElementById('out').innerHTML = notes + blocks.join('');
      document.getElementById('status').textContent =
        t.status(run.runs.toLocaleString(), run.results.length, run.ms, run.seed);
    }

    document.getElementById('run').onclick = () => {
      const runs = state.runs;
      const seed = state.seed === '' ? (Math.random() * 4294967296) >>> 0 : Number(state.seed) >>> 0;
      rand = mulberry32(seed);
      const t0 = performance.now();
      const results = [];

      const pre = state.pre;

      const srcs = [];
      let badMortal = null;
      for (const m of state.mortals) {
        const terms = parseExpr(m.amount);
        if (!terms) { badMortal = m.amount; continue; }
        srcs.push({
          name: m.name, count: m.count, gate: m.gate, terms: terms,
          when: m.when, needCharge: m.needCharge
        });
      }
      const mkeys = srcs.map((x, i) => 'm' + i);
      const rawkeys = srcs.map((x, i) => 'mr' + i);
      const fnpkeys = srcs.map((x, i) => 'mf' + i);
      const allKeys = KEYS.concat(mkeys, rawkeys, fnpkeys, CKEYS, LKEYS);

      for (const a of state.attackers) {
        const atkTerms = parseExpr(a.attacks);
        const dmgTerms = parseExpr(a.damage);
        if (!atkTerms || !dmgTerms) {
          results.push({ bad: true, name: a.name, attacks: a.attacks, damage: a.damage });
          continue;
        }
        const gs = state.groups;
        const k = derive(a, gs, pre);
        const exp = expected(a, gs, k, atkTerms, dmgTerms, srcs);

        const sum = {}, sq = {};
        for (const key of allKeys) { sum[key] = 0; sq[key] = 0; }
        const applied = new Map();
        const mdist = srcs.map(() => new Map());
        const ddist = new Map();
        const gkilled = gs.map(() => 0);
        let wipes = 0;

        for (let i = 0; i < runs; i++) {
          const r = simulateOnce(a, gs, k, atkTerms, dmgTerms, srcs);
          for (const key of allKeys) { sum[key] += r[key]; sq[key] += r[key] * r[key]; }
          applied.set(r.applied, (applied.get(r.applied) || 0) + 1);
          for (let m = 0; m < mdist.length; m++) mdist[m].set(r['m' + m], (mdist[m].get(r['m' + m]) || 0) + 1);
          if (a.devastating) ddist.set(r.devastM, (ddist.get(r.devastM) || 0) + 1);
          for (let g = 0; g < gkilled.length; g++) gkilled[g] += r.gkilled[g];
          if (r.destroyed >= k.models) wipes++;
        }

        const mean = {}, se = {}, total = {};
        for (const key of allKeys) {
          mean[key] = sum[key] / runs;
          total[key] = Math.round(sum[key]);
          se[key] = Math.sqrt(Math.max(0, sq[key] / runs - mean[key] * mean[key]) / runs);
        }

        const trace = { rows: [], mortalRows: [], devastRows: [], mortalPts: 0 };
        simulateOnce(a, gs, k, atkTerms, dmgTerms, srcs, trace);

        const keys = [...applied.keys()].sort((x, y) => x - y);
        results.push({
          name: a.name, k: k, exp: exp, mean: mean, se: se, total: total, applied: applied,
          models: k.models, wipeRate: wipes / runs, groups: gs.map((g, i) =>
          ({
            name: g.name, models: g.models, wounds: g.wounds, character: g.character,
            st: k.gk[i].st, usingInv: k.gk[i].usingInv, killed: gkilled[i] / runs
          })),
          precision: k.precision,
          single: k.single,
          mortals: srcs.map((src, i) => ({ name: src.name, key: 'm' + i, dist: mdist[i] })),

          aside: srcs.map((src, i) => ({ name: src.name, key: 'm' + i, dist: mdist[i] })),
          hazardous: a.hazardous, trace: trace,
          stats: {
            median: quantile(applied, runs, 0.5), p10: quantile(applied, runs, 0.1),
            p90: quantile(applied, runs, 0.9), min: keys[0], max: keys[keys.length - 1],
            stdev: se.applied * Math.sqrt(runs),
          },
        });
      }

      lastRun = {
        results: results, runs: runs, seed: seed, sigma: SIGMA,

        unchecked: checksNow().filter((c) => !state.pre.checked[c.k]).length,
        badMortal: badMortal,
        ms: Math.round(performance.now() - t0)
      };
      draw(lastRun);

      document.getElementById('out').scrollIntoView({ block: 'start' });

      state.seed = String(seed);
      document.getElementById('seed').value = seed;
      save();
    };

    renderChrome();
    renderAll();
  </script>
</body>
