<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>같은 그림, 다른 도형</title>
<style>
  :root {
    --bg: #f3f2ee; --surface: #ffffff; --line: #dcd9d1; --text: #1c1b19; --muted: #6d6961;
    --accent: #2563eb; --chip: #f0eee9; --stage: #151515;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #101010; --surface: #1a1a1a; --line: #2d2d2d; --text: #ebe9e4; --muted: #9b978f;
      --accent: #7aa7ff; --chip: #242424; --stage: #0c0c0c;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #101010; --surface: #1a1a1a; --line: #2d2d2d; --text: #ebe9e4; --muted: #9b978f;
    --accent: #7aa7ff; --chip: #242424; --stage: #0c0c0c;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    background: var(--bg); color: var(--text);
    font: 14px/1.45 "Pretendard", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
    padding: 14px 16px 24px;
  }
  body.locked { overflow: hidden; }
  .wrap { width: min(100%, 1000px); margin: 0 auto; }
  header.top { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 14px; margin-bottom: 10px; }
  header.top h1 { font-size: 18px; margin: 0; letter-spacing: -0.01em; }
  header.top p { margin: 0; color: var(--muted); font-size: 13px; }

  /* ---------- 뷰어 ---------- */
  .grid {
    display: grid; gap: 10px; margin: 0 auto;
    grid-template-columns: repeat(3, minmax(0, 1fr));
    grid-template-rows: repeat(3, minmax(0, 1fr));
    grid-template-areas: "big big p9" "big big p6" "p1 p2 p3";
    width: min(100%, calc(100svh - 110px), 1000px);
    min-width: 300px; aspect-ratio: 1;
  }
  @media (max-width: 700px) {
    .grid { width: 100%; min-width: 0; aspect-ratio: 3 / 4.1;
      grid-template-rows: minmax(0, 1.55fr) minmax(0, 1.55fr) minmax(0, 1fr); gap: 6px; }
  }
  .cell {
    position: relative; padding: 0; border: 0; border-radius: 10px; overflow: hidden;
    background: var(--stage); cursor: pointer; color: inherit; font: inherit; min-height: 0;
    outline: 2px solid transparent; outline-offset: 2px; transition: outline-color .15s;
  }
  .cell svg { display: block; width: 100%; height: 100%; }
  .cell.on, .cell:focus-visible { outline-color: var(--accent); }
  .tag {
    position: absolute; left: 6px; bottom: 6px; pointer-events: none;
    background: rgba(0,0,0,.62); color: #fff; font-size: 12px; padding: 2px 7px; border-radius: 6px;
    white-space: nowrap; max-width: calc(100% - 12px); overflow: hidden; text-overflow: ellipsis;
  }
  .tag b { font-variant-numeric: tabular-nums; margin-right: 4px; opacity: .8; }

  .big {
    grid-area: big; display: flex; flex-direction: column; min-height: 0; overflow: hidden;
    background: var(--surface); border: 1px solid var(--line); border-radius: 12px;
  }
  .bighead { display: flex; align-items: flex-start; gap: 10px; padding: 9px 12px 8px; }
  .num {
    flex: none; width: 26px; height: 26px; border-radius: 7px; display: grid; place-items: center;
    background: var(--text); color: var(--surface); font-weight: 700; font-size: 14px;
  }
  .bighead .txt { min-width: 0; flex: 1; }
  .bighead strong { font-size: 14px; }
  .cap { display: block; color: var(--muted); font-size: 12px; }
  .stage { position: relative; flex: 1; min-height: 0; background: var(--stage); }
  .stage svg { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  .foot { flex: none; padding: 7px 12px 9px; display: flex; flex-direction: column; gap: 6px; font-size: 12px; }
  .status { color: var(--muted); min-height: 18px; display: flex; align-items: center; gap: 6px; flex-wrap: wrap; font-variant-numeric: tabular-nums; }
  .status .sw { width: 12px; height: 12px; border-radius: 3px; display: inline-block; box-shadow: inset 0 0 0 1px rgba(127,127,127,.5); }
  .legend { display: flex; flex-wrap: wrap; gap: 4px 10px; align-items: center; }
  .legend .it { display: inline-flex; align-items: center; gap: 5px; white-space: nowrap; }
  .legend code { font: 11px ui-monospace, Consolas, monospace; color: var(--muted); }
  .legend .arrow { color: var(--muted); }

  /* ---------- 공통 컨트롤 ---------- */
  .dot { width: 10px; height: 10px; border-radius: 3px; display: inline-block; flex: none; box-shadow: inset 0 0 0 1px rgba(0,0,0,.25); }
  .controls { display: flex; flex-wrap: wrap; gap: 6px 14px; align-items: center; }
  label.ctl, span.ctl { display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; font-size: 12px; }
  input[type=range] { width: 110px; accent-color: var(--accent); }
  select { font: inherit; font-size: 12px; padding: 4px 5px; border-radius: 6px; border: 1px solid var(--line); background: var(--surface); color: var(--text); max-width: 100%; }
  output { font-variant-numeric: tabular-nums; color: var(--muted); min-width: 36px; font-size: 12px; }
  .seg { display: flex; gap: 2px; background: var(--chip); border-radius: 8px; padding: 2px; }
  .seg button, .btn {
    border: 0; background: transparent; color: var(--text); font: inherit; font-size: 12px;
    padding: 6px 9px; border-radius: 6px; cursor: pointer; white-space: nowrap;
    display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  }
  .seg button { flex: 1; }
  .seg button.on { background: var(--surface); box-shadow: 0 1px 2px rgba(0,0,0,.15); font-weight: 600; }
  .seg button:disabled { opacity: .4; cursor: default; }
  .btn { background: var(--chip); }
  .btn:hover:not(:disabled), .seg button:hover:not(:disabled) { filter: brightness(0.95); }
  .btn:disabled { opacity: .4; cursor: default; }
  .cnt { margin-left: auto; color: var(--muted); font-size: 11px; font-weight: 400; font-variant-numeric: tabular-nums; }
  .muted { color: var(--muted); font-size: 12px; margin: 0; }
  [hidden] { display: none !important; }

  /* ---------- 편집기 ---------- */
  .editor {
    width: min(100%, 1440px); margin: 22px auto 0;
    background: var(--surface); border: 1px solid var(--line); border-radius: 12px; overflow: hidden;
  }
  .edtop { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px 16px; padding: 10px 12px; border-bottom: 1px solid var(--line); }
  .edtitle { min-width: 0; flex: 1 1 320px; }
  .edtitle h2 { margin: 0; font-size: 16px; }
  .edtopctl { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; }
  .edbody {
    display: grid; grid-template-columns: 50px minmax(0, 1fr) 310px;
    height: min(calc(100svh - 90px), 940px); min-height: 520px;
  }
  .edtools { display: flex; flex-direction: column; gap: 4px; padding: 8px 5px; border-right: 1px solid var(--line); }
  .tool {
    position: relative; width: 40px; height: 40px; border: 0; border-radius: 8px; background: transparent;
    color: var(--text); cursor: pointer; display: grid; place-items: center;
  }
  .tool svg { width: 20px; height: 20px; }
  .tool:hover { background: var(--chip); }
  .tool.on { background: var(--text); color: var(--surface); }
  .tool kbd { position: absolute; right: 2px; bottom: 1px; font-size: 9px; border: 0; background: transparent; padding: 0; color: inherit; opacity: .55; }
  .edstage { position: relative; background: #0a0a0a; min-width: 0; min-height: 0; overflow: hidden; }
  .edstage svg { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; user-select: none; }
  .edstage.drawing svg { cursor: crosshair; }
  .edstage.pan svg { cursor: grab; }
  .edstage.panning svg { cursor: grabbing; }
  .edhint {
    position: absolute; left: 10px; top: 10px; max-width: calc(100% - 20px); pointer-events: none;
    background: rgba(0,0,0,.6); color: #e8e8e8; font-size: 12px; padding: 4px 9px; border-radius: 6px;
  }
  .zoombar { position: absolute; left: 10px; bottom: 10px; display: flex; gap: 2px; background: rgba(0,0,0,.65); border-radius: 8px; padding: 2px; }
  .zoombar button { border: 0; background: transparent; color: #eee; font: inherit; font-size: 13px; min-width: 32px; height: 28px; border-radius: 6px; cursor: pointer; font-variant-numeric: tabular-nums; }
  .zoombar button:hover { background: rgba(255,255,255,.12); }
  .edside { overflow-y: auto; border-left: 1px solid var(--line); padding: 12px; display: flex; flex-direction: column; gap: 16px; min-width: 0; }
  .grp { display: flex; flex-direction: column; gap: 7px; }
  .grp > .lbl { font-size: 11px; font-weight: 700; color: var(--muted); letter-spacing: .04em; }
  .row { display: flex; flex-wrap: wrap; gap: 6px; }
  .row .btn { flex: 1 1 auto; }

  .lyr { border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
  .lyr + .lyr { margin-top: 6px; }
  .lyr.on { border-color: var(--accent); }
  .lh { display: flex; align-items: center; gap: 4px; padding: 3px; background: var(--chip); }
  .lname { flex: 1; display: flex; align-items: center; gap: 7px; border: 0; background: transparent; color: var(--text); font: inherit; font-size: 12px; font-weight: 600; padding: 4px 6px; cursor: pointer; text-align: left; }
  .mini { border: 1px solid var(--line); background: var(--surface); color: var(--text); font: inherit; font-size: 11px; border-radius: 6px; padding: 2px 7px; cursor: pointer; white-space: nowrap; }
  .lyr ul { list-style: none; margin: 0; padding: 3px; }
  .lyr ul:empty { display: none; }
  .obj { display: flex; align-items: center; gap: 4px; border-radius: 6px; }
  .obj.sel { background: color-mix(in srgb, var(--accent) 18%, transparent); }
  .oname { flex: 1; min-width: 0; text-align: left; border: 0; background: transparent; color: var(--text); font: inherit; font-size: 12px; padding: 4px 6px; cursor: pointer; display: flex; gap: 6px; align-items: center; }
  .obj.fixed .oname { color: var(--muted); }
  .mk { font-size: 10px; border: 1px solid var(--line); border-radius: 4px; padding: 0 4px; color: var(--muted); white-space: nowrap; }
  .pill { font: inherit; font-size: 11px; border: 1px solid var(--line); background: var(--surface); color: var(--muted); border-radius: 999px; padding: 1px 9px; cursor: pointer; white-space: nowrap; }
  .pill.on { background: var(--text); color: var(--surface); border-color: var(--text); }

  .pname { display: flex; align-items: center; gap: 7px; font-weight: 600; font-size: 13px; }
  .prow { display: grid; grid-template-columns: 62px minmax(0, 1fr); align-items: center; gap: 8px; font-size: 12px; }
  .plbl { color: var(--muted); }
  .note { font-size: 11.5px; color: var(--muted); background: var(--chip); border-radius: 8px; padding: 7px 9px; margin: 0; line-height: 1.5; }

  .editor.max {
    position: fixed; inset: 0; z-index: 50; width: auto; margin: 0; border-radius: 0; border: 0;
    display: flex; flex-direction: column;
  }
  .editor.max .edbody { flex: 1; height: auto; min-height: 0; }
  @media (max-width: 900px) {
    .edbody { grid-template-columns: minmax(0, 1fr); height: auto; min-height: 0; }
    .edtools { flex-direction: row; border-right: 0; border-bottom: 1px solid var(--line); overflow-x: auto; }
    .edstage { height: min(100vw, 72svh); }
    .edside { border-left: 0; border-top: 1px solid var(--line); overflow: visible; }
    .editor.max .edbody { display: flex; flex-direction: column; }
    .editor.max .edstage { flex: 1; height: auto; }
    .editor.max .edside { max-height: 38svh; overflow-y: auto; }
  }

  footer.hint { margin: 12px auto 0; color: var(--muted); font-size: 12px; text-align: center; max-width: 1000px; }
  kbd { font: 11px ui-monospace, Consolas, monospace; border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 4px; padding: 0 4px; background: var(--surface); }
  @media (max-width: 700px) {
    body { padding: 10px 16px 18px; }
    .bighead .cap { display: none; }
    .legend code { display: none; }
    .tag { font-size: 11px; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <h1>같은 그림, 다른 도형</h1>
    <p>한 장의 풀컬러 이미지라도 어떤 색으로 보느냐에 따라 보이는 도형이 다릅니다. 풀컬러는 그 모든 도형을 합친 결과입니다.</p>
  </header>
</div>

<main class="grid" id="grid">
  <section class="big">
    <div class="bighead">
      <span class="num" id="bigNum">9</span>
      <div class="txt"><strong id="bigTitle"></strong><span class="cap" id="bigCap"></span></div>
    </div>
    <div class="stage"><svg id="bigSvg" viewBox="0 0 1000 1000" preserveAspectRatio="xMidYMid meet"></svg></div>
    <div class="foot">
      <div class="status" id="status"></div>
      <div class="legend" id="legend"></div>
      <div class="controls" id="viewCtl">
        <label class="ctl">채도 <input type="range" id="satSl" min="0" max="1" step="0.01" value="1"><output id="satOut">100%</output></label>
        <label class="ctl">보는 눈
          <select id="cvdSel">
            <option value="none">일반 시각</option>
            <option value="protan">제1색맹 (적색 약)</option>
            <option value="deutan">제2색맹 (녹색 약)</option>
            <option value="tritan">제3색맹 (청색 약)</option>
            <option value="achro">전색맹 (휘도만)</option>
          </select>
        </label>
      </div>
    </div>
  </section>

  <button class="cell" data-k="9" style="grid-area:p9" aria-label="9 풀컬러"><svg viewBox="0 0 1000 1000"></svg><span class="tag"><b>9</b>풀컬러</span></button>
  <button class="cell" data-k="6" style="grid-area:p6" aria-label="6 흑백"><svg viewBox="0 0 1000 1000"></svg><span class="tag"><b>6</b>흑백</span></button>
  <button class="cell" data-k="1" style="grid-area:p1"><svg viewBox="0 0 1000 1000"></svg><span class="tag"><b>1</b><span class="nm" data-i="0"></span></span></button>
  <button class="cell" data-k="2" style="grid-area:p2"><svg viewBox="0 0 1000 1000"></svg><span class="tag"><b>2</b><span class="nm" data-i="1"></span></span></button>
  <button class="cell" data-k="3" style="grid-area:p3"><svg viewBox="0 0 1000 1000"></svg><span class="tag"><b>3</b><span class="nm" data-i="2"></span> (자동)</span></button>
</main>

<section class="editor" id="editor">
  <div class="edtop">
    <div class="edtitle">
      <h2>이미지 편집</h2>
      <span class="cap" id="edCap"></span>
    </div>
    <div class="edtopctl">
      <span class="ctl">바탕</span>
      <div class="seg" id="bgSeg">
        <button data-bg="layer">편집 레이어</button>
        <button data-bg="full">풀컬러</button>
        <button data-bg="gray">흑백</button>
      </div>
      <label class="ctl"><input type="checkbox" id="ghostChk" checked> 다른 레이어 윤곽</label>
      <button class="btn" id="btnUndo" title="되돌리기 (Ctrl+Z)">되돌리기</button>
      <button class="btn" id="btnMax" title="편집기를 화면 가득 (Esc로 복귀)">크게 보기</button>
    </div>
  </div>
  <div class="edbody">
    <div class="edtools" id="tools">
      <button class="tool" data-tool="select" title="선택 · 이동 · 점 편집 (V)"><svg viewBox="0 0 20 20"><path d="M5 2.5l11 6.2-4.9 1.3-2.4 4.8z" fill="currentColor"/></svg><kbd>V</kbd></button>
      <button class="tool" data-tool="rect" title="사각형 (R) · Shift: 정사각형"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.7"><rect x="3.5" y="5" width="13" height="10" rx="1"/></svg><kbd>R</kbd></button>
      <button class="tool" data-tool="ellipse" title="타원 (E) · Shift: 원"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.7"><ellipse cx="10" cy="10" rx="7" ry="5.5"/></svg><kbd>E</kbd></button>
      <button class="tool" data-tool="poly" title="다각형 (P) · 클릭으로 점 추가, 첫 점·더블클릭·Enter로 닫기"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"><path d="M10 3l7 5-2.7 8H5.7L3 8z"/></svg><kbd>P</kbd></button>
      <button class="tool" data-tool="pen" title="자유곡선 (F)"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><path d="M2.5 14c2-6 4-9 6-6s3 6 5 2 2.5-6 4-6"/></svg><kbd>F</kbd></button>
      <button class="tool" data-tool="hand" title="화면 이동 (H) · 언제든 Space+드래그"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M10 2v16M2 10h16M10 2L7.8 4.2M10 2l2.2 2.2M10 18l-2.2-2.2M10 18l2.2-2.2M2 10l2.2-2.2M2 10l2.2 2.2M18 10l-2.2-2.2M18 10l-2.2 2.2"/></svg><kbd>H</kbd></button>
    </div>
    <div class="edstage" id="edStage">
      <svg id="edSvg" viewBox="0 0 1000 1000" preserveAspectRatio="xMidYMid meet"></svg>
      <div class="edhint" id="edHint"></div>
      <div class="zoombar">
        <button data-z="out" title="축소 (-)">−</button>
        <button data-z="fit" id="zoomPct" title="화면에 맞춤 (Ctrl+0)">100%</button>
        <button data-z="in" title="확대 (+)">+</button>
      </div>
    </div>
    <aside class="edside">
      <section class="grp">
        <div class="lbl">레이어 · 개체</div>
        <div id="objList"></div>
      </section>
      <section class="grp">
        <div class="lbl">선택한 개체</div>
        <div id="props" class="grp"></div>
      </section>
      <section class="grp">
        <div class="lbl">설정</div>
        <label class="ctl">팔레트
          <select id="palSel">
            <option value="oyn">주황 · 노랑 · 남색</option>
            <option value="rgb">빨강 · 초록 · 파랑</option>
          </select>
        </label>
        <label class="ctl">공통 휘도 Y <input type="range" id="ySl" min="0.1" max="0.6" step="0.01"><output id="yOut"></output></label>
        <div class="row">
          <button class="btn" id="btnClear" title="현재 레이어의 편집 가능한 도형을 모두 지움">레이어 비우기</button>
          <button class="btn" id="btnExample">예시로 되돌리기</button>
        </div>
        <div class="row">
          <button class="btn" id="btnExport">JSON 저장</button>
          <button class="btn" id="btnImport">JSON 열기</button>
          <input type="file" id="fileIn" accept=".json,application/json" hidden>
        </div>
      </section>
    </aside>
  </div>
</section>

<footer class="hint">
  뷰어: <kbd>9</kbd> 풀컬러 · <kbd>6</kbd> 흑백 · <kbd>1</kbd><kbd>2</kbd><kbd>3</kbd> 색 채널 &nbsp;|&nbsp;
  편집: <kbd>V</kbd><kbd>R</kbd><kbd>E</kbd><kbd>P</kbd><kbd>F</kbd><kbd>H</kbd> 도구 · <kbd>Enter</kbd> 점 편집 전환 · <kbd>L</kbd> 고정 · <kbd>Del</kbd> 삭제 · <kbd>Ctrl</kbd>+<kbd>D</kbd> 복제 · <kbd>Ctrl</kbd>+<kbd>Z</kbd> 되돌리기 · 휠 확대 · <kbd>Space</kbd>+드래그 이동
</footer>

<script>
(() => {
'use strict';
const $ = s => document.querySelector(s);
const $$ = s => [...document.querySelectorAll(s)];
const VB = 1000;
const ACC = '#22d3ee';
const LAYERS = ['A', 'B', 'G'];

/* ---------------- 색 계산 ----------------
   흑백 변환 = 상대 휘도 Y (선형 sRGB, Rec.709 가중치).
   각 채널 색은 OKLCH 색상(hue)으로 고르고, 명도를 이분법으로 풀어서 Y가 정확히 같게 만든다.
   8비트 양자화 뒤에도 Y가 목표값에 가장 가까운 정수 RGB를 다시 찾는다. */
const toLin = c => c <= 0.04045 ? c / 12.92 : Math.pow((c + 0.055) / 1.055, 2.4);
const toEnc = c => c <= 0.0031308 ? 12.92 * c : 1.055 * Math.pow(c, 1 / 2.4) - 0.055;
const clamp01 = v => Math.min(1, Math.max(0, v));
const lum = ([r, g, b]) => 0.2126 * r + 0.7152 * g + 0.0722 * b;
const lin8 = c8 => c8.map(v => toLin(v / 255));
const enc8 = lin => lin.map(v => Math.round(toEnc(clamp01(v)) * 255));
const hex = c8 => '#' + c8.map(v => v.toString(16).padStart(2, '0')).join('');

function oklch(L, C, h) {

  requestAnimationFrame(() => { fitView(); renderEditorUI(); });
}
$('#btnMax').addEventListener('click', () => setMax(!state.max));

$('#objList').addEventListener('click', e => {
  const b = e.target.closest('[data-act]'); if (!b) return;
  const act = b.dataset.act;
  if (act === 'target') setTarget(b.dataset.l);
  else if (act === 'pick') pick(b.dataset.id);
  else if (act === 'lock') toggleFixed(b.dataset.id);
  else if (act === 'lockAll') {
    const arr = state.shapes[b.dataset.l], all = arr.every(s => s.fixed);
    commit(() => arr.forEach(s => { if (all) delete s.fixed; else s.fixed = true; }));
  }
});
$('#props').addEventListener('click', e => {
  const b = e.target.closest('[data-act]'); if (!b || b.disabled) return;
  const s = findSel(); if (!s) return;
  const act = b.dataset.act;
  if (act === 'fix') { if (!!s.fixed !== (b.dataset.v === '1')) toggleFixed(s.id); }
  else if (act === 'mode') setSelMode(b.dataset.v);
  else if (act === 'dup') duplicateSel();
  else if (act === 'del') deleteSel();
  else if (act === 'applyLayer') {
    const T = state.target, m = s.mask ? { ...s.mask } : null;
    commit(() => {
      state.defMask[T] = m;
      state.shapes[T].forEach(x => { if (m) x.mask = { ...m }; else delete x.mask; });
    });
  }
});
$('#props').addEventListener('change', e => {
  if (e.target.id !== 'maskSel') return;
  const s = findSel(); if (!s) return;
  const v = e.target.value;
  commit(() => {
    if (!v) delete s.mask;
    else { const [src, d] = v.split(':'); if (canMask(state.target, src)) s.mask = { src, inv: d === 'out' }; }
  });
});

$('#btnClear').addEventListener('click', () => {
  const T = state.target;
  if (!state.shapes[T].some(s => !s.fixed)) return;
  commit(() => { state.shapes[T] = state.shapes[T].filter(s => s.fixed); state.selId = null; });
});
$('#btnExample').addEventListener('click', () => commit(() => {
  state.shapes = EXAMPLE(); state.defMask = { A: null, B: null, G: null }; state.selId = null;
}));
$('#btnExport').addEventListener('click', () => {
  const data = { shapes: state.shapes, palette: state.palette, Y: state.Y, defMask: state.defMask };
  const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'isoluminance.json'; a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
});
$('#btnImport').addEventListener('click', () => $('#fileIn').click());
$('#fileIn').addEventListener('change', async e => {
  const f = e.target.files[0]; e.target.value = ''; if (!f) return;
  try {
    const d = JSON.parse(await f.text());
    if (!validShapes(d.shapes)) throw new Error('shapes');
    pushHist(); state.shapes = d.shapes; state.selId = null;
    if (PALETTES[d.palette]) state.palette = d.palette;
    if (typeof d.Y === 'number') state.Y = d.Y;
    state.defMask = Object.assign({ A: null, B: null, G: null }, d.defMask || {});
    sanitizeMasks(); computeColors(); save(); renderAll();
  } catch (err) { $('#edHint').textContent = '불러오기 실패: 이 도구에서 저장한 JSON 파일이 아닙니다.'; }
});
$('#palSel').addEventListener('change', e => { state.palette = e.target.value; computeColors(); save(); renderAll(); });
$('#ySl').addEventListener('input', e => { state.Y = +e.target.value; computeColors(); save(); renderAll(); });

/* ---------------- 키보드 ---------------- */
document.addEventListener('keydown', e => {
  if (e.target.closest && e.target.closest('input, select, textarea')) return;
  const k = e.key, mod = e.ctrlKey || e.metaKey;
  if (k === ' ') { e.preventDefault(); if (!spaceDown) { spaceDown = true; renderEditorUI(); } return; }
  if (mod && k.toLowerCase() === 'z') { e.preventDefault(); undo(); return; }
  if (mod && k.toLowerCase() === 'd') { e.preventDefault(); duplicateSel(); return; }
  if (mod && k === '0') { e.preventDefault(); fitView(); return; }
  if (mod || e.altKey) return;
  if (VIEW_KIND[k]) { selectPanel(k); return; }
  if (k === '+' || k === '=') { zoomAt(1.25); return; }
  if (k === '-' || k === '_') { zoomAt(0.8); return; }
  const tool = { v: 'select', r: 'rect', e: 'ellipse', p: 'poly', f: 'pen', h: 'hand' }[k.toLowerCase()];
  if (tool) { setTool(tool); return; }
  const s = findSel();
  if (k === 'l' || k === 'L') { if (s) toggleFixed(s.id); }
  else if (k === 'Delete' || k === 'Backspace') {
    if (!s) return;
    e.preventDefault();
    if (!(state.selMode === 'node' && deleteNode())) deleteSel();
  } else if (k === 'Enter') {
    if (draft && draft.t === 'poly') finishPoly();
    else if (s && !s.fixed) setSelMode(state.selMode === 'node' ? 'transform' : 'node');
  } else if (k === 'Escape') {
    if (draft) draft = null;
    else if (state.selId) { state.selId = null; state.selNode = null; }
    else if (state.max) { setMax(false); return; }
    renderEditor(); renderEditorUI();
  } else if (k.startsWith('Arrow') && s && !s.fixed) {
    e.preventDefault();
    const d = e.shiftKey ? 10 : 1, dx = k === 'ArrowLeft' ? -d : k === 'ArrowRight' ? d : 0, dy = k === 'ArrowUp' ? -d : k === 'ArrowDown' ? d : 0;
    if (Date.now() - lastNudge > 600) pushHist();
    lastNudge = Date.now();
    translate(s, clone(s), dx, dy); save(); renderShapesLive();
  }
});
document.addEventListener('keyup', e => { if (e.key === ' ') { spaceDown = false; renderEditorUI(); } });
window.addEventListener('blur', () => { spaceDown = false; });
window.addEventListener('resize', renderEditor);

load();
computeColors();
applyView();
renderAll();
setStatus(null);
})();
</script>
</body>
</html>
