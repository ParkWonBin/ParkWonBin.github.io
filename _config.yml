title: wbpark Dev Blog
author: wbpark
email: pwb1128@gmail.com
description: >-
  직접 만든 웹앱과 그림, 공부한 기록을 모아 두는 곳
lang: ko
timezone: Asia/Seoul

url: "https://wbpark.app"
baseurl: ""
permalink: pretty

# 이 저장소 — 웹앱 카드의 '소스' 링크 기본값에 쓰입니다.
repository: ParkWonBin/ParkWonBin.github.io
source_branch: jekyll-blog

google_analytics: G-3MML9FLTTZ

# ── 상단 메뉴 ──────────────────────────────────────────────
nav:
  - title: 웹앱
    url: /
  - title: 그림
    url: /drawing/
  - title: 글
    url: /posts/
  - title: About
    url: /about/

# ── 웹앱 카테고리 (홈 화면에 이 순서대로 나옵니다) ──────────
# 앱 목록 자체는 _data/apps.yml 에 있습니다.
#   id      apps.yml 의 category 값. 카드 색은 assets/css/site.css 의 --<id> · --<id>-soft
#   legacy  (선택) 예전 분류 id — wbpark.app/#<예전 id> 링크도 이 분류로 열린다
app_categories:
  - id: learn
    label: 배우기
    title: 📚 배우기
    desc: 읽고 배우는 자료와 시각화
    legacy: [info]
  - id: make
    label: 만들기
    title: 🛠️ 만들기
    desc: 이미지 · 색 · 효과 · 파일을 만드는 도구와 3D 전시
    legacy: [tech, art, demo]
  - id: play
    label: 놀기
    title: 🎲 놀기
    desc: 게임과 게임 보조 도구
    legacy: [game]
  - id: lab
    label: 실험실
    title: 🧪 실험실
    desc: 공부하며 만든 기술 실험
    legacy: [test]

# 이 기간(일) 안에 추가된 앱에는 NEW, 업데이트된 앱에는 '업데이트' 표시
new_badge_days: 30

# ── 푸터 링크 ──────────────────────────────────────────────
# icon: assets/minima-social-icons.svg 안의 아이콘 이름 / image: 이미지 경로
social_links:
  - name: GitHub
    url: https://github.com/ParkWonBin
    icon: github
  - name: YouTube
    url: https://youtube.com/@AIPenguinStudio
    icon: youtube
  - name: Instagram
    url: https://instagram.com/wbpark14
    icon: instagram
  - name: LinkedIn
    url: https://www.linkedin.com/in/wbpark14
    icon: linkedin
  - name: Tistory
    url: https://phy64ev1.tistory.com/
    mask: /assets/images/tistory.svg
  - name: Naver Blog
    url: https://blog.naver.com/wbpark14
    image: /assets/images/naverblog.png
  - name: Facebook
    url: https://www.facebook.com/wbpark14
    icon: facebook
  - name: Pinterest
    url: https://www.pinterest.com/wbpark14
    icon: pinterest

# ── 빌드 설정 ──────────────────────────────────────────────
plugins:
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-seo-tag

markdown: kramdown
kramdown:
  input: GFM

sass:
  style: compressed

defaults:
  # 모든 페이지의 기본 공유 미리보기 이미지 (node tools/thumbs.js --og 로 다시 만들 수 있음)
  - scope:
      path: ""
    values:
      image: /assets/images/og-default.jpg
  # 글: _posts/YYYY-MM-DD-제목.md → /posts/제목/
  - scope:
      path: ""
      type: posts
    values:
      layout: post
      permalink: /posts/:title/

exclude:
  - README.md
  - CLAUDE.md
  - TODO.md
  - tools/
  - serve.bat
  - Gemfile
  - Gemfile.lock
  - .sass-cache/
  - .jekyll-cache/
  - node_modules/
  - vendor/
  - webapps/flood_map/convert_shp.mjs
  - webapps/health/extract_urls.ps1
