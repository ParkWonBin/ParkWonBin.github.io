<footer class="site-footer">
  <div class="container footer-inner">
    <div class="footer-profile">
      <img src="{{ '/assets/images/profile.jpg' | relative_url }}" alt="" width="44" height="44">
      <div>
        <strong>{{ site.author | escape }}</strong>
        <a href="mailto:{{ site.email }}">{{ site.email }}</a>
      </div>
    </div>
    <ul class="social">
      {%- for s in site.social_links -%}
      <li>
        <a href="{{ s.url }}" title="{{ s.name }}" aria-label="{{ s.name }}" rel="me noopener" target="_blank">
          {%- if s.icon -%}
            <svg aria-hidden="true"><use href="{{ '/assets/minima-social-icons.svg' | relative_url }}#{{ s.icon }}"></use></svg>
          {%- elsif s.mask -%}
            <span class="mask-icon" style="--mask: url('{{ s.mask | relative_url }}')" aria-hidden="true"></span>
          {%- else -%}
            <img src="{{ s.image | relative_url }}" alt="" width="18" height="18">
          {%- endif -%}
        </a>
      </li>
      {%- endfor -%}
    </ul>
  </div>
  <div class="container footer-meta">
    <span>© {{ site.time | date: "%Y" }} {{ site.author | escape }}</span>
    <a href="{{ '/feed.xml' | relative_url }}">RSS</a>
    <a href="https://github.com/{{ site.repository }}">사이트 소스</a>
  </div>
</footer>
